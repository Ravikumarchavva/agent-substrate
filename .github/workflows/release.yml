name: Release

# release-please opens one release PR per component. Merging a release PR
# creates the tag `<component>-v<version>` and a GitHub release; this workflow then publishes artifacts
# for that component from the tag in exact dependency order:
# storage -> identity -> client -> server / agents -> meta.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      data-storage-released: ${{ steps.rp.outputs['data/storage--release_created'] }}
      data-storage-tag: ${{ steps.rp.outputs['data/storage--tag_name'] }}
      identity-released: ${{ steps.rp.outputs['identity/python--release_created'] }}
      identity-tag: ${{ steps.rp.outputs['identity/python--tag_name'] }}
      data-client-released: ${{ steps.rp.outputs['data/client--release_created'] }}
      data-client-tag: ${{ steps.rp.outputs['data/client--tag_name'] }}
      data-server-released: ${{ steps.rp.outputs['data/server--release_created'] }}
      data-server-tag: ${{ steps.rp.outputs['data/server--tag_name'] }}
      data-server-version: ${{ steps.rp.outputs['data/server--version'] }}
      agents-released: ${{ steps.rp.outputs['agents/library--release_created'] }}
      agents-tag: ${{ steps.rp.outputs['agents/library--tag_name'] }}
      agents-version: ${{ steps.rp.outputs['agents/library--version'] }}
      meta-released: ${{ steps.rp.outputs['meta/loamz--release_created'] }}
      meta-tag: ${{ steps.rp.outputs['meta/loamz--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # ── 1. Storage ─────────────────────────────────────────────────────────────
  publish-loamz-data-storage:
    name: PyPI / loamz-data-storage
    needs: release-please
    if: needs.release-please.outputs.data-storage-released == 'true'
    runs-on: ubuntu-latest
    environment: pypi-loamz-data-storage
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.data-storage-tag }}
      - uses: astral-sh/setup-uv@v6
      - run: uv build --package loamz-data-storage
      - run: uv publish

  # ── 2. Identity ────────────────────────────────────────────────────────────
  publish-loamz-identity:
    name: PyPI / loamz-identity
    needs: [release-please, publish-loamz-data-storage]
    if: always() && needs.release-please.outputs.identity-released == 'true' && (needs.publish-loamz-data-storage.result == 'success' || needs.publish-loamz-data-storage.result == 'skipped')
    runs-on: ubuntu-latest
    environment: pypi-loamz-identity
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.identity-tag }}
      - uses: astral-sh/setup-uv@v6
      - run: uv build --package loamz-identity
      - run: uv publish

  # ── 3. Client ──────────────────────────────────────────────────────────────
  publish-loamz-data-client:
    name: PyPI / loamz-data-client
    needs: [release-please, publish-loamz-identity]
    if: always() && needs.release-please.outputs.data-client-released == 'true' && (needs.publish-loamz-identity.result == 'success' || needs.publish-loamz-identity.result == 'skipped')
    runs-on: ubuntu-latest
    environment: pypi-loamz-data-client
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.data-client-tag }}
      - uses: astral-sh/setup-uv@v6
      - run: uv build --package loamz-data-client
      - run: uv publish

  # ── 4. Server & Agents ─────────────────────────────────────────────────────
  publish-loamz-data-server:
    name: PyPI / loamz-data-server
    needs: [release-please, publish-loamz-data-client]
    if: always() && needs.release-please.outputs.data-server-released == 'true' && (needs.publish-loamz-data-client.result == 'success' || needs.publish-loamz-data-client.result == 'skipped')
    runs-on: ubuntu-latest
    environment: pypi-loamz-data-server
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.data-server-tag }}
      - uses: astral-sh/setup-uv@v6
      - run: uv build --package loamz-data-server
      - run: uv publish

  publish-loamz-agents:
    name: PyPI / loamz-agents
    needs: [release-please, publish-loamz-data-client]
    if: always() && needs.release-please.outputs.agents-released == 'true' && (needs.publish-loamz-data-client.result == 'success' || needs.publish-loamz-data-client.result == 'skipped')
    runs-on: ubuntu-latest
    environment: pypi-loamz-agents
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.agents-tag }}
      - uses: astral-sh/setup-uv@v6
      - run: uv build --package loamz-agents
      - run: uv publish

  # ── 5. Meta package ────────────────────────────────────────────────────────
  publish-loamz:
    name: PyPI / loamz
    needs: [release-please, publish-loamz-data-server, publish-loamz-agents]
    if: always() && needs.release-please.outputs.meta-released == 'true' && (needs.publish-loamz-data-server.result == 'success' || needs.publish-loamz-data-server.result == 'skipped') && (needs.publish-loamz-agents.result == 'success' || needs.publish-loamz-agents.result == 'skipped')
    runs-on: ubuntu-latest
    environment: pypi-loamz
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.meta-tag }}
      - uses: astral-sh/setup-uv@v6
      - run: uv build --package loamz
      - run: uv publish

  # ── Container images (GHCR) ────────────────────────────────────────────────
  image-loamz-data:
    name: Image / loamz-data
    needs: release-please
    if: needs.release-please.outputs.data-server-released == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_image.yml
    with:
      image: loamz-data
      ref: ${{ needs.release-please.outputs.data-server-tag }}
      version: ${{ needs.release-please.outputs.data-server-version }}
      context: .
      file: deploy/docker/loamz-data.Dockerfile

  image-loamz-agents:
    name: Image / loamz-agents
    needs: release-please
    if: needs.release-please.outputs.agents-released == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/_image.yml
    with:
      image: loamz-agents
      ref: ${{ needs.release-please.outputs.agents-tag }}
      version: ${{ needs.release-please.outputs.agents-version }}
      context: .
      file: deploy/docker/loamz-agents.Dockerfile
