name: agent-framework

services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentdb
    volumes:
      - pgdata18:/var/lib/postgresql
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql
      - ./init-chatbotdb.sh:/docker-entrypoint-initdb.d/20-chatbotdb.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - workspaces:/data/workspaces
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agentdb
      REDIS_URL: redis://redis:6379/0
      OTLP_ENDPOINT: http://tempo:4318
      # "local" = per-user workspace filesystem (uploads + code-interpreter
      # workdir, one source of truth — see capabilities/storage/workspace.py).
      # Set FILE_STORE_BACKEND=s3 (and the FILE_STORE_* vars below) to use
      # the minio service instead; both stay defined here for convenience.
      FILE_STORE_BACKEND: ${FILE_STORE_BACKEND:-local}
      FILE_STORE_ROOT: /data/workspaces
      FILE_STORE_BUCKET: agent-files
      FILE_STORE_ENDPOINT: http://minio:9000
      FILE_STORE_REGION: us-east-1
      FILE_STORE_ACCESS_KEY: minioadmin
      FILE_STORE_SECRET_KEY: ${FILE_STORE_SECRET_KEY:-minioadmin}
      ENABLE_BUILDER: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://host.docker.internal:3000}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://host.docker.internal:3001}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Ravi UI}
      CHAT_MODEL: ${CHAT_MODEL:-groq/llama-3.3-70b-versatile}
      TTS_MODEL: ${TTS_MODEL:-google/gemini-3.1-flash-tts-preview}
      TTS_VOICE: ${TTS_VOICE:-Kore}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # Empty by default — chat attachments fall back to the lightweight
      # pypdf path for PDFs. Only set this if you're also running the
      # docling service (docker compose --profile docling up):
      #   DOCLING_SERVICE_URL=http://docling:8080 docker compose --profile docling up
      DOCLING_SERVICE_URL: ${DOCLING_SERVICE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  substrate-ui:
    profiles:
      - ui
    build:
      context: ../../../substrate-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://backend:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/substrate_ui
    depends_on:
      - backend
      - postgres

  tempo:
    image: grafana/tempo:2.10.0
    user: root
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - ./tempo/data:/tmp/tempo
    ports:
      - "3200:3200"   # HTTP
      - "9095:9095"   # gRPC
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.4
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - promtaildata:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3099:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9000
    # profiles:
    #   - mcp
    init: true
    restart: unless-stopped

  # ── MinIO (S3-compatible object store for file storage) ────────────────
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"   # S3 API
      - "9101:9001"   # MinIO Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # profiles:
    #   - storage

  docling:
    profiles:
      - docling
    build:
      context: ../..
      dockerfile: deployment/docker/docling.Dockerfile
    environment:
      DOCLING_OCR_ENABLED: ${DOCLING_OCR_ENABLED:-true}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "8021:8080"
    restart: unless-stopped

  # LEGACY / opt-in. The default SANDBOX_RUNTIME=bubblewrap needs no container
  # here at all (see capabilities/tools/code_interpreter/.../runtimes/bubblewrap.py)
  # — it runs code directly on the host in a Linux namespace. This service
  # builds the same image real K8s SandboxTemplates run
  # (code_interpreter/agent-sandbox/README.md) — useful for manually exercising
  # the sandbox_runtime.py HTTP server (curl its /ci/run etc.) without a real
  # cluster. K8sRuntime itself always talks to a real cluster via the
  # kubernetes-sigs/agent-sandbox controller, never a bare HTTP URL like this.
  code-interpreter-sandbox:
    profiles:
      - sandbox
    build:
      context: ../..
      dockerfile: src/substrate/capabilities/tools/code_interpreter/code_interpreter/agent-sandbox/Dockerfile
    environment:
      CODE_INTERPRETER_WORKSPACE: /app/workspace
    volumes:
      # Same directory the "local" FILE_STORE_BACKEND uses (config.py's
      # FILE_STORE_ROOT) — chat uploads land here, so code executed in this
      # container can open them directly.
      - ../../data/workspaces:/app/workspace
    ports:
      - "8023:8888"
    restart: unless-stopped

  # ONLYOFFICE Document Server — editable Word/Excel/PowerPoint in the panel.
  # Opt-in (heavy ~2GB image). The JWT_SECRET here MUST equal the backend's
  # ONLYOFFICE_JWT_SECRET so the signed editor config + save callbacks verify.
  # See serving/monolith/routes/onlyoffice.py for the integration + networking.
  onlyoffice:
    profiles:
      - onlyoffice
    image: onlyoffice/documentserver:latest
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-me-onlyoffice-secret}
      JWT_HEADER: Authorization
    ports:
      - "8024:80"
    # The doc server fetches documents from / saves back to the backend via
    # ONLYOFFICE_INTERNAL_CALLBACK_BASE (host.docker.internal:8000 when the
    # backend runs on the host with `uv run start`). On Linux that name only
    # resolves with the host-gateway mapping — same as the backend service.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata18:
  redisdata:
  lokidata:
  promtaildata:
  miniodata:
  workspaces:
