name: Image / document-intelligence

# Runnable service images (CPU + GPU) for the heavy PaddleOCR runtime; never `pip install`-ed by consumers.
# Ported from the agent-substrate repo. Runs on changes to its inputs on main, or manually.
on:
  push:
    branches: [main]
    paths:
      - data/document-intelligence/**
      - data/inference-pool/**
      - agents/agent-substrate/src/**
      - deploy/docker/document-intelligence*.Dockerfile
      - .github/workflows/docker-document-intelligence.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-document-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: deploy/docker/document-intelligence.Dockerfile
          - variant: gpu
            dockerfile: deploy/docker/document-intelligence.gpu.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image path
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/document-intelligence" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.variant }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.variant }}
          cache-from: type=gha,scope=document-intelligence-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=document-intelligence-${{ matrix.variant }}
