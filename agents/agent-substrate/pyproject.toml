[project]
name = "agent-substrate"
version = "0.1.0"
description = "Production-ready async Python framework for building autonomous AI agents with tool calling, memory, and durable execution."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ravikumar Chavva", email = "chavvaravikumarreddy2004@gmail.com" },
]
keywords = ["ai", "agents", "llm", "multi-agent", "autonomous", "fastapi", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# Base install: the agent loop, LLM provider clients, and the FastAPI/Postgres/
# Redis serving stack. Everything a tool lazily imports only when that specific
# capability is used (web browsing/search, the K8s code interpreter, PDF/RAG
# loaders, S3 storage) lives in `[project.optional-dependencies]` below instead
# — install the matching extra, or accept that tool's clean "not installed"
# error at call time rather than a hard dependency on every install.
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "openai>=2.15.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-json-logger>=2.0.7",
    "tiktoken>=0.12.0",
    "fastapi>=0.128.0",
    "redis[hiredis]>=5.0.0",
    "sqlalchemy>=2.0.46",
    "asyncpg>=0.30.0",
    # Never imported directly in src/ — SQLAlchemy loads it dynamically for
    # the monolith's `postgresql+psycopg://` DATABASE_URL (the ORM engine
    # behind Thread/ScheduledTask/Feedback). `asyncpg` above is the separate,
    # directly-used driver for the durable runtime's raw asyncpg pool.
    "psycopg[binary]>=3.2.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "rich>=14.3.2",
    "pyjwt>=2.12.0",
    "cryptography>=46.0.6",
    "apscheduler>=4.0.0a5",
    "anthropic>=0.95.0",
    "google-genai>=1.73.0",
    "msgspec>=0.21.1",
    "pillow>=10.4.0",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi<0.60b1",
    "httpx2>=2.7.0",
]

[project.optional-dependencies]
# Web browsing/search tools (WebSearchTool DuckDuckGo fallback, ReadUrlTool
# crawl4ai fallback, WebSurferTool). Playwright alone is ~140MB; crawl4ai pulls
# a further ~250MB of transitive deps (scipy/pandas/onnxruntime via its own
# extras) for what is only ever the free-tier fallback behind Tavily/Exa.
web = [
    "ddgs>=9.14.4",
    "crawl4ai>=0.8.7",
    "playwright>=1.60.0",
    "exa-py>=2.14.0",
    "tavily-python>=0.7.26",
]
# K8s agent-sandbox code execution (SANDBOX_RUNTIME=k8s). Pulls the full
# kubernetes + kubernetes_asyncio client libraries (~85MB) — only needed if
# you're actually running sandbox pods against a real cluster. The default
# bubblewrap runtime needs none of it.
code = ["k8s-agent-sandbox>=0.4.6"]
# Data-science packages the code_interpreter tool advertises to the model.
# With SANDBOX_RUNTIME=bubblewrap the sandbox executes using an interpreter on
# THIS host (see SANDBOX_PYTHON), so these must be importable from that
# interpreter's environment — previously they only existed inside the sandbox
# container image. Install into the engine's own env (simplest), or into a
# dedicated venv and point SANDBOX_PYTHON at it to keep them out of the engine.
sandbox = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "reportlab>=4.2.0",
    "polars>=1.0.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "scikit-learn>=1.5.0",
    "pdfplumber>=0.11.0",
]
# PDF loading for the knowledge/RAG pipeline (PDFLoader — the local,
# no-extraction-service fallback path).
rag = ["pypdf>=6.13.0"]
# Managed RAG via Pinecone Assistant (RAG_BACKEND=pinecone) — parsing,
# chunking, embedding, storage, and retrieval all run on Pinecone's side, so
# none of the local `rag`/`extraction` extras above are needed with this backend.
rag-pinecone = ["pinecone>=9.0.0"]
# S3-compatible object storage backend for FILE_STORE_BACKEND=s3 (the default,
# "local", needs neither of these).
s3 = ["aiobotocore>=3.7.0", "botocore>=1.43.0"]
# Everything the reference monolith server (`make infra-up && uv run start`)
# constructs by default — install this if you're running agent-substrate
# itself, not just importing it as a library. `make sync` uses this.
server = ["agent-substrate[web,code,rag,s3,sandbox]"]
# Layout-aware document parsing (PDF layout, chart/table detection, OCR) via
# PaddleOCR, plus multimodal embedding (SigLIP) and reranking (MiniLM
# cross-encoder) via sentence-transformers — used only by
# `serving/services/extraction/`, never imported from the main API process.
# `paddlepaddle` is pinned to the exact CPU-wheel version verified working on
# this project's target hardware (see `[tool.uv.sources]` below — it comes
# from PaddlePaddle's own CPU package index, not plain PyPI, and needs a
# runtime mkldnn-disable workaround for CPUs without AVX-512; see
# `serving/services/extraction/pipeline.py::_disable_mkldnn`). Not needed
# unless you actually run the extraction service — the base install already
# covers CSV/JSON/text/pypdf-based PDF loading without it.
extraction = [
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle==3.3.0",
    "sentence-transformers>=5.7.0",
    # Explicit direct dependency (sentence-transformers already pulls it
    # transitively) — the `[tool.uv.sources]` CPU-index override below only
    # applies to packages declared directly in this project, not purely
    # transitive ones.
    "torch>=2.0.0",
]

[project.urls]
Homepage = "https://docs.agent-substrate.com"
Documentation = "https://docs.agent-substrate.com"
Repository = "https://github.com/Ravikumarchavva/agent-substrate"
Issues = "https://github.com/Ravikumarchavva/agent-substrate/issues"

[project.scripts]
substrate = "substrate.cli:main"
start = "substrate.cli:start_main"
start-all = "substrate.cli:start_all_main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "substrate"

# paddlepaddle's CPU wheel — plain PyPI also serves a CPU build, but the
# `extraction` extra's pinned version was verified (via this project's own
# benchmarking) against PaddlePaddle's official CPU package index, not PyPI's.
[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

# torch's default PyPI wheel bundles the full NVIDIA CUDA/cuDNN/NCCL runtime
# even for CPU-only use (confirmed: nvidia-cufile, nvidia-curand, etc. all
# pulled in by a plain `torch` install here) — sentence-transformers (the
# `extraction` extra) depends on torch transitively, so route it to
# PyTorch's own CPU-only wheel index instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
exclude = ["notebooks/", "examples/", ".venv"]

[tool.ruff.lint]

# ---------------------------------------------------------------------------
# import-linter — enforce the layered architecture so the kernel stays frozen.
# Layers (strictly downward dependencies only):
#   fabric (L3)  ←  capabilities (L2)  ←  agents (L1)  ←  kernel (L0)
# Run with: uv run lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["substrate"]

[[tool.importlinter.contracts]]
name = "four stack layers"
type = "layers"
layers = [
    "substrate.fabric",        # L3 — orchestration programs (flows, evals, durable)
    "substrate.capabilities",  # L2 — tools, skills, knowledge, connectors
    "substrate.agents",        # L1 — core intelligence, LLM, guardrails, middleware
    "substrate.kernel",        # L0 — pure contracts: Protocols, dataclasses, enums
]

[[tool.importlinter.contracts]]
name = "agents cannot import capabilities or fabric"
type = "forbidden"
source_modules = ["substrate.agents"]
forbidden_modules = ["substrate.capabilities", "substrate.fabric"]

[[tool.importlinter.contracts]]
name = "capabilities cannot import fabric"
type = "forbidden"
source_modules = ["substrate.capabilities"]
forbidden_modules = ["substrate.fabric"]

[[tool.importlinter.contracts]]
name = "kernel is independent"
type = "forbidden"
source_modules = ["substrate.kernel"]
forbidden_modules = [
    "substrate.agents",
    "substrate.capabilities",
    "substrate.fabric",
    "substrate.integrations",
    "substrate.serving",
    "substrate.config",
    "substrate.logger",
]

[[tool.importlinter.contracts]]
name = "serving cannot import agents or capabilities"
type = "forbidden"
source_modules = ["substrate.serving"]
forbidden_modules = ["substrate.agents", "substrate.capabilities", "substrate.fabric"]
# infrastructure/ is orthogonal — it may cross-cut to agents/capabilities by design.
# We only want to catch DIRECT imports from serving/ to agents/capabilities.
allow_indirect_imports = "true"
ignore_imports = [
    # current_thread_id ContextVar spans both chat.py and capabilities/task_manager
    "substrate.serving.monolith.routes.chat -> substrate.capabilities.tools.task_manager.tool",
    # WebHITLBridge delivers human-input events; must know the capability type
    "substrate.serving.monolith.sse.bridge -> substrate.capabilities.tools.human_input",
    # pipelines/triggers routes need DTOs defined in capabilities (PipelineDef, TriggerDef, ConditionDef)
    "substrate.serving.monolith.routes.pipelines -> substrate.capabilities.pipeline.engine",
    "substrate.serving.monolith.routes.triggers -> substrate.capabilities.triggers.conditions",
    "substrate.serving.monolith.routes.triggers -> substrate.capabilities.triggers.scheduler",
    # agent_runtime: in-memory fallback Runtime (for RUNTIME_BACKEND=memory env)
    "substrate.serving.services.agent_runtime.app -> substrate.agents.runtime",
    # tool_executor IS a capability executor by design
    "substrate.serving.services.tool_executor.app -> substrate.agents.storage.tasks",
    "substrate.serving.services.tool_executor.app -> substrate.capabilities.tools.code_interpreter",
    "substrate.serving.services.tool_executor.app -> substrate.capabilities.tools.code_interpreter.code_interpreter.runtimes.factory",
    "substrate.serving.services.tool_executor.app -> substrate.capabilities.tools.task_manager.tool",
    "substrate.serving.services.tool_executor.app -> substrate.capabilities.tools.web.surfer",
    # files/workspace routes need WorkspaceFileStore/WorkspaceQuotaExceededError
    "substrate.serving.monolith.routes.files -> substrate.capabilities.storage.workspace",
    "substrate.serving.monolith.routes.workspace -> substrate.capabilities.storage.workspace",
    "substrate.serving.monolith.routes.onlyoffice -> substrate.capabilities.storage.workspace",
    # chat_context inlines PDF attachment text using the existing PDFLoader
    # (pypdf/pdfplumber) rather than duplicating extraction logic
    "substrate.serving.monolith.routes.chat_context -> substrate.capabilities.knowledge.loaders.pdf_loader",
    # extraction service + client — same pattern as code_interpreter's http_client
    "substrate.serving.monolith.routes.chat_context -> substrate.capabilities.knowledge.extraction_client",
    "substrate.serving.services.extraction.schemas -> substrate.capabilities.knowledge.extraction_client",
]

# Orthogonal peers (not part of the layer stack):
# integrations/ — concrete I/O ports (LLM clients, memory backends, vector stores)
# serving/      — FastAPI monolith + microservices + shared infra
# These carry cross-layer edges by design (e.g. an integration implements a kernel
# Protocol; serving wires all layers together in lifespan).
