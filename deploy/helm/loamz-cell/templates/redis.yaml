{{- if and .Values.redis.enabled .Values.redis.bundled.enabled }}
{{- $full := printf "%s-redis" (include "cell.fullname" .) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}
  labels: {{- include "cell.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "cell.selector" (dict "root" . "component" "redis") | nindent 4 }}
  ports: [ { name: redis, port: 6379 } ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $full }}
  labels: {{- include "cell.labels" . | nindent 4 }}
spec:
  serviceName: {{ $full }}
  replicas: 1
  selector:
    matchLabels: {{- include "cell.selector" (dict "root" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cell.labels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext: { fsGroup: 999, runAsUser: 999, runAsGroup: 999, runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: {{ .Values.redis.bundled.image }}
          command: [sh, -c, 'exec redis-server --requirepass "$REDIS_PASSWORD" --appendonly yes']
          env:
            - name: REDIS_PASSWORD
              valueFrom: { {{ include "cell.secretRef" (dict "root" . "key" "redis-password") }} }
          ports: [ { name: redis, containerPort: 6379 } ]
          readinessProbe: { exec: { command: [sh, -c, 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG'] }, periodSeconds: 5 }
          resources: {{- toYaml .Values.redis.bundled.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.redis.bundled.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.redis.bundled.storage }} } }
{{- end }}
