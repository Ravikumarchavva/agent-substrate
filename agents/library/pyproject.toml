[project]
name = "loamz-agents"
version = "0.1.0"
description = "Loamz Agents: durable agents, tools and an agent server, built on Loamz Data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# The engine and its own state, nothing else: importing loamz.agents loads no vendor SDK, driver or web framework.
# Everything that talks to a vendor, a server or the network is an extra named for what it enables.
dependencies = [
    "loamz-data-storage",
    "loamz-identity",
    "pydantic>=2.12.5",
    "opentelemetry-api>=1.20.0",
    # text normalisation for the guardrails (kernel.safety): confusable characters folded before matching
    "confusable-homoglyphs>=3.3.1",
]

[project.optional-dependencies]
# OpenAI and OpenAI-compatible chat/embedding clients (also vLLM, llama.cpp, Ollama, LM Studio)
openai = ["openai>=2.15.0", "tiktoken>=0.12.0", "httpx>=0.27.0", "pillow>=12.0.0"]
anthropic = ["anthropic>=0.95.0", "pillow>=12.0.0"]
gemini = ["google-genai>=1.73.0", "pillow>=12.0.0"]
# local embeddings (brings torch)
sentence-transformers = ["sentence-transformers>=3.0.0"]
# the agent store on PostgreSQL
postgres = ["loamz-data-storage[postgres]"]
# Redis: event bus, session-state cache
redis = ["redis[hiredis]>=5.0.0"]
# MCP tools
mcp = ["mcp>=1.0.0"]
# text-to-speech
tts = ["kokoro>=0.9.4", "soundfile>=0.12.1"]
# skills (YAML front matter) and the spreadsheet skill
tools = ["pyyaml>=6.0.3", "openpyxl>=3.1.0"]
# web search and browsing tools
web = [
    "httpx>=0.27.0",
    "httpx2>=2.7.0",
    "ddgs>=9.14.4",
    "crawl4ai>=0.8.7",
    "playwright>=1.60.0",
    "exa-py>=2.14.0",
    "tavily-python>=0.7.26",
]
# HTTP and e-mail tools, image generation
communication = ["httpx>=0.27.0", "aiosmtplib>=3.0.0"]
# code interpreter: the Kubernetes sandbox and the sandbox's own runtime service
code = ["k8s-agent-sandbox>=0.4.6", "fastapi>=0.128.0", "httpx>=0.27.0"]
# the data-science packages a code sandbox image installs
sandbox = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "reportlab>=4.2.0",
    "polars>=1.0.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "scikit-learn>=1.5.0",
    "pdfplumber>=0.11.0",
]
# model-backed input-safety classifiers (ONNX models from the HF Hub); the guardrail fails open without them
safety = ["pillow>=12.0.0", "onnxruntime>=1.23.0", "tokenizers>=0.20.0", "huggingface-hub>=0.25.0"]
# structured JSON logs (bootstrap.logging)
logging = ["python-json-logger>=2.0.7", "msgspec>=0.21.1"]
# the interactive console and `loamz-agents chat` (configured through Settings)
console = ["rich>=14.3.2", "prompt-toolkit>=3.0.0", "pydantic-settings>=2.12"]
# the agent server: `loamz-agents serve`
server = [
    "loamz-identity[fastapi]",
    "fastapi>=0.128",
    "uvicorn>=0.34",
    "pydantic-settings>=2.12",
    "opentelemetry-sdk>=1.20.0",
    "loamz-agents[logging]",
]
# Loamz Data adapters: files, documents, memory and databases through the data service
data = ["loamz-data-client"]
# the conformance suites and test helpers in loamz.agents.testing
testing = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0", "httpx>=0.27.0"]

[project.scripts]
loamz-agents = "loamz.agents.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "hypothesis>=6.168.3",
    "opentelemetry-sdk>=1.20.0",
    "import-linter>=2.11",
    "httpx>=0.27.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loamz.agents"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = ["-m", "not slow and not integration and not heavy"]
timeout = 120
markers = [
    "slow: needs Docker or minutes of runtime",
    "integration: needs Docker services",
    "heavy: loads a real model into memory (GBs, tens of seconds)",
    "requires_redis: skipped when Redis is not reachable (LOAMZ_TEST_REDIS_URL)",
]
