<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Google Workspace – MCP App</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  :root {
    --bg: #171717;
    --surface: #1f1f1f;
    --surface-muted: #262626;
    --surface-strong: #1a1a1a;
    --text: #f5f5f5;
    --text-muted: #9ca3af;
    --text-soft: #6b7280;
    --border: #2a2a2a;
    --accent: #2563eb;
    --accent-soft: rgba(37,99,235,0.16);
    --danger: #ef4444;
    --notification-bg: #111827;
    --notification-border: #374151;
  }

  html[data-theme="light"] {
    --bg: #fafaf8;
    --surface: #ffffff;
    --surface-muted: #f5f3f0;
    --surface-strong: #f0eeeb;
    --text: #171717;
    --text-muted: #6b7280;
    --text-soft: #9ca3af;
    --border: #e8e5df;
    --accent: #2563eb;
    --accent-soft: rgba(37,99,235,0.10);
    --danger: #dc2626;
    --notification-bg: #ffffff;
    --notification-border: #e5e7eb;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    overflow: hidden; display: flex; flex-direction: column;
  }

  /* Header */
  .header {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px 10px; border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .gws-icon { width: 22px; height: 22px; }
  .header h2 { font-size: 14px; font-weight: 600; color: var(--text); }
  .header .user-info { margin-left: auto; font-size: 11px; color: var(--text-muted); }

  /* Auth banner */
  .auth-banner {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    background: linear-gradient(135deg, #4285F4 0%, #34A853 100%);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .auth-banner.hidden { display: none; }
  .auth-text { flex: 1; color: #fff; font-size: 13px; font-weight: 500; }
  .auth-btn {
    background: #fff; color: #4285F4; border: none;
    padding: 8px 16px; border-radius: 20px; font-size: 12px;
    font-weight: 600; cursor: pointer; transition: all 0.2s;
  }
  .auth-btn:hover { opacity: 0.9; transform: scale(1.03); }

  /* Tabs */
  .tabs {
    display: flex; background: var(--surface-strong); border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1; background: none; border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-muted); font-size: 12px; font-weight: 500;
    padding: 10px 6px; cursor: pointer; transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

  /* Tab views */
  .tab-view { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  .tab-view.hidden { display: none; }

  /* Scrollable content */
  .content-scroll {
    flex: 1; overflow-y: auto; min-height: 0;
    scrollbar-width: thin; scrollbar-color: var(--border) var(--surface-strong);
  }
  .content-scroll::-webkit-scrollbar { width: 6px; }
  .content-scroll::-webkit-scrollbar-track { background: var(--surface-strong); }
  .content-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* Section header */
  .section-hdr {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 16px 6px; font-size: 11px; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  .refresh-btn {
    background: none; border: none; color: var(--accent);
    font-size: 11px; cursor: pointer; padding: 2px 6px;
    border-radius: 4px; transition: background 0.15s;
  }
  .refresh-btn:hover { background: var(--accent-soft); }

  /* Drive file item */
  .file-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; cursor: pointer;
    transition: background 0.15s; border-bottom: 1px solid var(--border);
  }
  .file-item:hover { background: var(--surface-muted); }
  .file-icon { width: 28px; height: 28px; flex-shrink: 0; font-size: 22px; text-align: center; }
  .file-info { flex: 1; min-width: 0; }
  .file-name {
    font-size: 13px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .file-meta { font-size: 11px; color: var(--text-soft); margin-top: 2px; }

  /* Calendar event */
  .event-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .event-item:hover { background: var(--surface-muted); }
  .event-time-col { flex-shrink: 0; width: 52px; }
  .event-time { font-size: 11px; color: var(--accent); font-weight: 600; }
  .event-date { font-size: 10px; color: var(--text-soft); margin-top: 1px; }
  .event-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #4285F4; flex-shrink: 0; margin-top: 4px;
  }
  .event-info { flex: 1; min-width: 0; }
  .event-title {
    font-size: 13px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .event-location { font-size: 11px; color: var(--text-soft); margin-top: 2px; }

  /* Gmail item */
  .mail-item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 10px 16px; border-bottom: 1px solid var(--border);
    cursor: pointer; transition: background 0.15s;
  }
  .mail-item:hover { background: var(--surface-muted); }
  .mail-item.unread .mail-sender { font-weight: 700; color: var(--text); }
  .mail-item.unread .mail-subject { font-weight: 600; color: var(--text); }
  .mail-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .mail-info { flex: 1; min-width: 0; }
  .mail-sender { font-size: 13px; color: var(--text-muted); }
  .mail-subject {
    font-size: 13px; color: var(--text-muted); margin-top: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mail-snippet {
    font-size: 11px; color: var(--text-soft); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mail-time { font-size: 11px; color: var(--text-soft); flex-shrink: 0; }

  /* States */
  .no-data {
    text-align: center; padding: 40px 16px;
    color: var(--text-soft); font-size: 13px;
  }
  .loading-state {
    text-align: center; padding: 32px 16px;
    color: var(--text-soft); font-size: 12px;
  }
  .error-state {
    text-align: center; padding: 24px 16px;
    color: var(--danger); font-size: 12px;
  }

  /* Notification */
  .notification {
    position: fixed; bottom: 16px; right: 16px; left: 16px;
    background: var(--notification-bg); border: 1px solid var(--notification-border);
    border-radius: 8px; padding: 10px 14px;
    font-size: 12px; color: var(--text);
    animation: slideUp 0.2s ease; z-index: 100;
    display: none;
  }
  .notification.show { display: block; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <svg class="gws-icon" viewBox="0 0 24 24"><path d="M21.35 11.1h-9.17v2.73h6.51c-.33 3.81-3.5 5.44-6.5 5.44C8.36 19.27 5 16.25 5 12c0-4.1 3.2-7.27 7.2-7.27 3.09 0 4.9 1.97 4.9 1.97L19 4.72S16.56 2 12.1 2C6.42 2 2.03 6.8 2.03 12c0 5.05 4.13 10 10.22 10 5.35 0 9.25-3.67 9.25-9.09 0-1.15-.15-1.81-.15-1.81z" fill="#4285F4"/></svg>
  <h2>Google Workspace</h2>
  <span class="user-info" id="user-info"></span>
</div>

<!-- Auth Banner -->
<div class="auth-banner" id="auth-banner">
  <span class="auth-text">Connect your Google account to access Drive, Calendar &amp; Gmail</span>
  <button class="auth-btn" onclick="connectWorkspace()">Connect Google</button>
</div>

<!-- Tabs -->
<div class="tabs">
  <button class="tab-btn active" id="tab-btn-drive" onclick="switchTab('drive')">📁 Drive</button>
  <button class="tab-btn" id="tab-btn-calendar" onclick="switchTab('calendar')">📅 Calendar</button>
  <button class="tab-btn" id="tab-btn-gmail" onclick="switchTab('gmail')">✉️ Gmail</button>
</div>

<!-- Drive Tab -->
<div class="tab-view" id="tab-drive">
  <div class="section-hdr">
    <span>Recent Files</span>
    <button class="refresh-btn" onclick="loadDrive()">↻ Refresh</button>
  </div>
  <div class="content-scroll">
    <div id="drive-list"><div class="no-data">Connect Google Workspace to see your files</div></div>
  </div>
</div>

<!-- Calendar Tab -->
<div class="tab-view hidden" id="tab-calendar">
  <div class="section-hdr">
    <span>Upcoming Events</span>
    <button class="refresh-btn" onclick="loadCalendar()">↻ Refresh</button>
  </div>
  <div class="content-scroll">
    <div id="calendar-list"><div class="no-data">Connect Google Workspace to see your calendar</div></div>
  </div>
</div>

<!-- Gmail Tab -->
<div class="tab-view hidden" id="tab-gmail">
  <div class="section-hdr">
    <span>InboxProtocol</span>
    <button class="refresh-btn" onclick="loadGmail()">↻ Refresh</button>
  </div>
  <div class="content-scroll">
    <div id="gmail-list"><div class="no-data">Connect Google Workspace to see your inbox</div></div>
  </div>
</div>

<div class="notification" id="notification"></div>

<script>
(function() {
  "use strict";

  function applyTheme(theme) {
    const normalizedTheme = theme === "light" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", normalizedTheme);
  }

  applyTheme(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");

  // ── MCP RPC ──────────────────────────────────────────────
  let rpcId = 0;
  const pending = {};
  function sendRpc(method, params) {
    return new Promise(resolve => {
      const id = ++rpcId;
      pending[id] = resolve;
      window.parent.postMessage({ jsonrpc: "2.0", method, params: params || {}, id }, "*");
    });
  }

  window.addEventListener("message", function(e) {
    const msg = e.data;
    if (!msg) return;

    if (msg.type === "workspace_token_from_parent" && msg.access_token) {
      accessToken = msg.access_token;
      userEmail = msg.email || "";
      document.getElementById("auth-banner").classList.add("hidden");
      if (userEmail) document.getElementById("user-info").textContent = userEmail;
      loadAll();
      return;
    }

    if (msg.jsonrpc !== "2.0") return;
    if (msg.id && pending[msg.id]) {
      pending[msg.id](msg.result || msg.error);
      delete pending[msg.id];
    }
    if (msg.method === "ui/notifications/theme-changed" && msg.params?.theme) {
      applyTheme(msg.params.theme);
      return;
    }
    if (msg.method === "ui/notifications/tool-input" && msg.params) {
      handleToolInput(msg.params.arguments || msg.params);
    }
  });

  // ── State ────────────────────────────────────────────────
  let activeTab = "drive";
  let accessToken = null;
  let userEmail = "";
  let dataLoaded = { drive: false, calendar: false, gmail: false };

  const FILE_ICONS = {
    "application/vnd.google-apps.document": "📝",
    "application/vnd.google-apps.spreadsheet": "📊",
    "application/vnd.google-apps.presentation": "📋",
    "application/vnd.google-apps.form": "📋",
    "application/vnd.google-apps.folder": "📁",
    "application/pdf": "📄",
    "image/jpeg": "🖼️", "image/png": "🖼️",
    "video/mp4": "🎬",
    "audio/mpeg": "🎵",
  };

  function fileIcon(mimeType) {
    return FILE_ICONS[mimeType] || "📄";
  }

  // ── Auth ─────────────────────────────────────────────────
  function connectWorkspace() {
    window.parent.postMessage({ type: "workspace_login_request" }, "*");
  }

  // ── Tab switching ────────────────────────────────────────
  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-view").forEach(v => v.classList.add("hidden"));
    document.getElementById("tab-btn-" + tab).classList.add("active");
    document.getElementById("tab-" + tab).classList.remove("hidden");
    if (accessToken && !dataLoaded[tab]) {
      if (tab === "drive") loadDrive();
      else if (tab === "calendar") loadCalendar();
      else if (tab === "gmail") loadGmail();
    }
  }

  async function googleGet(url) {
    const res = await fetch(url, { headers: { Authorization: "Bearer " + accessToken } });
    if (res.status === 401) {
      showNotification("Token expired. Reconnect in Settings.");
      return null;
    }
    if (res.status === 403) {
      const body = await res.json().catch(() => ({}));
      const reason = body?.error?.errors?.[0]?.reason || body?.error?.message || "access_denied";
      if (reason === "accessNotConfigured" || reason.includes("disabled")) {
        showNotification("API not enabled — enable it in Google Cloud Console → APIs & Services → Library");
      } else {
        showNotification("Permission denied (" + reason + "). Check API scopes.");
      }
      return null;
    }
    if (!res.ok) {
      showNotification("API error " + res.status + ". Try reconnecting.");
      return null;
    }
    return res.json();
  }

  function loadAll() {
    if (activeTab === "calendar") {
      loadCalendar();
      return;
    }
    if (activeTab === "gmail") {
      loadGmail();
      return;
    }
    loadDrive();
  }

  // ── Drive ─────────────────────────────────────────────────
  async function loadDrive() {
    dataLoaded.drive = true;
    const el = document.getElementById("drive-list");
    el.innerHTML = '<div class="loading-state">Loading files…</div>';
    try {
      const data = await googleGet(
        "https://www.googleapis.com/drive/v3/files?orderBy=viewedByMeTime+desc&pageSize=30" +
        "&fields=files(id,name,mimeType,modifiedTime,size,webViewLink,owners)"
      );
      if (!data || !data.files) {
        dataLoaded.drive = false;
        el.innerHTML = '<div class="error-state">Could not load Drive files</div>';
        return;
      }
      if (!data.files.length) { el.innerHTML = '<div class="no-data">No files found</div>'; return; }
      el.innerHTML = data.files.map(f => {
        const icon = fileIcon(f.mimeType);
        const ts = f.modifiedTime ? new Date(f.modifiedTime).toLocaleDateString() : "";
        return `
          <div class="file-item" data-url="${esc(f.webViewLink || '')}">
            <div class="file-icon">${icon}</div>
            <div class="file-info">
              <div class="file-name">${esc(f.name)}</div>
              <div class="file-meta">${ts}${f.size ? ' · ' + formatBytes(parseInt(f.size)) : ''}</div>
            </div>
          </div>`;
      }).join("");
      el.querySelectorAll(".file-item").forEach(item => {
        item.addEventListener("click", () => {
          if (item.dataset.url) window.open(item.dataset.url, "_blank", "noopener");
        });
      });
    } catch (err) {
      dataLoaded.drive = false;
      el.innerHTML = '<div class="error-state">Failed to load Drive: ' + esc(String(err)) + '</div>';
    }
  }

  // ── Calendar ──────────────────────────────────────────────
  async function loadCalendar() {
    dataLoaded.calendar = true;
    const el = document.getElementById("calendar-list");
    el.innerHTML = '<div class="loading-state">Loading events…</div>';
    try {
      const now = new Date().toISOString();
      const end = new Date(Date.now() + 7 * 24 * 3600 * 1000).toISOString();
      const data = await googleGet(
        "https://www.googleapis.com/calendar/v3/calendars/primary/events" +
        "?timeMin=" + encodeURIComponent(now) +
        "&timeMax=" + encodeURIComponent(end) +
        "&singleEvents=true&orderBy=startTime&maxResults=20"
      );
      if (!data || !data.items) {
        dataLoaded.calendar = false;
        el.innerHTML = '<div class="error-state">Could not load calendar</div>';
        return;
      }
      if (!data.items.length) { el.innerHTML = '<div class="no-data">No upcoming events in the next 7 days</div>'; return; }
      el.innerHTML = data.items.map(ev => {
        const start = ev.start.dateTime || ev.start.date;
        const d = new Date(start);
        const timeStr = ev.start.dateTime
          ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          : "All day";
        const dateStr = d.toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" });
        const color = ev.colorId ? "#" + ev.colorId : "#4285F4";
        return `
          <div class="event-item" data-url="${esc(ev.htmlLink || '')}">
            <div class="event-time-col">
              <div class="event-time">${timeStr}</div>
              <div class="event-date">${dateStr}</div>
            </div>
            <div class="event-dot" style="background:${color}"></div>
            <div class="event-info">
              <div class="event-title">${esc(ev.summary || "(No title)")}</div>
              ${ev.location ? `<div class="event-location">📍 ${esc(ev.location)}</div>` : ""}
            </div>
          </div>`;
      }).join("");
      el.querySelectorAll(".event-item").forEach(item => {
        item.addEventListener("click", () => {
          if (item.dataset.url) window.open(item.dataset.url, "_blank", "noopener");
        });
      });
    } catch (err) {
      dataLoaded.calendar = false;
      el.innerHTML = '<div class="error-state">Failed to load calendar: ' + esc(String(err)) + '</div>';
    }
  }

  // ── Gmail ─────────────────────────────────────────────────
  async function loadGmail() {
    dataLoaded.gmail = true;
    const el = document.getElementById("gmail-list");
    el.innerHTML = '<div class="loading-state">Loading inbox…</div>';
    try {
      const listData = await googleGet(
        "https://gmail.googleapis.com/gmail/v1/users/me/messages?labelIds=INBOX&maxResults=20"
      );
      if (!listData || !listData.messages) { el.innerHTML = '<div class="no-data">InboxProtocol is empty</div>'; return; }

      // Fetch message snippets in parallel (batch of 20)
      const msgs = await Promise.all(
        listData.messages.map(m =>
          googleGet("https://gmail.googleapis.com/gmail/v1/users/me/messages/" + m.id +
            "?format=metadata&metadataHeaders=From&metadataHeaders=Subject&metadataHeaders=Date")
        )
      );

      el.innerHTML = msgs.filter(Boolean).map(m => {
        const headers = (m.payload?.headers || []).reduce((acc, h) => {
          acc[h.name.toLowerCase()] = h.value; return acc;
        }, {});
        const isUnread = (m.labelIds || []).includes("UNREAD");
        const from = headers.from || "Unknown";
        const senderName = from.replace(/<[^>]+>/, "").trim() || from;
        const initial = senderName[0]?.toUpperCase() || "?";
        const dateStr = headers.date ? new Date(headers.date).toLocaleDateString() : "";
        const subject = headers.subject || "(No subject)";
        return `
          <div class="mail-item ${isUnread ? 'unread' : ''}" data-id="${esc(m.id)}">
            <div class="mail-avatar">${initial}</div>
            <div class="mail-info">
              <div class="mail-sender">${esc(senderName)}</div>
              <div class="mail-subject">${esc(subject)}</div>
              <div class="mail-snippet">${esc(m.snippet || "")}</div>
            </div>
            <div class="mail-time">${dateStr}</div>
          </div>`;
      }).join("");
      el.querySelectorAll(".mail-item").forEach(item => {
        item.addEventListener("click", () => {
          window.open(
            "https://mail.google.com/mail/u/0/#inbox/" + item.dataset.id,
            "_blank", "noopener"
          );
        });
      });
    } catch (err) {
      dataLoaded.gmail = false;
      el.innerHTML = '<div class="error-state">Failed to load Gmail: ' + esc(String(err)) + '</div>';
    }
  }

  // ── Helpers ──────────────────────────────────────────────
  function esc(s) {
    return String(s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function formatBytes(b) {
    if (b < 1024) return b + " B";
    if (b < 1048576) return (b / 1024).toFixed(1) + " KB";
    return (b / 1048576).toFixed(1) + " MB";
  }

  function showNotification(msg) {
    const el = document.getElementById("notification");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 3000);
  }

  function handleToolInput(args) {
    // Pass initial context (email address, initial view, etc.)
    if (args.email) {
      userEmail = args.email;
      document.getElementById("user-info").textContent = userEmail;
    }
    // After a calendar mutation (create/cancel), refresh the calendar view
    if (args.calendar_mutated && accessToken) {
      switchTab("calendar");
      dataLoaded.calendar = false;
      loadCalendar();
      return;
    }
    const requestedTab = args.service || args.view;
    if (requestedTab) switchTab(requestedTab);
  }

  // ── Init ─────────────────────────────────────────────────
  async function init() {
    const initResult = await sendRpc("ui/initialize");
    if (initResult?.hostContext?.theme) {
      applyTheme(initResult.hostContext.theme);
    }
    const ctx = await sendRpc("getContext");
    if (ctx?.arguments) handleToolInput(ctx.arguments);

    // Request token from parent
    window.parent.postMessage({ type: "workspace_token_refresh_request" }, "*");

    // Show auth banner if no token after 2s
    setTimeout(() => {
      if (!accessToken) {
        document.getElementById("auth-banner").classList.remove("hidden");
      }
    }, 2000);
  }

  // ── Expose to global scope for onclick= attributes ───────
  window.switchTab = switchTab;
  window.connectWorkspace = connectWorkspace;
  window.loadDrive = loadDrive;
  window.loadCalendar = loadCalendar;
  window.loadGmail = loadGmail;

  init();
})();
</script>
</body>
</html>
