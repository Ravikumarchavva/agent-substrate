name: agent-framework

services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      # Host-side port only — override when 5432 is already taken by
      # something else on the host (real, found-not-assumed: hit exactly
      # this on a shared multi-project server). Internal service-to-service
      # traffic always uses the container's own port 5432 via the
      # `postgres` DNS name regardless of this mapping (see e.g. `backend`'s
      # DATABASE_URL below) — safe to change without touching anything else
      # in this compose file.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentdb
    volumes:
      - pgdata18:/var/lib/postgresql
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql
      - ./init-chatbotdb.sh:/docker-entrypoint-initdb.d/20-chatbotdb.sh
      - ./init-glitchtipdb.sh:/docker-entrypoint-initdb.d/30-glitchtipdb.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - workspaces:/data/workspaces
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agentdb
      REDIS_URL: redis://redis:6379/0
      OTLP_ENDPOINT: http://tempo:4318
      # "local" = per-user workspace filesystem (uploads + code-interpreter
      # workdir, one source of truth — see capabilities/storage/workspace.py).
      # Set FILE_STORE_BACKEND=s3 (and the FILE_STORE_* vars below) to use
      # the seaweedfs service instead; both stay defined here for convenience.
      FILE_STORE_BACKEND: ${FILE_STORE_BACKEND:-local}
      FILE_STORE_ROOT: /data/workspaces
      FILE_STORE_BUCKET: agent-files
      FILE_STORE_ENDPOINT: http://seaweedfs:8333
      FILE_STORE_REGION: us-east-1
      FILE_STORE_ACCESS_KEY: ${FILE_STORE_ACCESS_KEY:-substrate}
      FILE_STORE_SECRET_KEY: ${FILE_STORE_SECRET_KEY:-substrate-dev-secret}
      ENABLE_BUILDER: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://host.docker.internal:3000}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://host.docker.internal:3001}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Ravi UI}
      CHAT_MODEL: ${CHAT_MODEL:-groq/llama-3.3-70b-versatile}
      TTS_MODEL: ${TTS_MODEL:-google/gemini-3.1-flash-tts-preview}
      TTS_VOICE: ${TTS_VOICE:-Kore}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # Empty by default — chat attachments fall back to the lightweight
      # pypdf path for PDFs. Only set this if you're also running the
      # document-intelligence service (docker compose --profile document-intelligence up):
      #   DOCUMENT_INTELLIGENCE_SERVICE_URL=http://document-intelligence:8080 docker compose --profile document-intelligence up
      DOCUMENT_INTELLIGENCE_SERVICE_URL: ${DOCUMENT_INTELLIGENCE_SERVICE_URL:-}
      EMBEDDING_RERANKER_SERVICE_URL: ${EMBEDDING_RERANKER_SERVICE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  substrate-ui:
    profiles:
      - ui
    build:
      context: ../../../substrate-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://backend:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/substrate_ui
    depends_on:
      - backend
      - postgres

  tempo:
    image: grafana/tempo:2.10.0
    user: root
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - ./tempo/data:/tmp/tempo
    ports:
      - "3200:3200"   # HTTP
      - "9095:9095"   # gRPC
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.4
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - promtaildata:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3099:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9000
    # profiles:
    #   - mcp
    init: true
    restart: unless-stopped

  # ── SeaweedFS (S3-compatible object store for file storage) ─────────────
  # Replaces MinIO, whose Community Edition was archived in Feb 2026 (no
  # further development, security patches, or prebuilt binaries). SeaweedFS is
  # Apache 2.0, has a decade of production use at petabyte scale, and is
  # optimised for exactly this access pattern — many small objects (~40 bytes
  # of metadata per file, O(1) reads regardless of file count).
  #
  # `weed server` runs master + volume + filer + S3 gateway in one process,
  # which is all a single-machine dev/compose setup needs; a real deployment
  # splits those roles. The engine only ever speaks the S3 API (see
  # capabilities/storage/s3.py), so swapping this for any S3-compatible
  # service — Garage, R2, AWS S3 — is a compose/env change with no code change.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: >
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333"   # S3 API  → FILE_STORE_ENDPOINT
      - "8888:8888"   # Filer UI — bare file browser over users/{id}/...
      - "9333:9333"   # Master UI — cluster/volume status
    volumes:
      - seaweedfsdata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # SeaweedFS binds to the container's own IP, not 127.0.0.1, so localhost
      # is refused — hence CMD-SHELL and `hostname -i`. Probes the S3 port
      # because that is the only interface the engine actually uses.
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname -i):8333/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── SeaweedFS admin console ─────────────────────────────────────────────
  # The MinIO-Console equivalent: buckets, object browser, volume/cluster
  # health, and maintenance tasks. `weed server` does not start it, so it runs
  # as its own process. The bare filer UI on :8888 stays available and is
  # fine for a quick look at users/{id}/... — this is the richer view.
  seaweedfs-admin:
    image: chrislusf/seaweedfs:latest
    command: >
      admin -port=23646 -master=seaweedfs:9333
      -dataDir=/data
      -adminUser=${SEAWEEDFS_ADMIN_USER:-admin}
      -adminPassword=${SEAWEEDFS_ADMIN_PASSWORD:-admin}
    ports:
      - "23646:23646"   # Admin console UI
    volumes:
      - seaweedfsadmin:/data
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  document-intelligence:
    profiles:
      - document-intelligence
    build:
      context: ../..
      dockerfile: deployment/docker/document-intelligence.Dockerfile
    ports:
      - "8021:8080"
    environment:
      DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN: ${DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN:-true}
      # huggingface_hub (paddlex's downloader) reads HF_TOKEN automatically.
      # Blank is fine — falls back to unauthenticated, lower rate limits.
      HF_TOKEN: ${HF_TOKEN:-}
    # PaddleOCR/PaddleX download their model weights from HuggingFace into
    # ~/.paddlex on first use, not at build time — without a persistent
    # volume that repeats on every container restart. Same rationale as
    # llama-embed/llama-rerank's LLAMA_CACHE volume below.
    volumes:
      - paddlex-model-cache:/root/.paddlex
    restart: unless-stopped

  # GPU variant of `document-intelligence` above — local dev speedup on an
  # NVIDIA GPU, not for hosting (that stays CPU-only/cheap by default). Use
  # one profile or the other, not both
  # (`docker compose --profile document-intelligence-gpu up`); they'd
  # otherwise collide on host port 8021. Requires the NVIDIA Container
  # Toolkit configured for Docker on the host.
  #
  # Three pinned replicas (document-intelligence-gpu-0/1/2), one per
  # physical GPU on a multi-card host — document-intelligence-gpu appears
  # to serialize extraction requests internally (real, found-not-assumed:
  # concurrent requests to ONE instance made even small files time out,
  # while sequential succeeded every time), so real indexing throughput
  # comes from independent instances, not from one instance handling more
  # concurrent requests. `device_ids` (not `count`) pins each replica to a
  # specific card — `count: 1` alone is non-deterministic about which GPU
  # a container lands on. DOCUMENT_INTELLIGENCE_DEVICE stays "gpu:0" for
  # every replica: device_ids restricts each container's CUDA visibility
  # to just its one pinned card, which is always index 0 from inside that
  # container regardless of the host's physical GPU index.
  document-intelligence-gpu-0:
    profiles:
      - document-intelligence-gpu
    build:
      context: ../..
      dockerfile: deployment/docker/document-intelligence.gpu.Dockerfile
    ports:
      - "8021:8080"
    environment:
      # Default OFF on this eval-purposed replica (not the CPU
      # document-intelligence service above, which may still serve
      # less-trusted uploads elsewhere) -- real finding: 17/39 pilot files
      # from a known, public benchmark corpus (real ESG/sustainability
      # reports) hard-blocked, several on single ambiguous tokens like
      # /OpenAction that are common in benign professionally-produced PDFs
      # too. Known dataset, not untrusted uploads -- different risk profile.
      DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN: ${DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN:-false}
      DOCUMENT_INTELLIGENCE_DEVICE: gpu:0
      # 16 (the code's own default) was tuned for a 4GB-class laptop GPU;
      # these are 24GB cards. Starting point to measure real VRAM/speed
      # against, not a final verified number.
      DOCUMENT_INTELLIGENCE_OCR_BATCH_SIZE: ${DOCUMENT_INTELLIGENCE_OCR_BATCH_SIZE:-64}
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    volumes:
      - paddlex-model-cache:/root/.paddlex
    restart: unless-stopped

  document-intelligence-gpu-1:
    profiles:
      - document-intelligence-gpu
    build:
      context: ../..
      dockerfile: deployment/docker/document-intelligence.gpu.Dockerfile
    ports:
      - "8022:8080"
    environment:
      # See document-intelligence-gpu-0's identical comment above.
      DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN: ${DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN:-false}
      DOCUMENT_INTELLIGENCE_DEVICE: gpu:0
      # 16 (the code's own default) was tuned for a 4GB-class laptop GPU;
      # these are 24GB cards. Starting point to measure real VRAM/speed
      # against, not a final verified number.
      DOCUMENT_INTELLIGENCE_OCR_BATCH_SIZE: ${DOCUMENT_INTELLIGENCE_OCR_BATCH_SIZE:-64}
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    volumes:
      - paddlex-model-cache:/root/.paddlex
    restart: unless-stopped

  document-intelligence-gpu-2:
    profiles:
      - document-intelligence-gpu
    build:
      context: ../..
      dockerfile: deployment/docker/document-intelligence.gpu.Dockerfile
    ports:
      - "8023:8080"
    environment:
      # See document-intelligence-gpu-0's identical comment above.
      DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN: ${DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN:-false}
      DOCUMENT_INTELLIGENCE_DEVICE: gpu:0
      # 16 (the code's own default) was tuned for a 4GB-class laptop GPU;
      # these are 24GB cards. Starting point to measure real VRAM/speed
      # against, not a final verified number.
      DOCUMENT_INTELLIGENCE_OCR_BATCH_SIZE: ${DOCUMENT_INTELLIGENCE_OCR_BATCH_SIZE:-64}
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    volumes:
      - paddlex-model-cache:/root/.paddlex
    restart: unless-stopped

  # Second replica per physical GPU (-3/-4/-5 pinned to the same GPUs as
  # -0/-1/-2) — real measurement on epyc showed each single replica only
  # using ~4-8GB of a 24GB card and 0-20% compute, because PPStructureV3 is
  # a multi-stage pipeline (layout/orientation/table/OCR, each a small GPU
  # call with CPU-side pre/post-processing between them) rather than one
  # sustained batched forward pass — a lone replica can't keep the GPU busy
  # by itself. A second independent replica's GPU calls fill the first
  # one's CPU-bound idle gaps. This does NOT reintroduce the concurrent-
  # requests-to-one-instance timeout finding above — these are separate
  # containers/processes, each still only ever receiving one request at a
  # time from the ingestion driver's per-endpoint worker.
  document-intelligence-gpu-3:
    profiles:
      - document-intelligence-gpu
    build:
      context: ../..
      dockerfile: deployment/docker/document-intelligence.gpu.Dockerfile
    ports:
      - "8024:8080"
    environment:
      DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN: ${DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN:-false}
      DOCUMENT_INTELLIGENCE_DEVICE: gpu:0
      DOCUMENT_INTELLIGENCE_OCR_BATCH_SIZE: ${DOCUMENT_INTELLIGENCE_OCR_BATCH_SIZE:-64}
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    volumes:
      - paddlex-model-cache:/root/.paddlex
    restart: unless-stopped

  document-intelligence-gpu-4:
    profiles:
      - document-intelligence-gpu
    build:
      context: ../..
      dockerfile: deployment/docker/document-intelligence.gpu.Dockerfile
    ports:
      - "8025:8080"
    environment:
      DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN: ${DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN:-false}
      DOCUMENT_INTELLIGENCE_DEVICE: gpu:0
      DOCUMENT_INTELLIGENCE_OCR_BATCH_SIZE: ${DOCUMENT_INTELLIGENCE_OCR_BATCH_SIZE:-64}
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    volumes:
      - paddlex-model-cache:/root/.paddlex
    restart: unless-stopped

  document-intelligence-gpu-5:
    profiles:
      - document-intelligence-gpu
    build:
      context: ../..
      dockerfile: deployment/docker/document-intelligence.gpu.Dockerfile
    ports:
      - "8026:8080"
    environment:
      DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN: ${DOCUMENT_INTELLIGENCE_ENABLE_DOCUMENT_SECURITY_SCAN:-false}
      DOCUMENT_INTELLIGENCE_DEVICE: gpu:0
      DOCUMENT_INTELLIGENCE_OCR_BATCH_SIZE: ${DOCUMENT_INTELLIGENCE_OCR_BATCH_SIZE:-64}
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    volumes:
      - paddlex-model-cache:/root/.paddlex
    restart: unless-stopped

  # Thin httpx proxy to the llama-embed/llama-rerank sidecars — a separate
  # service from document-intelligence since it shares no code or state
  # with the OCR/layout pipeline (see docs/claude_docs/decisions.md).
  embedding-reranker:
    profiles:
      - embedding-reranker
    build:
      context: ../..
      dockerfile: deployment/docker/embedding-reranker.Dockerfile
    ports:
      - "8023:8080"
    depends_on:
      llama-embed:
        condition: service_healthy
      llama-rerank:
        condition: service_healthy
    environment:
      # Overridable so this can point at the GPU sidecars instead
      # (llama-embed-gpu/llama-rerank-gpu below) — compose service discovery
      # is by name, and those are separate service names on the same ports.
      EMBEDDING_RERANKER_EMBED_SERVER_URL: ${EMBEDDING_RERANKER_EMBED_SERVER_URL:-http://llama-embed:8031}
      EMBEDDING_RERANKER_RERANK_SERVER_URL: ${EMBEDDING_RERANKER_RERANK_SERVER_URL:-http://llama-rerank:8032}
    restart: unless-stopped

  # Qwen3-VL-Embedding-2B sidecar (dense multimodal embedding). See
  # docs/claude_docs/decisions.md for why this pair of models + llama-server
  # was chosen — real, measured evidence (no GPU, CPU-only, ~2GB RSS each),
  # not an estimate. --parallel is a conservative launch default; see the
  # RAG redesign plan's Concurrency section before raising it.
  llama-embed:
    profiles:
      - embedding-reranker
    build:
      context: ../..
      dockerfile: deployment/docker/llama-server.Dockerfile
    command:
      - --hf-repo
      - Rizwan313/Qwen3-VL-Embedding-2B-GGUF
      - --hf-file
      - qwen3-vl-embedding-2b-Q4_K_M.gguf
      - --embedding
      - --pooling
      - last
      - --host
      - 0.0.0.0
      - --port
      - "8031"
      - --ctx-size
      - "2048"
      - --parallel
      - "2"
    environment:
      PORT: "8031"
      # NOT verified against a real llama-server --help output whether its
      # built-in -hf downloader honors this — matches huggingface_hub's
      # standard env var name on the chance it does; harmless if ignored.
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8031:8031"
    volumes:
      - llama-model-cache:/cache
    restart: unless-stopped

  # Qwen3-VL-Reranker-2B sidecar (multimodal cross-encoder reranking).
  # --parallel 1: the most expensive stage per query — bounded, predictable
  # CPU behavior over throughput until real load-tested. Don't raise without
  # benchmarking (see the RAG redesign plan).
  llama-rerank:
    profiles:
      - embedding-reranker
    build:
      context: ../..
      dockerfile: deployment/docker/llama-server.Dockerfile
    command:
      - --hf-repo
      - staralt/Qwen3-VL-Reranker-2B-Q4_K_M-GGUF
      - --hf-file
      - qwen3-vl-reranker-2b-q4_k_m-imat.gguf
      - --reranking
      - --host
      - 0.0.0.0
      - --port
      - "8032"
      - --ctx-size
      - "2048"
      - --parallel
      - "1"
    environment:
      PORT: "8032"
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8032:8032"
    volumes:
      - llama-model-cache:/cache
    restart: unless-stopped

  # ── GPU variants of llama-embed/llama-rerank above — same models, same
  # serving flags, CUDA build instead of CPU-native (see
  # llama-server.gpu.Dockerfile). Mutually exclusive with their CPU
  # counterparts on the same ports (8031/8032) — pick one profile, not both.
  #
  # VRAM budget — real measured number, not an estimate: llama-embed-gpu +
  # llama-rerank-gpu together use 4515MiB (~4.4GB) on a single GPU (measured
  # via `nvidia-smi --query-gpu=memory.used`, both containers pinned to one
  # device with `--gpus '"device=0"'`, same --ctx-size/--parallel flags as
  # below) — noticeably higher than a naive per-model weight-size estimate
  # would suggest; -ngl 99 full offload plus per-process CUDA context
  # overhead adds up fast on top of the actual model weights.
  #
  # Real, significant consequence for this project's own 4GB dev laptop GPU:
  # **these two sidecars alone already consume effectively the entire card**
  # — there is no real headroom left for document-intelligence-gpu
  # alongside them on that hardware, not just "risky," genuinely won't fit.
  # On a single constrained (~4GB) GPU: run document-intelligence on CPU and
  # reserve the GPU for just one of llama-embed-gpu/llama-rerank-gpu at a
  # time if testing individually, or get a bigger card (any card with real
  # headroom above ~5GB comfortably fits both sidecars together, plus
  # document-intelligence-gpu on top if it has real free VRAM beyond that —
  # see that service's own block above for its footprint). OCR/layout
  # extraction is already fast enough on CPU (`tiny` OCR: ~11.5s/page,
  # measured) as a practical fallback, while embedding/reranking sit on the
  # hot per-query retrieval path where GPU latency actually matters more.
  llama-embed-gpu:
    profiles:
      - llama-gpu
    build:
      context: ../..
      dockerfile: deployment/docker/llama-server.gpu.Dockerfile
    command:
      - --hf-repo
      - Rizwan313/Qwen3-VL-Embedding-2B-GGUF
      - --hf-file
      - qwen3-vl-embedding-2b-Q4_K_M.gguf
      - --embedding
      - --pooling
      - last
      - --host
      - 0.0.0.0
      - --port
      - "8031"
      - --ctx-size
      - "2048"
      - --parallel
      - "2"
      - -ngl
      - "99"
    environment:
      PORT: "8031"
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8031:8031"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    volumes:
      - llama-model-cache:/cache
    restart: unless-stopped

  llama-rerank-gpu:
    profiles:
      - llama-gpu
    build:
      context: ../..
      dockerfile: deployment/docker/llama-server.gpu.Dockerfile
    command:
      - --hf-repo
      - staralt/Qwen3-VL-Reranker-2B-Q4_K_M-GGUF
      - --hf-file
      - qwen3-vl-reranker-2b-q4_k_m-imat.gguf
      - --reranking
      - --host
      - 0.0.0.0
      - --port
      - "8032"
      - --ctx-size
      - "2048"
      - --parallel
      - "1"
      - -ngl
      - "99"
    environment:
      PORT: "8032"
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8032:8032"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    volumes:
      - llama-model-cache:/cache
    restart: unless-stopped

  # Local chat/instruct LLM — used only by the query/eval-time pipeline
  # (kb_filter decisions, RAG answer generation, LLM-judge correctness
  # scoring), never during ingestion. Same Dockerfile family as the
  # embed/rerank sidecars, plain chat-completions mode (no --embedding/
  # --reranking). Model pinned per real-world guidance (past this repo's
  # own knowledge cutoff for model recency) — verify the exact -hf-file
  # quant filename still resolves on HF before trusting this in a real run.
  llama-chat-gpu:
    profiles:
      - llama-gpu
    build:
      context: ../..
      dockerfile: deployment/docker/llama-server.gpu.Dockerfile
    command:
      - --hf-repo
      - unsloth/Qwen3.5-9B-GGUF
      - --hf-file
      - Qwen3.5-9B-Q4_K_M.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8033"
      - --ctx-size
      - "4096"
      - --parallel
      - "2"
      - -ngl
      - "99"
    environment:
      PORT: "8033"
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8033:8033"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]
    volumes:
      - llama-model-cache:/cache
    restart: unless-stopped

  # ONLYOFFICE Document Server — editable Word/Excel/PowerPoint in the panel.
  # Opt-in (heavy ~2GB image). The JWT_SECRET here MUST equal the backend's
  # ONLYOFFICE_JWT_SECRET so the signed editor config + save callbacks verify.
  # See serving/monolith/routes/onlyoffice.py for the integration + networking.
  onlyoffice:
    profiles:
      - onlyoffice
    image: onlyoffice/documentserver:latest
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-me-onlyoffice-secret}
      JWT_HEADER: Authorization
    ports:
      - "8024:80"
    # The doc server fetches documents from / saves back to the backend via
    # ONLYOFFICE_INTERNAL_CALLBACK_BASE (host.docker.internal:8000 when the
    # backend runs on the host with `uv run start`). On Linux that name only
    # resolves with the host-gateway mapping — same as the backend service.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════════
  # GlitchTip — self-hosted, MIT-licensed, Sentry-protocol-compatible browser
  # error tracking for ravi + substrate-ui (NEXT_PUBLIC_GLITCHTIP_DSN in each
  # app's .env). Opt-in (profile-gated) — reuses the existing postgres/redis
  # services above rather than standing up dedicated ones. First-time setup:
  #   docker compose --profile glitchtip up -d
  #   docker compose run --rm glitchtip-web ./manage.py createsuperuser
  # then open http://localhost:8025, create an org + project, and paste the
  # project's DSN into each app's NEXT_PUBLIC_GLITCHTIP_DSN.
  # ══════════════════════════════════════════════════════════════════════════════
  glitchtip-web: &glitchtip
    profiles:
      - glitchtip
    image: glitchtip/glitchtip:latest
    ports:
      - "8025:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/glitchtipdb
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_USE_A_STRONG_RANDOM_SECRET}
      # Separate Redis logical DB (index 2) from the main app's (index 0) —
      # same Redis server, no dedicated container needed.
      REDIS_URL: redis://redis:6379/2
      PORT: 8000
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8025}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@agent-substrate.com}
      ENABLE_ORGANIZATION_CREATION: "True"
      CELERY_WORKER_AUTOSCALE: "1,1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  glitchtip-worker:
    <<: *glitchtip
    ports: []
    command: ./bin/run-celery-with-beat.sh

  glitchtip-migrate:
    <<: *glitchtip
    ports: []
    restart: "no"
    command: ./manage.py migrate

volumes:
  pgdata18:
  redisdata:
  lokidata:
  promtaildata:
  seaweedfsdata:
  seaweedfsadmin:
  workspaces:
  llama-model-cache:
  paddlex-model-cache:
