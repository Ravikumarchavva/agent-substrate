    - Memory & Context: concepts/memory.md
    - Human-in-the-Loop: concepts/human-in-the-loop.md
    - Middleware: concepts/middleware.md
    - Guardrails: concepts/guardrails.md
    - Supervision & Budgets: concepts/supervision.md
    - Hooks: concepts/hooks.md

  - Kernel Reference (L0):
    - Overview: kernel/index.md
    - 1 · Core — Content & Identity: kernel/01-core.md
    - 2 · The LLM Contract: kernel/02-llm.md
    - 3 · Messaging & Streaming: kernel/03-messaging.md
    - 4 · Tools, Skills & Approval: kernel/04-tools.md
    - 5 · Storage Contracts: kernel/05-storage.md
    - 6 · Agent Policy: kernel/06-agent.md
    - 7 · The Durable Runtime: kernel/07-runtime.md

  - Agents Layer (L1):
