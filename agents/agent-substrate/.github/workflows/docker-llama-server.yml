name: Publish llama-server sidecar images

# Real, robust distribution for the llama-embed/llama-rerank sidecars'
# shared llama-server image (heavy build toolchain — never meant to be
# `pip install`-ed, it's a compiled C++ binary). Matrix-builds a CPU and a
# GPU (CUDA) image variant, publish both to GHCR under distinct tags, same
# pattern as docker-document-intelligence.yml.
#
# Real limitation, not glossed over: GitHub Actions' standard
# ubuntu-latest runners have no GPU — the `gpu` variant only *compiles*
# here (a real, useful signal: catches a broken CUDA build before anyone
# pulls the image), it cannot be functionally smoke-tested in CI. Real
# correctness verification (actual embed/rerank calls, real output shape)
# has to happen on hardware with a GPU.
#
# Fires on the same GitHub Release event as publish.yml (PyPI), so a
# release always ships both the library and the runnable service images
# for that version; workflow_dispatch is available for a manual rebuild
# (e.g. to pick up an upstream llama.cpp/base-image security patch)
# without cutting a new release.
on:
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase — GHCR image paths must be lowercase even though
  # the GitHub org/user (Ravikumarchavva) isn't; ${{ github.actor }} is
  # only used for registry auth below, not the image path.
  IMAGE_BASE: ghcr.io/ravikumarchavva/agent-substrate-llama-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - variant: cpu
            dockerfile: deployment/docker/llama-server.Dockerfile
          - variant: gpu
            dockerfile: deployment/docker/llama-server.gpu.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: tags
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ github.event_name }}" != "release" ]; then
            VERSION="dev-${GITHUB_SHA::12}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ matrix.variant }}
            ${{ env.IMAGE_BASE }}:${{ steps.tags.outputs.version }}-${{ matrix.variant }}
          cache-from: type=gha,scope=llama-server-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=llama-server-${{ matrix.variant }}
