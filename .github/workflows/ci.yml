name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  # ── Path filter: what changed, including what depends on it ───────────────
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.plan.outputs.python }}
      reader: ${{ steps.plan.outputs.reader }}
      js: ${{ steps.plan.outputs.js }}
      deploy: ${{ steps.plan.outputs.deploy }}
      server: ${{ steps.plan.outputs.server }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          list-files: none
          filters: |
            # Anything in `shared` affects every Python package.
            python:
              - 'sdk/python/**'
              - 'server/engine/**'
              - 'server/server/**'
              - 'meta/**'
              - 'specs/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.importlinter'
              - 'Makefile'
              - '.github/workflows/ci.yml'
            reader:
              - 'server/reader/**'
              - 'server/engine/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - 'sdk/python/**'
              - 'specs/**'
            js:
              - 'apps/**'
              - 'sdk/js/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            deploy:
              - 'deploy/**'
              - '.dockerignore'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-images.yml'
      # Pushes to main and merge-queue runs always test everything.
      - name: Build job plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PYTHON: ${{ steps.filter.outputs.python }}
          READER: ${{ steps.filter.outputs.reader }}
          SERVER: ${{ steps.filter.outputs.server }}
          JS: ${{ steps.filter.outputs.js }}
          DEPLOY: ${{ steps.filter.outputs.deploy }}
        run: |
          flag() { if [ "$EVENT" != "pull_request" ]; then echo true; else echo "${1:-false}"; fi; }
          echo "python=$(flag "$PYTHON")" >> "$GITHUB_OUTPUT"
          echo "reader=$(flag "$READER")" >> "$GITHUB_OUTPUT"
          echo "server=$(flag "$SERVER")" >> "$GITHUB_OUTPUT"
          echo "js=$(flag "$JS")" >> "$GITHUB_OUTPUT"
          echo "deploy=$(flag "$DEPLOY")" >> "$GITHUB_OUTPUT"

  # ── Style and architecture: ruff, and the import contracts in .importlinter ─
  lint:
    name: Lint and import contracts
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-packages --all-extras --all-groups
      # ruff comes from uv.lock, so the version used here is the locked one.
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - name: Import contracts
        run: uv run --frozen lint-imports --config .importlinter

  # ── Python distributions in the uv workspace (one lock, Python 3.14) ──────
  python:
    name: Python / ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: loamz-core, dir: sdk/python/core }
          - { name: loamz-data, dir: sdk/python/data }
          - { name: loamz-engine, dir: server/engine }
          - { name: loamz-server, dir: server/server }
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      LOAMZ_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
      LOAMZ_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-packages --all-extras --all-groups
      - name: Tests
        working-directory: ${{ matrix.dir }}
        run: uv run --frozen --package ${{ matrix.name }} pytest -q -n 4 --timeout=120 --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.name }}
          path: ${{ matrix.dir }}/test-results.xml
          if-no-files-found: ignore

  # ── Tests that need Docker (SeaweedFS, Iceberg catalog, pgvector, models) ──
  integration:
    name: Server integration
    needs: changes
    if: >-
      needs.changes.outputs.server == 'true' &&
      (github.event_name == 'merge_group' ||
       contains(github.event.pull_request.labels.*.name, 'run-integration'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-packages --all-extras --all-groups
      - name: Integration tests
        run: make test-slow

  # ── loamz-reader: Python 3.13, its own project and lock, not in the workspace ─
  reader:
    name: Python / loamz-reader
    needs: changes
    if: needs.changes.outputs.reader == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: server/reader
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: server/reader/uv.lock
          python-version: "3.13"
      - run: uv sync --frozen --extra test
      - run: uvx ruff@0.15.15 check .
      - run: uvx ruff@0.15.15 format --check .
      - run: uv run --frozen python -m pytest --tb=short -q

  # ── JavaScript packages (pnpm workspace) ──────────────────────────────────
  js:
    name: JS / ${{ matrix.dir }}
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        dir: [apps/agents-console, apps/data-workspace, sdk/js/oidc-bff]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # pnpm version comes from "packageManager" in the root package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --filter "./${{ matrix.dir }}" --if-present lint
      - name: Typecheck
        run: pnpm --filter "./${{ matrix.dir }}" --if-present typecheck
      - name: Design-system ratchet
        if: matrix.dir == 'apps/agents-console'
        run: pnpm --filter "./${{ matrix.dir }}" check:design
      - name: Unit tests (vitest)
        run: pnpm --filter "./${{ matrix.dir }}" --if-present test
      - name: Build
        if: startsWith(matrix.dir, 'apps/')
        env:
          NEXT_PUBLIC_API_URL: ""
        run: pnpm --filter "./${{ matrix.dir }}" build

  # ── Deployment artifacts: Dockerfiles, compose, Helm chart, Terraform ──────
  deploy:
    name: Deploy / ${{ matrix.check }}
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        check: [hadolint, compose, helm, terraform, realm-drift]
    steps:
      - uses: actions/checkout@v4
      - name: hadolint
        if: matrix.check == 'hadolint'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          dockerfile: "deploy/docker/*.Dockerfile"
          failure-threshold: error
      - name: docker compose config
        if: matrix.check == 'compose'
        working-directory: deploy/compose
        run: |
          ./gen-env.sh
          docker compose config -q
          docker compose --profile agents config -q
          docker compose --profile microservices config -q
          docker compose --profile agents --profile ml config -q
      - uses: azure/setup-helm@v4
        if: matrix.check == 'helm'
      - name: helm lint and template
        if: matrix.check == 'helm'
        run: |
          for mode in monolith microservices; do
            helm lint deploy/helm/loamz-cell --set mode=$mode
            helm template cell deploy/helm/loamz-cell --set mode=$mode > /tmp/$mode.yaml
          done
          helm template cell deploy/helm/loamz-cell --set agents.enabled=false > /tmp/data-only.yaml
          helm template cell deploy/helm/loamz-cell \
            --set postgres.bundled.enabled=false,postgres.external.host=db.example.com \
            --set s3.bundled.enabled=false,s3.external.endpoint=https://s3.example.com,s3.external.icebergCatalogUrl=https://iceberg.example.com \
            --set secrets.existingSecret=mine,data.ticketKeys.existingSecret=tk > /tmp/external.yaml
      - name: kubeconform
        if: matrix.check == 'helm'
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary /tmp/monolith.yaml /tmp/microservices.yaml /tmp/data-only.yaml /tmp/external.yaml
      - uses: hashicorp/setup-terraform@v3
        if: matrix.check == 'terraform'
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt and validate
        if: matrix.check == 'terraform'
        run: |
          terraform fmt -check -recursive deploy/terraform deploy/keycloak/terraform
          for d in deploy/terraform/aws deploy/terraform/gcp deploy/terraform/azure deploy/keycloak/terraform; do
            terraform -chdir=$d init -backend=false -input=false
            terraform -chdir=$d validate
          done
      - name: the chart's realm copy equals deploy/keycloak
        if: matrix.check == 'realm-drift'
        run: diff deploy/keycloak/realm-loamz.json deploy/helm/loamz-cell/files/realm-loamz.json

  # ── The only required status check ─────────────────────────────────────────
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, python, integration, reader, js, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled (skipped is fine)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '[.[] | .result] | all(. == "success" or . == "skipped")' > /dev/null
