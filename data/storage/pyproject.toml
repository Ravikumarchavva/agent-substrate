[project]
name = "loamz-data-storage"
version = "0.1.0"
description = "Loamz Data's embeddable engine: SQL on SQLite or Postgres, files, vectors, text search, memory and documents."
readme = "README.md"
license = "MIT"
# 3.13 too: the document reader (loamz-data-reader) runs on 3.13 until PaddlePaddle publishes 3.14 wheels.
requires-python = ">=3.13"
dependencies = ["pydantic>=2.12"]

[project.optional-dependencies]
postgres = ["asyncpg>=0.31.0"]
pdf = ["pypdfium2>=5.0.0"]
ocr = ["rapidocr>=3.0.0", "onnxruntime>=1.23.0"]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "asyncpg>=0.31.0",
    "pypdfium2>=5.0.0",
    "httpx>=0.28,<1",
    "hypothesis>=6.100",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loamz.data.storage"

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-m", "not slow and not integration"]
markers = ["slow: needs Docker or minutes of runtime", "integration: needs Docker services"]
