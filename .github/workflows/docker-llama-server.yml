name: Image / llama-server

# Shared llama.cpp llama-server image for the llama-embed/llama-rerank sidecars (compiled C++ binary).
# CPU and GPU (CUDA) variants. Real limitation: standard runners have no GPU, so the `gpu` variant only
# compiles here (catches a broken CUDA build); functional checks need GPU hardware.
# Ported from the agent-substrate repo; the Dockerfiles do not COPY repo sources, so they work as-is.
on:
  push:
    branches: [main]
    paths:
      - deploy/docker/llama-server*.Dockerfile
      - .github/workflows/docker-llama-server.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-llama-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: deploy/docker/llama-server.Dockerfile
          - variant: gpu
            dockerfile: deploy/docker/llama-server.gpu.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image path
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/llama-server" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/docker
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ matrix.variant }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ matrix.variant }}
          cache-from: type=gha,scope=llama-server-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=llama-server-${{ matrix.variant }}
