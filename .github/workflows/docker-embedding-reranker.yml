name: Image / embedding-reranker

# Thin httpx proxy to the llama-embed/llama-rerank sidecars; single variant (no local inference to split on).
# Ported from the agent-substrate repo. Runs on changes to its inputs on main, or manually.
on:
  push:
    branches: [main]
    paths:
      - data/embedding-reranker/**
      - data/inference-pool/**
      - agents/agent-substrate/src/**
      - deploy/docker/embedding-reranker.Dockerfile
      - .github/workflows/docker-embedding-reranker.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-embedding-reranker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase image path
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/embedding-reranker" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/embedding-reranker.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=embedding-reranker
          cache-to: type=gha,mode=max,scope=embedding-reranker
