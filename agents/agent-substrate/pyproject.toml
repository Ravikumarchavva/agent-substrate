[project]
name = "ravi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ravikumar Chavva", email = "chavvaravikumarreddy2004@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "openai>=2.15.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-json-logger>=2.0.7",
    "tiktoken>=0.12.0",
    "fastapi>=0.128.0",
    "redis[hiredis]>=5.0.0",
    "sqlalchemy>=2.0.46",
    "asyncpg>=0.30.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "rich>=14.3.2",
    "pyjwt>=2.12.0",
    "cryptography>=46.0.6",
    "nats-py>=2.9",
    "apscheduler>=4.0.0a5",
    "anthropic>=0.95.0",
    "google-genai>=1.73.0",
    "k8s-agent-sandbox>=0.4.6",
    "msgspec>=0.21.1",
    "pillow>=10.4.0",
    "markitdown-ocr>=0.1.0",
    "ipywidgets>=8.1.8",
    "opentelemetry-exporter-otlp<1.20",
    "opentelemetry-instrumentation-fastapi<0.60b1",
    "paddleocr[all]",
    "ipykernel>=7.2.0",
    "playwright>=1.60.0",
]

[project.scripts]
ravi = "ravi.cli:main"
start = "ravi.cli:start_main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
exclude = ["notebooks/", "examples/", ".venv"]

[tool.ruff.lint]
# E701/E702: single-line if/semicolons are intentional in dispatch tables
# E402: mid-file imports are intentional in some route files
[tool.ruff.lint.per-file-ignores]
"src/ravi/tools/code_interpreter/guest_agent/agent.py" = ["E701", "E702"]
"src/ravi/services/conversation/routes.py" = ["E402"]
# plugin/registry.py deliberately imports base classes at the bottom of the
# module to avoid circular imports with kernel.{agents,guardrails,...}.
"src/ravi/kernel/plugin/registry.py" = ["E402"]

# ---------------------------------------------------------------------------
# import-linter — enforce the layered architecture so the kernel stays frozen.
# Layers (strictly downward dependencies only):
#   server | services  ← catalog  ← integrations  ← extensions  ← kernel
# Run with: uv run lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["ravi"]

[[tool.importlinter.contracts]]
name = "kernel is independent"
type = "forbidden"
source_modules = ["ravi.kernel"]
forbidden_modules = [
    "ravi.extensions",
    "ravi.integrations",
    "ravi.catalog",
    "ravi.server",
    "ravi.services",
    "ravi.shared",
    "ravi.configs",
    "ravi.logger",
]

[tool.uv.sources]
paddleocr = { git = "https://github.com/PaddlePaddle/PaddleOCR.git" }

# Note: a strict "layers" contract for the full stack would treat
# ``extensions → integrations`` and ``catalog → server`` as violations, but
# those cross-edges encode legitimate dependencies (e.g. RedisModelContext
# needs the Redis backend). The "kernel is independent" contract above is the
# load-bearing guarantee — it makes it mechanically impossible to leak
# upward imports into the frozen kernel layer.
