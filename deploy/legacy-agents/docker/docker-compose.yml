name: agent-framework

services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentdb
    volumes:
      - pgdata18:/var/lib/postgresql
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/10-extensions.sql
      - ./init-chatbotdb.sh:/docker-entrypoint-initdb.d/20-chatbotdb.sh
      - ./init-glitchtipdb.sh:/docker-entrypoint-initdb.d/30-glitchtipdb.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/backend.Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - workspaces:/data/workspaces
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agentdb
      REDIS_URL: redis://redis:6379/0
      OTLP_ENDPOINT: http://tempo:4318
      # "local" = per-user workspace filesystem (uploads + code-interpreter
      # workdir, one source of truth — see capabilities/storage/workspace.py).
      # Set FILE_STORE_BACKEND=s3 (and the FILE_STORE_* vars below) to use
      # the seaweedfs service instead; both stay defined here for convenience.
      FILE_STORE_BACKEND: ${FILE_STORE_BACKEND:-local}
      FILE_STORE_ROOT: /data/workspaces
      FILE_STORE_BUCKET: agent-files
      FILE_STORE_ENDPOINT: http://seaweedfs:8333
      FILE_STORE_REGION: us-east-1
      FILE_STORE_ACCESS_KEY: ${FILE_STORE_ACCESS_KEY:-substrate}
      FILE_STORE_SECRET_KEY: ${FILE_STORE_SECRET_KEY:-substrate-dev-secret}
      ENABLE_BUILDER: "true"
      FRONTEND_URL: ${FRONTEND_URL:-http://host.docker.internal:3000}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROK_API_KEY: ${GROK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      GROQ_BASE_URL: ${GROQ_BASE_URL:-https://api.groq.com/openai/v1}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-http://host.docker.internal:3001}
      OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Ravi UI}
      CHAT_MODEL: ${CHAT_MODEL:-groq/llama-3.3-70b-versatile}
      TTS_MODEL: ${TTS_MODEL:-google/gemini-3.1-flash-tts-preview}
      TTS_VOICE: ${TTS_VOICE:-Kore}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      # Empty by default — chat attachments fall back to the lightweight
      # pypdf path for PDFs. Only set this if you're also running the
      # extraction service (docker compose --profile extraction up):
      #   EXTRACTION_SERVICE_URL=http://extraction:8080 docker compose --profile extraction up
      EXTRACTION_SERVICE_URL: ${EXTRACTION_SERVICE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  substrate-ui:
    profiles:
      - ui
    build:
      context: ../../../substrate-ui
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_API_URL: http://backend:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/substrate_ui
    depends_on:
      - backend
      - postgres

  tempo:
    image: grafana/tempo:2.10.0
    user: root
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - ./tempo/data:/tmp/tempo
    ports:
      - "3200:3200"   # HTTP
      - "9095:9095"   # gRPC
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.4
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - promtaildata:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3099:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - tempo
      - loki
    restart: unless-stopped

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9000
    # profiles:
    #   - mcp
    init: true
    restart: unless-stopped

  # ── SeaweedFS (S3-compatible object store for file storage) ─────────────
  # Replaces MinIO, whose Community Edition was archived in Feb 2026 (no
  # further development, security patches, or prebuilt binaries). SeaweedFS is
  # Apache 2.0, has a decade of production use at petabyte scale, and is
  # optimised for exactly this access pattern — many small objects (~40 bytes
  # of metadata per file, O(1) reads regardless of file count).
  #
  # `weed server` runs master + volume + filer + S3 gateway in one process,
  # which is all a single-machine dev/compose setup needs; a real deployment
  # splits those roles. The engine only ever speaks the S3 API (see
  # capabilities/storage/s3.py), so swapping this for any S3-compatible
  # service — Garage, R2, AWS S3 — is a compose/env change with no code change.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: >
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024
    ports:
      - "8333:8333"   # S3 API  → FILE_STORE_ENDPOINT
      - "8888:8888"   # Filer UI — bare file browser over users/{id}/...
      - "9333:9333"   # Master UI — cluster/volume status
    volumes:
      - seaweedfsdata:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # SeaweedFS binds to the container's own IP, not 127.0.0.1, so localhost
      # is refused — hence CMD-SHELL and `hostname -i`. Probes the S3 port
      # because that is the only interface the engine actually uses.
      test: ["CMD-SHELL", "wget -qO- http://$$(hostname -i):8333/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── SeaweedFS admin console ─────────────────────────────────────────────
  # The MinIO-Console equivalent: buckets, object browser, volume/cluster
  # health, and maintenance tasks. `weed server` does not start it, so it runs
  # as its own process. The bare filer UI on :8888 stays available and is
  # fine for a quick look at users/{id}/... — this is the richer view.
  seaweedfs-admin:
    image: chrislusf/seaweedfs:latest
    command: >
      admin -port=23646 -master=seaweedfs:9333
      -dataDir=/data
      -adminUser=${SEAWEEDFS_ADMIN_USER:-admin}
      -adminPassword=${SEAWEEDFS_ADMIN_PASSWORD:-admin}
    ports:
      - "23646:23646"   # Admin console UI
    volumes:
      - seaweedfsadmin:/data
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: unless-stopped

  extraction:
    profiles:
      - extraction
    build:
      context: ../..
      dockerfile: deployment/docker/extraction.Dockerfile
    ports:
      - "8021:8080"
    depends_on:
      llama-embed:
        condition: service_healthy
      llama-rerank:
        condition: service_healthy
    environment:
      EXTRACTION_EMBED_SERVER_URL: http://llama-embed:8031
      EXTRACTION_RERANK_SERVER_URL: http://llama-rerank:8032
      EXTRACTION_ENABLE_DOCUMENT_SECURITY_SCAN: ${EXTRACTION_ENABLE_DOCUMENT_SECURITY_SCAN:-true}
      # huggingface_hub (paddlex's downloader) reads HF_TOKEN automatically.
      # Blank is fine — falls back to unauthenticated, lower rate limits.
      HF_TOKEN: ${HF_TOKEN:-}
    # PaddleOCR/PaddleX download their model weights from HuggingFace into
    # ~/.paddlex on first use, not at build time — without a persistent
    # volume that repeats on every container restart. Same rationale as
    # llama-embed/llama-rerank's LLAMA_CACHE volume below.
    volumes:
      - paddlex-model-cache:/root/.paddlex
    restart: unless-stopped

  # GPU variant of `extraction` above — local dev speedup on an NVIDIA GPU,
  # not for hosting (that stays CPU-only/cheap by default). Use one profile
  # or the other, not both (`docker compose --profile extraction-gpu up`);
  # they'd otherwise collide on host port 8021. Requires the NVIDIA
  # Container Toolkit configured for Docker on the host.
  extraction-gpu:
    profiles:
      - extraction-gpu
    build:
      context: ../..
      dockerfile: deployment/docker/extraction.gpu.Dockerfile
    ports:
      - "8021:8080"
    depends_on:
      llama-embed:
        condition: service_healthy
      llama-rerank:
        condition: service_healthy
    environment:
      EXTRACTION_EMBED_SERVER_URL: http://llama-embed:8031
      EXTRACTION_RERANK_SERVER_URL: http://llama-rerank:8032
      EXTRACTION_ENABLE_DOCUMENT_SECURITY_SCAN: ${EXTRACTION_ENABLE_DOCUMENT_SECURITY_SCAN:-true}
      EXTRACTION_DEVICE: ${EXTRACTION_DEVICE:-gpu:0}
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - paddlex-model-cache:/root/.paddlex
    restart: unless-stopped

  # Qwen3-VL-Embedding-2B sidecar (dense multimodal embedding). See
  # docs/claude_docs/decisions.md for why this pair of models + llama-server
  # was chosen — real, measured evidence (no GPU, CPU-only, ~2GB RSS each),
  # not an estimate. --parallel is a conservative launch default; see the
  # RAG redesign plan's Concurrency section before raising it.
  llama-embed:
    profiles:
      - extraction
      - extraction-gpu
    build:
      context: ../..
      dockerfile: deployment/docker/llama-server.Dockerfile
    command:
      - --hf-repo
      - Rizwan313/Qwen3-VL-Embedding-2B-GGUF
      - --hf-file
      - qwen3-vl-embedding-2b-Q4_K_M.gguf
      - --embedding
      - --pooling
      - last
      - --host
      - 0.0.0.0
      - --port
      - "8031"
      - --ctx-size
      - "2048"
      - --parallel
      - "2"
    environment:
      PORT: "8031"
      # NOT verified against a real llama-server --help output whether its
      # built-in -hf downloader honors this — matches huggingface_hub's
      # standard env var name on the chance it does; harmless if ignored.
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8031:8031"
    volumes:
      - llama-model-cache:/cache
    restart: unless-stopped

  # Qwen3-VL-Reranker-2B sidecar (multimodal cross-encoder reranking).
  # --parallel 1: the most expensive stage per query — bounded, predictable
  # CPU behavior over throughput until real load-tested. Don't raise without
  # benchmarking (see the RAG redesign plan).
  llama-rerank:
    profiles:
      - extraction
      - extraction-gpu
    build:
      context: ../..
      dockerfile: deployment/docker/llama-server.Dockerfile
    command:
      - --hf-repo
      - staralt/Qwen3-VL-Reranker-2B-Q4_K_M-GGUF
      - --hf-file
      - qwen3-vl-reranker-2b-q4_k_m-imat.gguf
      - --reranking
      - --host
      - 0.0.0.0
      - --port
      - "8032"
      - --ctx-size
      - "2048"
      - --parallel
      - "1"
    environment:
      PORT: "8032"
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8032:8032"
    volumes:
      - llama-model-cache:/cache
    restart: unless-stopped

  # ONLYOFFICE Document Server — editable Word/Excel/PowerPoint in the panel.
  # Opt-in (heavy ~2GB image). The JWT_SECRET here MUST equal the backend's
  # ONLYOFFICE_JWT_SECRET so the signed editor config + save callbacks verify.
  # See serving/monolith/routes/onlyoffice.py for the integration + networking.
  onlyoffice:
    profiles:
      - onlyoffice
    image: onlyoffice/documentserver:latest
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-change-me-onlyoffice-secret}
      JWT_HEADER: Authorization
    ports:
      - "8024:80"
    # The doc server fetches documents from / saves back to the backend via
    # ONLYOFFICE_INTERNAL_CALLBACK_BASE (host.docker.internal:8000 when the
    # backend runs on the host with `uv run start`). On Linux that name only
    # resolves with the host-gateway mapping — same as the backend service.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════════
  # GlitchTip — self-hosted, MIT-licensed, Sentry-protocol-compatible browser
  # error tracking for ravi + substrate-ui (NEXT_PUBLIC_GLITCHTIP_DSN in each
  # app's .env). Opt-in (profile-gated) — reuses the existing postgres/redis
  # services above rather than standing up dedicated ones. First-time setup:
  #   docker compose --profile glitchtip up -d
  #   docker compose run --rm glitchtip-web ./manage.py createsuperuser
  # then open http://localhost:8025, create an org + project, and paste the
  # project's DSN into each app's NEXT_PUBLIC_GLITCHTIP_DSN.
  # ══════════════════════════════════════════════════════════════════════════════
  glitchtip-web: &glitchtip
    profiles:
      - glitchtip
    image: glitchtip/glitchtip:latest
    ports:
      - "8025:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/glitchtipdb
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-CHANGE_ME_IN_PRODUCTION_USE_A_STRONG_RANDOM_SECRET}
      # Separate Redis logical DB (index 2) from the main app's (index 0) —
      # same Redis server, no dedicated container needed.
      REDIS_URL: redis://redis:6379/2
      PORT: 8000
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://localhost:8025}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@agent-substrate.com}
      ENABLE_ORGANIZATION_CREATION: "True"
      CELERY_WORKER_AUTOSCALE: "1,1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  glitchtip-worker:
    <<: *glitchtip
    ports: []
    command: ./bin/run-celery-with-beat.sh

  glitchtip-migrate:
    <<: *glitchtip
    ports: []
    restart: "no"
    command: ./manage.py migrate

volumes:
  pgdata18:
  redisdata:
  lokidata:
  promtaildata:
  seaweedfsdata:
  seaweedfsadmin:
  workspaces:
  llama-model-cache:
  paddlex-model-cache:
