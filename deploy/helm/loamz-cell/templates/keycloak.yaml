{{- if .Values.keycloak.enabled }}
{{- $full := printf "%s-keycloak" (include "cell.fullname" .) }}
{{- if .Values.keycloak.realm.import }}
{{- $realm := .Files.Get "files/realm-loamz.json" | fromJson }}
{{- $_ := set $realm "realm" .Values.keycloak.realm.name }}
{{- if .Values.keycloak.brokering.identityProviders }}
{{- $_ := set $realm "identityProviders" (concat ($realm.identityProviders | default list) .Values.keycloak.brokering.identityProviders) }}
{{- end }}
{{- if .Values.keycloak.brokering.identityProviderMappers }}
{{- $_ := set $realm "identityProviderMappers" (concat ($realm.identityProviderMappers | default list) .Values.keycloak.brokering.identityProviderMappers) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $full }}-realm
  labels: {{- include "cell.labels" . | nindent 4 }}
data:
  realm-loamz.json: |
    {{- $realm | toPrettyJson | nindent 4 }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $full }}
  labels: {{- include "cell.labels" . | nindent 4 }}
spec:
  selector: {{- include "cell.selector" (dict "root" . "component" "keycloak") | nindent 4 }}
  ports: [ { name: http, port: 8080, targetPort: http } ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $full }}
  labels: {{- include "cell.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "cell.selector" (dict "root" . "component" "keycloak") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cell.labels" . | nindent 8 }}
        app.kubernetes.io/component: keycloak
    spec:
      serviceAccountName: {{ include "cell.fullname" . }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args:
            - start
            {{- if .Values.keycloak.realm.import }}
            - --import-realm
            {{- end }}
            - --http-enabled=true
            - --hostname={{ .Values.publicUrls.keycloak }}
            - --hostname-strict=true
            - --health-enabled=true
            - --proxy-headers=xforwarded
          env:
            - { name: KC_BOOTSTRAP_ADMIN_USERNAME, value: admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { {{ include "cell.secretRef" (dict "root" . "key" "keycloak-admin-password") }} }
            - { name: KC_DB, value: postgres }
            - { name: KC_DB_URL, value: "jdbc:postgresql://{{ include "cell.pgHost" . }}:{{ include "cell.pgPort" . }}/{{ .Values.postgres.databases.keycloak }}?sslmode={{ include "cell.pgSslmode" . }}" }
            - { name: KC_DB_USERNAME, value: {{ include "cell.pgUser" . | quote }} }
            - name: KC_DB_PASSWORD
              valueFrom: { {{ include "cell.secretRef" (dict "root" . "key" "postgres-password") }} }
            # Substituted into the realm file at import (an unset one would become literal text).
            - name: SUBSTRATE_UI_CLIENT_SECRET
              valueFrom: { {{ include "cell.secretRef" (dict "root" . "key" "ui-client-secret") }} }
            - name: SUBSTRATE_DATA_WEB_CLIENT_SECRET
              valueFrom: { {{ include "cell.secretRef" (dict "root" . "key" "data-web-client-secret") }} }
            - name: CELL_ADMIN_CLIENT_SECRET
              valueFrom: { {{ include "cell.secretRef" (dict "root" . "key" "cell-admin-client-secret") }} }
            - name: ACCOUNTS_BROKER_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: {{ include "cell.secretName" . }}, key: accounts-broker-client-secret, optional: true } }
            - { name: SUBSTRATE_UI_URL, value: {{ .Values.publicUrls.ui | quote }} }
            - { name: SUBSTRATE_DATA_WEB_URL, value: {{ .Values.publicUrls.dataWeb | quote }} }
            {{- with .Values.keycloak.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          readinessProbe: { httpGet: { path: /health/ready, port: management }, periodSeconds: 10, failureThreshold: 12 }
          livenessProbe: { httpGet: { path: /health/live, port: management }, initialDelaySeconds: 60, periodSeconds: 20 }
          startupProbe: { httpGet: { path: /health/started, port: management }, periodSeconds: 5, failureThreshold: 60 }
          resources: {{- toYaml .Values.keycloak.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          {{- if .Values.keycloak.realm.import }}
          volumeMounts:
            - { name: realm, mountPath: /opt/keycloak/data/import, readOnly: true }
          {{- end }}
      {{- if .Values.keycloak.realm.import }}
      volumes:
        - { name: realm, configMap: { name: {{ $full }}-realm } }
      {{- end }}
{{- end }}
