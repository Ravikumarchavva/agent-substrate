[project]
name = "loamz-agents"
version = "0.1.0"
description = "Loamz Agents: durable agents, tools and an agent server, built on Loamz Data."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["loamz-data-storage", "loamz-identity"]

[project.optional-dependencies]
data = ["loamz-data-client"]
server = ["loamz-identity[fastapi]", "fastapi>=0.128", "uvicorn>=0.34", "pydantic-settings>=2.12"]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "pytest-xdist>=3.6", "pytest-timeout>=2.3"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loamz.agents"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-m", "not slow and not integration"]
markers = ["slow: needs Docker or minutes of runtime", "integration: needs Docker services"]
