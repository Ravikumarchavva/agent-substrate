name: Release

# release-please keeps one release PR for the monorepo. Merging it tags every released component
# (`<component>-v<version>`) and creates GitHub releases; this workflow then publishes the released Python
# distributions to PyPI (trusted publishing, no tokens) in dependency order:
#   tier 1  loamz-core, loamz-engine
#   tier 2  loamz-data (needs core), loamz-server (needs engine, core)
#   tier 3  loamz (the meta package)
# loamz-reader and the container images are published by release-images.yml.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.rp.outputs.paths_released }}
      tags: ${{ steps.rp.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-tier-1:
    name: PyPI / ${{ matrix.name }}
    needs: release-please
    if: needs.release-please.outputs.tags == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: loamz-core, dir: sdk/python/core }
          - { name: loamz-engine, dir: server/engine }
    uses: ./.github/workflows/_publish.yml
    with:
      name: ${{ matrix.name }}
      dir: ${{ matrix.dir }}
      released: ${{ needs.release-please.outputs.released }}
    permissions:
      contents: read
      id-token: write

  publish-tier-2:
    name: PyPI / ${{ matrix.name }}
    needs: [release-please, publish-tier-1]
    if: always() && needs.release-please.outputs.tags == 'true' && needs.publish-tier-1.result != 'failure'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: loamz-data, dir: sdk/python/data }
          - { name: loamz-server, dir: server/server }
    uses: ./.github/workflows/_publish.yml
    with:
      name: ${{ matrix.name }}
      dir: ${{ matrix.dir }}
      released: ${{ needs.release-please.outputs.released }}
    permissions:
      contents: read
      id-token: write

  publish-tier-3:
    name: PyPI / loamz
    needs: [release-please, publish-tier-2]
    if: always() && needs.release-please.outputs.tags == 'true' && needs.publish-tier-2.result != 'failure'
    uses: ./.github/workflows/_publish.yml
    with:
      name: loamz
      dir: meta/loamz
      released: ${{ needs.release-please.outputs.released }}
    permissions:
      contents: read
      id-token: write
