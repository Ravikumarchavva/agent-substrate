[project]
name = "substrate-data"
version = "0.1.0"
description = "Decoupled local analytical and AI data workspace"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "polars>=1.44.2,<2",
    "pyarrow>=22,<27",
    "duckdb>=1.4,<2",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20",
    "sqlglot>=27,<29",
    "pyiceberg[pyarrow]>=0.12.0,<0.13",
    "pyjwt[crypto]>=2.10",
    "orjson>=3.10",
    "boto3>=1.40",
    "substrate-data-client[arrow]",
    "substrate-identity",
    "psycopg[binary,pool]>=3.2,<4",
    # The document and memory engines it runs behind its own authorization, audit and tenancy (ADR 0004).
    "agent-substrate[postgres]",
]
[project.optional-dependencies]
sdk = ["httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.11", "pytest-xdist>=3.6", "pytest-timeout>=2.3"]
[project.scripts]
substrate-data = "substrate_data.cli:main"
[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py314"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["substrate_data", "conftest", "pki", "hog"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Docker (throwaway SeaweedFS)", "slow: needs Docker PostgreSQL with pgvector"]
