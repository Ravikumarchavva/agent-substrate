<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUBSTRATE — Kernel Contract Board</title>
<meta name="description" content="A motherboard-style diagram of the agent-substrate kernel (Layer 0): the Agent as CPU, storage as DIMM slots, tools as PCIe cards — every socket traced to its real implementation.">
<style>
  html,body{margin:0;padding:0;background:#0a0a0c;min-height:100%}
  :root{
    --ground:#0a0a0c; --board:#131316; --board-edge:#26262b; --panel:#18181c;
    --silk:#f2f2f5; --silk-dim:#9a9aa2; --rule:#232328;
    --copper:#8a6a3f; --gold:#cfa552; --lit:#e8a84c; --glow:#f0bd6f;
    --chip:#1a1a1e; --chip-edge:#2a2a30; --chip-label:#b5b5bc;
    --L1:#5ea8d8; --L2:#a98fd8; --INT:#4fb8a8; --INFRA:#d8775a; --SRV:#d8c05a;
    --new:#e8a84c; --review:#e0685a;
    --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  #k-root{background:var(--ground);color:var(--silk);font-family:var(--mono);
    -webkit-font-smoothing:antialiased;padding:20px 20px 26px;min-height:100vh}
  #k-wrap{max-width:1220px;margin:0 auto}

  /* ---- board ---- */
  .k-board{position:relative;border:1px solid var(--board-edge);border-radius:8px;background:var(--board);
    padding:22px;
    background-image:radial-gradient(var(--rule) 1px,transparent 1px);
    background-size:16px 16px}
  .k-board .hole{position:absolute;width:9px;height:9px;border-radius:50%;border:1.2px solid var(--gold);opacity:.55}
  .k-board .hole::after{content:"";position:absolute;inset:2.5px;border-radius:50%;background:var(--ground)}
  .hole.tl{top:8px;left:8px}.hole.tr{top:8px;right:8px}.hole.bl{bottom:8px;left:8px}.hole.br{bottom:8px;right:8px}

  #bus-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
  .bus{fill:none;stroke:var(--copper);stroke-width:1.6;opacity:.75}
  .bus-via{fill:var(--ground);stroke:var(--gold);stroke-width:1.3}
  .bus-flow{fill:none;stroke:var(--glow);stroke-width:1.8;stroke-dasharray:8 90;opacity:0;pointer-events:none}
  #k-root.on .bus-flow{opacity:.95;animation:flow 2.6s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-98}}

  /* Nine zones arranged as a memory hierarchy: the working set (context —
     the RAM tier) and knowledge (memory) sit directly above the runtime
     chipset; persistence backends (storage — the disk tier) and governance
     sit below it; messaging + content form the payload row at the bottom;
     tool expansion frames the right edge, off the CPU's own bus. */
  .k-grid{position:relative;display:grid;z-index:1;
    grid-template-columns:minmax(190px,1fr) minmax(190px,1fr) minmax(190px,1fr) minmax(160px,.6fr);
    grid-template-areas:
      "context   context memoryz tools"
      "models    chipset chipset tools"
      "storage   storage govern  tools"
      "messaging content content tools";
    gap:16px 30px}
  @media(max-width:900px){
    .k-grid{grid-template-columns:1fr;
      grid-template-areas:"context" "memoryz" "chipset" "models" "storage" "govern" "messaging" "content" "tools"}
  }

  .zone{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:12px 14px 14px;min-width:0}
  .z-context{grid-area:context}.z-memory{grid-area:memoryz}.z-chipset{grid-area:chipset}
  .z-tools{grid-area:tools;display:flex;flex-direction:column;gap:12px}
  .z-models{grid-area:models}.z-storage{grid-area:storage}.z-govern{grid-area:govern}
  .z-messaging{grid-area:messaging}.z-content{grid-area:content}

  .zone-h{display:flex;align-items:baseline;gap:7px;margin-bottom:9px}
  .zone-h .zc{font-size:8.5px;color:var(--gold);letter-spacing:.06em;font-weight:700;
    border:1px solid var(--gold);border-radius:50%;width:13px;height:13px;display:inline-flex;
    align-items:center;justify-content:center;flex:none}
  .zone-h .zn{font-size:10.5px;letter-spacing:.13em;font-weight:700;color:var(--silk)}
  .zone-h .zr{font-family:var(--sans);font-size:9px;color:var(--silk-dim);margin-left:auto;text-align:right}

  /* ===================== component shapes ===================== */

  /* -- generic node: name, kind glyph, click target -- */
  [data-id]{cursor:pointer}
  [data-id]:focus-visible{outline:2px solid var(--glow);outline-offset:2px;border-radius:2px}
  .lbl{font-weight:600;color:var(--silk);font-size:10px}
  .kd{font-size:7px;letter-spacing:.06em;color:var(--silk-dim)}
  .mk{position:absolute;top:-4px;right:-4px;width:6px;height:6px;z-index:1}
  .mk.new{background:var(--new);border-radius:1px}
  .mk.rev{border:1.2px solid var(--review);border-radius:50%;background:var(--panel)}

  /* -- CPU: the Agent socket -- */
  .cpu-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:6px 0 2px}
  .cpu{position:relative;width:174px;height:174px;border:1.6px solid var(--gold);border-radius:6px;
    background:var(--chip);transition:background .3s}
  .cpu::before{content:"";position:absolute;inset:14px;border-radius:3px;
    background-image:radial-gradient(var(--gold) 1.1px,transparent 1.3px);background-size:13px 13px;opacity:.4}
  .cpu-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;text-align:center;padding:0 10px}
  .cpu-label .t1{font-size:11.5px;letter-spacing:.03em;font-weight:700;color:var(--chip-label)}
  .cpu-label .t2{font-size:8px;letter-spacing:.05em;color:#6b6b72}
  .cpu-seat{position:absolute;inset:20px;border-radius:3px;background:var(--ground);border:1px solid var(--gold);
    display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;
    opacity:0;transform:scale(.85);transition:opacity .4s,transform .4s cubic-bezier(.3,1.3,.4,1)}
  #k-root.pop .cpu-seat{opacity:1;transform:scale(1)}
  .cpu-seat .t1{font-size:12px;font-weight:700;color:var(--silk)}
  .cpu-seat .t2{font-size:7.5px;letter-spacing:.08em;color:var(--L1);margin-top:3px}
  .cpu-cap{font-size:8.5px;letter-spacing:.14em;color:var(--gold);text-align:center}
  .cpu-cluster{display:flex;gap:16px;width:100%;justify-content:center;flex-wrap:wrap;align-items:flex-start}
  .cpu-col{display:flex;flex-direction:column;gap:7px;width:132px}

  /* -- PCIe: tool expansion cards -- */
  .pcies{display:flex;gap:7px;align-items:stretch;height:150px}
  .pcie{position:relative;flex:1;border:1.2px solid var(--copper);border-radius:2px;background:var(--chip);
    display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;transition:border-color .16s}
  .pcie:hover{border-color:var(--gold)}
  .pcie .teeth{position:absolute;top:6px;bottom:6px;left:-3px;width:3px;
    background-image:repeating-linear-gradient(180deg,var(--copper) 0 4px,transparent 4px 8px);opacity:.7}
  #k-root.on .pcie .teeth{background-image:repeating-linear-gradient(180deg,var(--gold) 0 4px,transparent 4px 8px);opacity:1}
  .pcie .cap{position:absolute;top:-4px;left:6px;right:6px;height:5px;border-radius:1px;background:var(--l);
    opacity:0;transition:opacity .35s}
  #k-root.pop .pcie.plugged .cap{opacity:1}
  .pcie .lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;white-space:nowrap;letter-spacing:.03em}

  /* -- SMD: small surface-mount contracts -- */
  .smds{display:flex;flex-wrap:wrap;gap:6px}
  .smd{position:relative;border:1.2px dashed var(--copper);border-radius:2px;padding:4px 7px;
    font-size:9.5px;transition:border-color .16s,background .16s}
  .smd:hover{border-color:var(--gold)}
  #k-root.on .smd{border-style:solid}
  .smd .cap{position:absolute;left:3px;right:3px;bottom:-2px;height:2px;border-radius:2px;background:var(--l);
    opacity:0;transition:opacity .35s}
  #k-root.pop .smd.plugged{background:rgba(207,165,82,.05)}
  #k-root.pop .smd.plugged .cap{opacity:1}

  /* -- fuse row (errors) -- */
  .fuses{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .fuse{display:flex;align-items:center;gap:0;cursor:pointer}
  .fuse .body{width:20px;height:9px;border-radius:5px;border:1.2px solid var(--gold);background:var(--chip)}
  .fuse .leg{width:4px;height:1.4px;background:var(--copper)}
  .fuse-cap{font-family:var(--sans);font-size:9px;color:var(--silk-dim);margin-left:6px}

  /* -- content-block cell strip -- */
  .cells{display:flex;flex-wrap:wrap;gap:4px;cursor:pointer}
  .cell{border:1.1px solid var(--copper);border-radius:2px;padding:3px 6px;font-size:8px;letter-spacing:.03em;
    color:var(--silk-dim);transition:border-color .16s,color .16s}
  .cells:hover .cell{border-color:var(--gold);color:var(--silk)}
  .cell.hero{color:var(--new);border-color:var(--new)}

  .sub{font-size:8.5px;letter-spacing:.14em;color:var(--silk-dim);margin:11px 0 6px;
    border-bottom:1px solid var(--rule);padding-bottom:4px}

  /* ---- consumer bus strip ---- */
  .consumer-bus{position:relative;z-index:1;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule);
    display:flex;flex-direction:column;gap:6px}
  .cb-ticks{display:flex;gap:3px;height:4px}
  .cb-ticks span{flex:1;background:var(--copper);opacity:.55;border-radius:1px;transition:background .3s,opacity .3s}
  #k-root.on .cb-ticks span{background:var(--gold);opacity:.9}
  .cb-cap{font-size:9px;letter-spacing:.1em;color:var(--silk-dim);text-align:center}

  /* ---- socket: dashed empty pad + solid real-chip beneath ---- */
  .sock-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px}
  .sock{position:relative;display:flex;flex-direction:column;gap:3px;cursor:pointer}
  .sock:focus-visible{outline:2px solid var(--glow);outline-offset:2px;border-radius:2px}
  .sock-cap{font-size:8px;letter-spacing:.08em;color:var(--silk-dim)}
  .sock-empty{height:6px;border:1px dashed var(--copper);border-radius:2px;opacity:.55;transition:opacity .2s}
  .sock:hover .sock-empty{opacity:.9;border-color:var(--gold)}
  .sock-chip{display:flex;align-items:center;gap:6px;border:1.2px solid var(--copper);border-radius:2px;
    background:var(--chip);padding:6px 9px;font-size:10.5px;font-weight:600;color:var(--silk);
    transition:border-color .16s}
  .sock:hover .sock-chip{border-color:var(--gold)}
  .sock-chip .dot{width:6px;height:6px;border-radius:50%;background:var(--l,var(--rule));flex:none;
    box-shadow:0 0 5px var(--l,transparent)}
  .sock-chip.empty{color:var(--silk-faint);font-style:italic;font-weight:400}



  /* ---- detail panel ---- */
  #k-scrim{position:fixed;inset:0;z-index:39;background:rgba(4,8,5,.45);opacity:0;pointer-events:none;transition:opacity .28s}
  #k-scrim.on{opacity:1;pointer-events:auto}
  #k-panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,94vw);z-index:40;background:#131316;
    border-left:1px solid var(--board-edge);padding:22px 24px 30px;overflow-y:auto;color:var(--silk);
    transform:translateX(103%);transition:transform .3s cubic-bezier(.3,1,.4,1);box-shadow:-14px 0 30px rgba(0,0,0,.35)}
  #k-panel.open{transform:translateX(0)}
  #k-panel .x{position:absolute;top:13px;right:15px;background:none;border:0;font-family:var(--mono);
    font-size:14px;color:var(--silk-dim);cursor:pointer;padding:4px 7px}
  #k-panel .x:hover{color:var(--silk)}
  .pk{display:inline-block;font-size:9px;letter-spacing:.14em;color:var(--ground);background:var(--lit);
    border-radius:2px;padding:3px 8px;margin-bottom:11px}
  .pk.rev{background:var(--review);color:#1a0e0b}
  #pk-name{font-size:20px;font-weight:700;margin:0 0 4px;text-wrap:balance;color:var(--silk)}
  #pk-mod{font-size:10px;color:var(--gold);letter-spacing:.02em;word-break:break-all;margin-bottom:14px}
  #pk-blurb{font-family:var(--sans);font-size:13px;line-height:1.62;color:#cfcfd4;margin:0;max-width:60ch}
  .ph{font-size:8.5px;letter-spacing:.18em;color:var(--silk-dim);margin:17px 0 8px;border-bottom:1px solid var(--rule);padding-bottom:5px}
  .ph.hide{display:none}
  #pk-methods{list-style:none;margin:0;padding:0}
  #pk-methods li{font-family:var(--mono);font-size:10.5px;color:var(--lit);padding:3.5px 0;border-bottom:1px dotted var(--rule)}
  #pk-impls{list-style:none;margin:0;padding:0}
  #pk-impls li{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:5px 0;border-bottom:1px dotted var(--rule);color:var(--silk)}
  #pk-impls i{width:7px;height:7px;border-radius:2px;flex:none}
  #pk-impls .ly{margin-left:auto;font-size:8px;letter-spacing:.08em;color:var(--silk-dim)}
  #pk-impls li.selectable{cursor:pointer;margin:0 -8px;padding:5px 8px;border-radius:3px;transition:background .14s}
  #pk-impls li.selectable:hover{background:rgba(207,165,82,.08)}
  #pk-impls li.selectable:focus-visible{outline:2px solid var(--glow);outline-offset:-1px}
  #pk-impls li.seated{color:var(--gold)}
  #pk-impls .seated-badge{font-size:7.5px;letter-spacing:.1em;color:var(--ground);
    background:var(--gold);border-radius:2px;padding:2px 5px;flex:none}
  #pk-note{font-family:var(--sans);font-size:12px;line-height:1.58;color:#d8b98a;margin:15px 0 0;
    border-left:2px solid var(--copper);padding-left:12px;max-width:58ch}
  #pk-note.hide{display:none}

  @media(prefers-reduced-motion:reduce){*{animation:none!important}
    .bus-flow{opacity:.35!important}}
</style>
</head>
<body>

<div id="k-root">
 <div id="k-wrap">
  <div class="k-board" id="k-board">
   <span class="hole tl"></span><span class="hole tr"></span><span class="hole bl"></span><span class="hole br"></span>
   <svg id="bus-svg"></svg>
   <div class="k-grid" id="k-grid"></div>
   <div class="consumer-bus">
    <div class="cb-ticks" id="cb-ticks"></div>
    <span class="cb-cap">CONSUMER BUS — L1 AGENTS · L2 CAPABILITIES · L3 FABRIC (IMPORTS FLOW DOWN ONLY)</span>
   </div>
  </div>
 </div>
</div>

<div id="k-scrim"></div>
<aside id="k-panel" aria-hidden="true" aria-label="Contract detail">
 <button class="x" id="pk-x" aria-label="Close">✕</button>
 <span class="pk" id="pk-kind">PROTOCOL</span>
 <h2 id="pk-name"></h2>
 <div id="pk-mod"></div>
 <p id="pk-blurb"></p>
 <div class="ph" id="pk-mh">CONTRACT SURFACE</div>
 <ul id="pk-methods"></ul>
 <div class="ph" id="pk-ih">PLUGS IN — TRACED IMPLEMENTATIONS</div>
 <ul id="pk-impls"></ul>
 <p id="pk-note"></p>
</aside>

<script>
"use strict";
(function(){
const LY={L1:["var(--L1)","L1 agents"],L2:["var(--L2)","L2 capabilities"],INT:["var(--INT)","integrations"],
  INFRA:["var(--INFRA)","infrastructure"],SRV:["var(--SRV)","serving"]};
const KD={PROTOCOL:"PROTOCOL",DATACLASS:"DATACLASS",ENUM:"ENUM",UNION:"UNION",ERRORS:"ERRORS","UNDER REVIEW":"UNDER REVIEW"};

/* ---- which real implementation is currently seated in each multi-impl
   socket. Defaults to index 0 (the primary/most-common one); picking a
   different one in the detail panel re-seats it on the board live. ---- */
const SEATED={};
function cpuSeatHTML(){
  const impl=S.agent.impls[SEATED.agent||0];
  return `<div><span class="t1">${impl[0]}</span><br><span class="t2">${impl[1]}</span></div>`;
}

/* ---- data model: shape drives which renderer places the node ---- */
const S={
 agent:{n:"Agent[CtxT]",k:"PROTOCOL",shape:"cpu",mark:"new",impls:[["ReActAgent","L1"],["OrchestratorAgent","L1"],["UserProxyAgent","L1"]],
   blurb:"The one contract every agent satisfies: a stable id and run(ctx, inbox), called each time the agent wakes. On crash or resume the coroutine re-runs from the top and journaled calls return cached results — durability is transparent.",
   methods:["id: AgentId","async run(ctx: CtxT, inbox) -> None"],
   note:"Unified 2026-07-12: two structurally-identical Agent Protocols (kernel + L1) became one generic contract. L1's Agent is now just Agent[RunContext] — a type alias, not a second declaration."},

 eventlog:{n:"EventLog",k:"PROTOCOL",shape:"ic",impls:[["PostgresEventLog","INFRA"],["InMemoryEventLog","L1"]],
   blurb:"Append-only log — the single source of truth. Fold it to reconstruct any run; effects already recorded are never re-run. Conversation history and runtime coordination share this one substrate.",
   methods:["append(run_id, entry)","read(run_id)","tail(run_id)"]},
 scheduler:{n:"Scheduler",k:"PROTOCOL",shape:"ic",impls:[["PostgresScheduler","INFRA"],["InMemoryScheduler","L1"]],
   blurb:"Run lifecycle: submit → lease → release. Suspension is release(SUSPENDED, wake_on=…) — a dormant run costs zero RAM and zero CPU until a signal or deadline wakes it.",
   methods:["submit()","lease()","release(status, wake_on)","cancel_pending()"]},
 inbox:{n:"Inbox",k:"PROTOCOL",shape:"ic",impls:[["PostgresInbox","INFRA"],["InMemoryInbox","L1"]],
   blurb:"Durable per-agent mailbox. Messages accumulate while the agent sleeps and drain as one batch at wake.",methods:["put(agent_id, msg)","drain(agent_id)"]},
 signalbus:{n:"SignalBus",k:"PROTOCOL",shape:"ic",impls:[["PostgresSignalBus","INFRA"],["InMemorySignalBus","L1"]],
   blurb:"At-most-once signal claims — the wake mechanism behind ask_human, timers and join(). consume() either claims the signal or the caller suspends until it arrives.",methods:["fire(run_id, name, payload)","consume(run_id, name, effect_id)"]},
 supervisor:{n:"Supervisor",k:"PROTOCOL",shape:"ic",impls:[["Runtime backends","L1"]],
   blurb:"Spawn-tree bookkeeping: parent/child runs, join semantics, and cancel cascade down the tree.",methods:["spawn()","join()","children()"]},
 effect:{n:"Effect/Result",k:"DATACLASS",shape:"smd",impls:[],
   blurb:"The journaled unit of work. A deterministic effect_id is the at-most-once key: replay hits the cache, the live path appends to the log.",methods:["Effect.make_id(run_id, path, kind, args)"]},
 fanout:{n:"Fanout/Follow",k:"DATACLASS",shape:"smd",impls:[],
   blurb:"How a signal or completion propagates to watchers. FollowGraph tracks who's waiting on a run; FanoutStrategy decides whether they're notified one at a time or all at once.",methods:["FollowGraph.add(watcher)","FanoutStrategy.ALL · FIRST"]},

 supervision:{n:"Supervision",k:"DATACLASS",shape:"smd",mark:"new",impls:[["SpawnTracker","L1"],["ExecutionTracker","L1"]],
   blurb:"An agent's position in the org chart plus frozen policy: headcount caps, priority preemption, token/cost budget — inherited down the tree via ctx.spawn().",
   methods:["spawn_child()","is_root()","priority"],note:"ExecutionBudget enforcement wired 2026-07-12: it propagated to children but nothing built the tracker. Now resolved fresh per run."},
 runmeta:{n:"RunMeta",k:"DATACLASS",shape:"smd",impls:[["CancellationToken","L1"]],
   blurb:"Execution-scoped metadata threaded through every kernel call: run_id, tenant, deadline, trace, cancellation, supervision. check() raises at cooperative cancellation points.",methods:["check()","is_expired()","child_token()"]},
 middleware:{n:"MiddlewareStage",k:"ENUM",shape:"smd",impls:[["25 consumers","L1"]],
   blurb:"Kernel keeps only the stage enum. The Middleware Protocol itself lives at L1 — it types against MiddlewareContext, which only exists there. A deliberate split, not drift.",methods:["TURN_START","PRE_LLM · POST_LLM","PRE_TOOL · POST_TOOL","TURN_END"]},
 compaction:{n:"CompactionStrategy",k:"PROTOCOL",shape:"smd",impls:[["SlidingWindowCompaction","L1"],["SummarizationCompaction","L1"],["TokenBudgetComposedStrategy","L1"],["CompactionPipeline","L1"]],
   blurb:"Turns the raw transcript into a prompt window that fits — the controller of the context (RAM) tier. Concrete strategies live in agents/context/compaction.",methods:["compact(raw_history)"]},
 agentctx:{n:"AgentContextProtocol",k:"PROTOCOL",shape:"smd",impls:[["AgentContext","L1"]],
   blurb:"The full runtime context contract: an agent's id plus get_prompt_window(session_id). AgentContext is its standalone implementation — wraps a HistoryProvider + CompactionPipeline the same way ContextConfig does, for callers who need get_prompt_window() directly rather than an agent constructor arg. ReActAgent itself is built straight from ContextConfig, so this path is currently exercised by tests, not production wiring — a real, correct contract that's under-used rather than dead.",
   methods:["agent_id","get_prompt_window(session_id)"]},

 llmclient:{n:"LLMClient",k:"PROTOCOL",shape:"ic",impls:[["AnthropicClient","INT"],["OpenAIClient","INT"],["GeminiClient","INT"],["OpenAIChatCompletionClient","L2"],["FallbackClient","L1"]],
   blurb:"Provider-neutral chat contract. Streams TextDelta | ReasoningDelta | CompletionEvent; the assembled response is a list of content blocks, never provider dicts.",
   methods:["generate(messages, options)","generate_stream(messages, options)","count_tokens(messages)"]},
 embed:{n:"EmbeddingClient",k:"PROTOCOL",shape:"ic",impls:[["OpenAIEmbeddingClient","INT"]],
   blurb:"Vector-embedding contract used by the RAG pipelines.",methods:["embed(text)","embed_batch(texts)"]},
 stream:{n:"Stream types",k:"DATACLASS",shape:"smd",mark:"new",impls:[],
   blurb:"The token stream: TextDelta and ReasoningDelta arrive live; CompletionEvent carries the assembled content blocks; AgentProgress is the supervision-tree feed, one topic per run.",
   methods:["TextDelta","ReasoningDelta","CompletionEvent","StreamDone","AgentProgress"],
   note:"ReasoningDelta now lands in persisted content as a ReasoningBlock (2026-07-12) — reasoning survives replay instead of being streamed and discarded."},

 history:{n:"HistoryProvider",k:"PROTOCOL",shape:"dimm",impls:[["CachedHistoryProvider","L2"],["PostgresHistoryProvider","L2"],["RedisHistoryProvider","L2"],["InMemoryHistoryProvider","L1"]],
   blurb:"Conversation history per session, always async. In production this is CachedHistoryProvider — a fast Redis cache that self-heals from the EventLog (the real durable source of truth) on a cold session, not a standalone TTL'd store.",methods:["append(agent_id, msg, session_id, run_id)","get_messages(agent_id, session_id)","clear_run(agent_id, session_id, run_id)","count_messages(agent_id, session_id)"],note:"ContextConfig.default() gives you an in-memory version for free; for the cached/durable production shape, construct CachedHistoryProvider directly."},
 vector:{n:"VectorStore",k:"PROTOCOL",shape:"dimm",impls:[["PgVectorStore","L2"],["InMemoryVectorStore","L1"]],
   blurb:"Similarity search over Documents. A Document (a RAG chunk) is distinct from a DocumentBlock (LLM message content) — never conflated.",methods:["upsert(docs, collection)","search(query_vec, limit)","delete(ids)"]},
 graph:{n:"GraphStore",k:"PROTOCOL",shape:"dimm",impls:[["AGEGraphStore","L2"],["InMemoryGraphStore","L1"]],
   blurb:"Entity / relationship graph behind GraphRAG. CypherCapable is the optional query extension.",methods:["add_entity()","add_relationship()","subgraph(seed)"]},
 blob:{n:"BlobStore",k:"PROTOCOL",shape:"dimm",impls:[["S3FileStore","L2"],["InMemoryFileStore","L1"]],
   blurb:"Opaque file / object storage for uploads and tool artifacts — the optional MinIO / S3 tier; in-memory for dev.",methods:["put(data)","get(file_id)","url(file_id)","delete(file_id)"]},
 tasks:{n:"TaskStore",k:"PROTOCOL",shape:"dimm",impls:[["PgTaskStore","INFRA"],["GlobalTaskStore","L1"]],
   blurb:"Kanban board state, driven by TaskManagerTool and rendered live in the chat UI.",methods:["add()","update()","list()"]},
 stm:{n:"ShortTermMemory",k:"PROTOCOL",shape:"dimm",impls:[["CachedShortTermMemory","L2"],["PostgresSessionStore","L2"],["RedisSessionStore","L2"]],
   blurb:"Key-value session state — what the agent is tracking right now. In production this is CachedShortTermMemory: writes land in PostgresSessionStore (durable JSONB) first, then RedisSessionStore (fast cache); reads check the cache first and fall back to Postgres on a miss.",methods:["get_state(session_id)","set_state(session_id, state)","update_state(session_id, patch)","clear(session_id)"],note:"capabilities.memory.build_short_term_memory(database_url, redis_url=…) builds this in one call — omit redis_url for Postgres-only, no cache."},
ltm:{n:"LongTermMemory",k:"PROTOCOL",shape:"dimm",impls:[["PostgresMemoryStore","L2"]],
   blurb:"Facts that persist across sessions — ‘the user prefers Python’. Retrieval is pluggable behind one contract: full-text today; vector (semantic), graph (entity), and page-index navigation plug in the same way.",methods:["save(agent_id, content)","search(agent_id, query)","get(agent_id, memory_id)","delete(agent_id, memory_id)","clear(agent_id)"],note:"No cache variant — search() is arbitrary-query, which a key-value cache doesn't map onto the way flat session state does. capabilities.memory.build_long_term_memory(database_url) builds the Postgres default."},

 tool:{n:"Tool",k:"PROTOCOL",shape:"pcie",impls:[["CalculatorTool +19","L2"],["SkillTool","L2"],["MCPTool","INT"]],
   blurb:"Structural typing is the whole trick: any class with name, description, input_schema and async execute(**kwargs) fits this slot. Drop it in capabilities/tools/ — the scanner discovers it. No base class, no registration.",
   methods:["name · description · input_schema · risk","async execute(*, ctx=None, **kwargs)"]},
 hosted:{n:"HostedTool",k:"PROTOCOL",shape:"pcie",impls:[["Provider-side (OpenAI…)","INT"]],
   blurb:"Provider declares and executes — web_search, code_interpreter, file_search. The agent loop never calls execute(); results come back inside the conversation.",methods:["provider_specs: dict[provider_id, JsonObject]"]},
 provdef:{n:"ProviderDefinedTool",k:"PROTOCOL",shape:"pcie",impls:[["Local handle_call() tools","L2"]],
   blurb:"Provider defines the call shape; you execute locally via handle_call(). Dispatch checks is_provider_defined_tool() before is_hosted_tool() — both carry provider_specs.",methods:["provider_specs","async handle_call(call, ctx)"]},
 toolreg:{n:"ToolRegistry",k:"PROTOCOL",shape:"ic",impls:[["Toolbox","L1"]],
   blurb:"A name-keyed collection of tools. Four operations — the agent loop needs nothing more.",methods:["get(name)","all()","names()","add(tool)"],
   note:"2026-07-12: Toolbox's dead schemas()/deferred_schemas()/schema_for() removed — zero callers. Wire-encoding lives per-provider in integrations/."},
 approval:{n:"ApprovalHandler",k:"PROTOCOL",shape:"ic",mark:"new",impls:[["SSEApprovalHandler","SRV"],["CallbackAdapter","L1"]],
   blurb:"The human gate for risky tool calls. ToolInvoker consults it at dispatch time for anything above the policy's risk ceiling; the run genuinely blocks until a decision arrives.",
   methods:["async request(req) -> ApprovalResult","APPROVED · DENIED · MODIFIED"],
   note:"Wired for real 2026-07-12. Before: three parallel approval abstractions existed and none reached a live agent — a CRITICAL-risk tool executed unguarded. Consolidated on this socket."},

 content:{n:"ContentBlock",k:"UNION",shape:"cells",mark:"new",impls:[],
   blurb:"The universal multimodal payload — every message, tool result and event is list[ContentBlock]. Discriminated on the type field; unknown types round-trip losslessly.",
   methods:["Text · Image · Audio · Video · Document","Data · Code · Error · Reasoning","ToolUse · ToolResult"],
   note:"ReasoningBlock added 2026-07-12 — with the signature field extended-thinking round-trips require (the old ThinkingBlock lacked it). UIResourceBlock stayed deleted: the live MCP-app UI uses _meta.ui.resourceUri instead."},
 errors:{n:"Error taxonomy",k:"ERRORS",shape:"fuse",impls:[],
   blurb:"Classification drives retry: PermanentError never retries, BudgetExhaustedError kills the branch, SuspendInterrupt is a BaseException so agent code can't accidentally swallow a suspension.",
   methods:["KernelError · AgentCrashError","PermanentError · BudgetExhaustedError","MiddlewareTermination · CancellationError","SuspendInterrupt · ConcurrentAppend · ThreadBusy"]},
 message:{n:"Message",k:"DATACLASS",shape:"smd",impls:[],
   blurb:"The addressed envelope every inbox drains: a target, a payload, and an optional reply_to for request/response round-trips.",
   methods:["target: AgentId","payload: Payload","reply_to: AgentId | None"]},
 subscription:{n:"Subscription",k:"DATACLASS",shape:"smd",impls:[],
   blurb:"A standing interest registration — who gets fanned out to when a topic fires, independent of any single message.",
   methods:["topic: TopicId","subscriber: AgentId"]},
 ids:{n:"Ids/Usage",k:"DATACLASS",shape:"smd",impls:[],
   blurb:"Addressing and accounting primitives. AgentId/TopicId are the address space; Usage tracks reasoning_tokens alongside input/output, so extended-thinking spend is first-class.",
   methods:["AgentId · TopicId","Usage.__add__ (accumulates)"]},
};

const CELL_TYPES=["Text","Image","Audio","Video","Document","Data","Code","Error","Reasoning","ToolUse","ToolResult","Unknown"];

const MOD={eventlog:"runtime/log_entry.py",scheduler:"runtime/scheduler.py",inbox:"runtime/inbox.py",signalbus:"runtime/wakeup.py",
 supervisor:"runtime/supervisor.py",effect:"runtime/effects.py",fanout:"runtime/fanout.py + runtime/follow_graph.py",
 agent:"runtime/agent.py",supervision:"agent/supervision.py",
 runmeta:"agent/runtime_context.py",middleware:"agent/middleware.py",compaction:"agent/context.py",agentctx:"agent/context.py",
 llmclient:"llm/llm.py",embed:"llm/llm.py",stream:"messaging/stream.py",history:"storage/history.py",vector:"storage/vector.py",
 graph:"storage/graph.py",blob:"storage/blob.py",tasks:"storage/tasks.py",memory:"storage/memory.py",tool:"tools/tools.py",
 hosted:"tools/tools.py",provdef:"tools/tools.py",toolreg:"tools/tools.py",approval:"tools/approval.py",content:"core/content.py",
 errors:"core/errors.py",message:"messaging/message.py",subscription:"messaging/message.py",ids:"core/identity.py + core/usage.py"};
for(const k in MOD) if(S[k]) S[k].mod=MOD[k];

/* ---- helpers ---- */
function primaryLayer(id){const im=S[id].impls;return im&&im.length?im[0][1]:null;}
function markHTML(id){const m=S[id].mark;return m?`<span class="mk ${m==='rev'?'rev':'new'}"></span>`:"";}
function plugClass(id){return primaryLayer(id)?" plugged":"";}
function plugStyle(id){const ly=primaryLayer(id);return ly?` style="--l:${LY[ly][0]}"`:"";}

function renderSocket(id,slot){
  const d=S[id]; const impl=d.impls&&d.impls[SEATED[id]||0]; const ly=impl?impl[1]:null;
  const cap=(slot!==undefined?`S${slot} · `:"")+d.n.toUpperCase();
  const chip=impl
    ? `<div class="sock-chip" style="--l:${LY[ly][0]}"><span class="dot"></span>${impl[0]}</div>`
    : `<div class="sock-chip empty">— unplugged —</div>`;
  return `<div class="sock" data-id="${id}" tabindex="0" role="button" aria-label="${d.n} — ${d.k}">${markHTML(id)}
    <span class="sock-cap">${cap}</span>
    <span class="sock-empty"></span>
    ${chip}</div>`;
}
function renderPCIE(id){
  return `<div class="pcie${plugClass(id)}" data-id="${id}" tabindex="0" role="button"${plugStyle(id)}
    aria-label="${S[id].n} — ${S[id].k}">${markHTML(id)}
    <span class="teeth"></span><span class="cap"></span>
    <span class="lbl">${S[id].n}</span></div>`;
}
function renderSMD(id){
  return `<div class="smd${plugClass(id)}" data-id="${id}" tabindex="0" role="button"${plugStyle(id)}
    aria-label="${S[id].n} — ${S[id].k}">${markHTML(id)}${S[id].n}<span class="cap"></span></div>`;
}
function renderFuse(id){
  const items=(S[id].methods.length?9:9);
  let row="";
  for(let i=0;i<9;i++) row+=`<span class="fuse"><span class="leg"></span><span class="body"></span><span class="leg"></span></span>`;
  return `<div class="fuses" data-id="${id}" tabindex="0" role="button" aria-label="${S[id].n}">${row}
    <span class="fuse-cap">F0–F8 · ${S[id].n}</span></div>`;
}
function renderCells(id){
  let row="";
  CELL_TYPES.forEach(t=>{row+=`<span class="cell${t==='Reasoning'?' hero':''}">${t}</span>`;});
  return `<div class="cells" data-id="${id}" tabindex="0" role="button" aria-label="${S[id].n}">${row}</div>`;
}

/* ---- zone builder ---- */
function zone(cls,c,n,r,inner){
  return `<section class="zone ${cls}"><div class="zone-h"><span class="zc">${c}</span>
    <span class="zn">${n}</span><span class="zr">${r}</span></div>${inner}</section>`;
}

const grid=document.getElementById("k-grid");
grid.innerHTML =
  zone("z-context","A","CONTEXT — WORKING SET","the RAM tier: transcript → compaction → prompt window",
    `<div class="sock-grid">${renderSocket("history")}${renderSocket("compaction")}</div>
     <div class="smds" style="margin-top:8px">${renderSMD("agentctx")}</div>`)
+ zone("z-memory","B","MEMORY","session state + durable facts",
    `<div class="sock-grid" style="grid-template-columns:1fr">${renderSocket("stm")}${renderSocket("ltm")}</div>`)
+ zone("z-chipset","C","RUNTIME CHIPSET — EVENT-SOURCED CORE","socket CTX-0 · Agent[CtxT] — one contract, parametrized",
    `<div class="cpu-wrap">
       <div class="cpu-cluster">
         <div class="cpu-col">${renderSocket("signalbus")}${renderSocket("supervisor")}${renderSMD("effect")}${renderSMD("fanout")}</div>
         <div class="cpu" data-id="agent" tabindex="0" role="button" aria-label="Agent[CtxT] — PROTOCOL, implemented by ReActAgent">
           <div class="cpu-label"><span class="t1">AGENT&#91;CTXT&#93;</span><span class="t2">SOCKET CTX-0</span></div>
           <div class="cpu-seat" id="cpu-seat">${cpuSeatHTML()}</div></div>
         <div class="cpu-col">${renderSocket("eventlog")}${renderSocket("scheduler")}${renderSocket("inbox")}</div>
       </div>
     </div>`)
+ zone("z-models","D","MODEL CLIENTS","external neural compute — provider-swappable",
    `<div class="sock-grid" style="grid-template-columns:1fr">${renderSocket("llmclient")}${renderSocket("embed")}</div>`)
+ zone("z-storage","E","STORAGE BACKENDS","the disk tier — memory & RAG plug in on top, agents never touch these directly",
    `<div class="sock-grid">${["vector","graph","blob","tasks"].map(id=>renderSocket(id)).join("")}</div>`)
+ zone("z-govern","F","GOVERNANCE","regulates draw, not data — budgets, priorities, retention",
    `<div class="smds">${["supervision","runmeta","middleware"].map(renderSMD).join("")}</div>`)
+ zone("z-messaging","G","MESSAGING / STREAM BUS","addressing + live token stream",
    `<div class="smds">${renderSMD("message")}${renderSMD("subscription")}</div>
     <div class="smds" style="margin-top:8px">${renderSMD("stream")}</div>`)
+ zone("z-content","H","CONTENT & FAULTS","multimodal payload + error taxonomy",
    `${renderCells("content")}<div class="sub">FAULT PROTECTION</div>${renderFuse("errors")}
     <div class="smds" style="margin-top:8px">${renderSMD("ids")}</div>`)
+ zone("z-tools","I","TOOL EXPANSION","off the CPU's own bus",
    `<div class="pcies">${["tool","hosted","provdef"].map(renderPCIE).join("")}</div>
     <div class="sock-grid" style="grid-template-columns:1fr;margin-top:10px">${renderSocket("toolreg")}${renderSocket("approval")}</div>`);

/* ---- consumer bus ticks ---- */
document.getElementById("cb-ticks").innerHTML = Array.from({length:44}).map(()=>"<span></span>").join("");

/* ---- bus traces: computed from real rendered positions, not guessed. ---- */
const board=document.getElementById("k-board"), svg=document.getElementById("bus-svg");
/* The models and tools zones sit directly beside the chipset row -- a straight
   from either into the CPU's center would cut through the chipset's own
   flanking sockets. They're visually adjacent already; only zones genuinely
   separated by open board space (a full grid row) get a routed wire. */
const BUS_ZONES=[".z-context",".z-memory",".z-storage",".z-govern"];
function layoutBuses(){
  const bRect=board.getBoundingClientRect();
  const cr0=document.querySelector(".cpu").getBoundingClientRect();
  const cr={left:cr0.left-bRect.left,right:cr0.right-bRect.left,top:cr0.top-bRect.top,bottom:cr0.bottom-bRect.top};
  cr.cx=(cr.left+cr.right)/2; cr.cy=(cr.top+cr.bottom)/2;
  svg.innerHTML="";
  const ns="http://www.w3.org/2000/svg";
  BUS_ZONES.forEach(sel=>{
    const z=document.querySelector(sel); if(!z) return;
    const r0=z.getBoundingClientRect();
    const r={left:r0.left-bRect.left,right:r0.right-bRect.left,top:r0.top-bRect.top,bottom:r0.bottom-bRect.top};
    r.cx=(r.left+r.right)/2; r.cy=(r.top+r.bottom)/2;

    // Every remaining zone sits strictly above or strictly below the
    // chipset row -- never beside it. Route vertically only: the chipset's
    // flanking sockets occupy its left/right space, but the lane directly
    // above/below the CPU's own horizontal center is always clear.
    let sx,sy,ex,ey,bendY;
    sx=r.cx; ex=cr.cx;
    if(r.cy<cr.cy){ sy=r.bottom; ey=cr.top; } else { sy=r.top; ey=cr.bottom; }
    bendY=(sy+ey)/2;
    const d = `M${sx},${sy} L${sx},${bendY} L${ex},${bendY} L${ex},${ey}`;

    const p=document.createElementNS(ns,"path"); p.setAttribute("d",d); p.setAttribute("class","bus");
    const f=document.createElementNS(ns,"path"); f.setAttribute("d",d); f.setAttribute("class","bus-flow");
    f.style.animationDelay=(-Math.random()*2.6).toFixed(2)+"s";
    const via=document.createElementNS(ns,"circle"); via.setAttribute("cx",sx); via.setAttribute("cy",sy);
    via.setAttribute("r",3); via.setAttribute("class","bus-via");
    svg.appendChild(p); svg.appendChild(f); svg.appendChild(via);
  });
}
let raf;
function scheduleLayout(){cancelAnimationFrame(raf);raf=requestAnimationFrame(layoutBuses);}
addEventListener("resize",scheduleLayout);
addEventListener("load",scheduleLayout);
requestAnimationFrame(()=>requestAnimationFrame(layoutBuses));

/* ---- one-time chip seat-in on load (board is always powered/populated) ---- */
const root=document.getElementById("k-root");
root.classList.add("on");
const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
if(reduce){
  root.classList.add("pop");
} else {
  const nodes=[...document.querySelectorAll(".plugged")];
  nodes.forEach((n,i)=>n.style.transitionDelay=(i*14)+"ms");
  setTimeout(()=>{
    root.classList.add("pop");
    setTimeout(()=>nodes.forEach(n=>n.style.transitionDelay=""),nodes.length*14+450);
  },200);
}

/* ---- re-seat a socket's chip in place after picking a different real
   implementation in the detail panel -- no full re-render needed. ---- */
function reseatChip(id){
  const d=S[id]; const impl=d.impls[SEATED[id]||0]; if(!impl) return;
  if(id==="agent"){
    document.getElementById("cpu-seat").innerHTML=cpuSeatHTML();
    return;
  }
  const chip=document.querySelector(`.sock[data-id="${id}"] .sock-chip`);
  if(chip){
    chip.style.setProperty("--l",LY[impl[1]][0]);
    chip.innerHTML=`<span class="dot"></span>${impl[0]}`;
  }
}

/* ---- detail panel ---- */
const panel=document.getElementById("k-panel"),scrim=document.getElementById("k-scrim");
function open(id){
  const d=S[id];if(!d)return;
  const kEl=document.getElementById("pk-kind");
  kEl.textContent=d.k;kEl.className="pk"+(d.k==="UNDER REVIEW"?" rev":"");
  document.getElementById("pk-name").textContent=d.n;
  document.getElementById("pk-mod").textContent="kernel/"+(d.mod||"");
  document.getElementById("pk-blurb").textContent=d.blurb;
  const mh=document.getElementById("pk-mh"),ml=document.getElementById("pk-methods");
  ml.innerHTML="";(d.methods||[]).forEach(m=>{const li=document.createElement("li");li.textContent=m;ml.appendChild(li);});
  mh.classList.toggle("hide",!(d.methods&&d.methods.length));
  const ih=document.getElementById("pk-ih"),il=document.getElementById("pk-impls");
  il.innerHTML="";(d.impls||[]).forEach(([n,ly],idx)=>{const li=document.createElement("li");
    const seated=(SEATED[id]||0)===idx;
    li.innerHTML=`<i style="background:${LY[ly][0]}"></i>${n}<span class="ly">${LY[ly][1]}</span>`;
    if(d.impls.length>1){
      li.classList.add("selectable");
      if(seated){li.classList.add("seated");li.insertAdjacentHTML("beforeend",'<span class="seated-badge">SEATED</span>');}
      li.tabIndex=0;li.setAttribute("role","button");
      li.setAttribute("aria-label",`Seat ${n} in this socket`);
      li.onclick=e=>{e.stopPropagation();SEATED[id]=idx;reseatChip(id);open(id);};
      li.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();li.onclick(e);}};
    }
    il.appendChild(li);});
  ih.classList.toggle("hide",!(d.impls&&d.impls.length));
  const nt=document.getElementById("pk-note");nt.textContent=d.note||"";nt.classList.toggle("hide",!d.note);
  panel.classList.add("open");panel.setAttribute("aria-hidden","false");scrim.classList.add("on");
}
function close(){panel.classList.remove("open");panel.setAttribute("aria-hidden","true");scrim.classList.remove("on");}
document.body.addEventListener("click",e=>{
  const c=e.target.closest("[data-id]");
  if(c) open(c.dataset.id);
  else if(!e.target.closest("#k-panel")) close();
});
document.body.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key===" "){const c=e.target.closest("[data-id]");if(c){e.preventDefault();open(c.dataset.id);}}
});
document.getElementById("pk-x").onclick=close;scrim.onclick=close;
addEventListener("keydown",e=>{if(e.key==="Escape")close();});


/* ---- report height to a parent iframe (docs/index.md embeds this page) ---- */
if(window.parent && window.parent!==window){
  const report=()=>window.parent.postMessage({kboardHeight:document.documentElement.scrollHeight},"*");
  new ResizeObserver(report).observe(document.body);
  addEventListener("load",report);
}
})();
</script>
</body>
