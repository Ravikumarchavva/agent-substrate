[project]
name = "loamz-data-server"
version = "0.1.0"
description = "Loamz Data: governed tables, SQL, files, documents, memory and databases for people and agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "loamz-data-storage[postgres,pdf]",
    "loamz-identity[fastapi]",
    "httpx>=0.28,<1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "polars>=1.44.2,<2",
    "pyarrow>=22,<27",
    "duckdb>=1.4,<2",
    "pydantic-settings>=2.8,<3",
    "python-multipart>=0.0.20",
    "sqlglot>=27,<29",
    "pyiceberg[pyarrow]>=0.10,<0.13",
    "pyjwt[crypto]>=2.10",
    "orjson>=3.10",
    "boto3>=1.40",
    "psycopg[binary,pool]>=3.2,<4",
]

[project.optional-dependencies]
# The `inference` worker role: local embedding and reranking models (llama-server children) behind the OpenAI wire.
inference = ["pillow>=12.0.0"]
# GPU detection for the inference role reads NVML; without it the pool falls back to nvidia-smi, then to CPU.
gpu = ["nvidia-ml-py>=12.0"]

[project.scripts]
loamz-data = "loamz.data.server.cli:main"

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "pytest-xdist>=3.6",
    "pytest-timeout>=2.3",
    "loamz-data-client[arrow]",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loamz.data.server"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-m", "not slow and not integration"]
markers = [
    "slow: needs Docker or minutes of runtime (a model, a real PostgreSQL with pgvector in a container)",
    "integration: needs Docker services (a throwaway SeaweedFS)",
]
