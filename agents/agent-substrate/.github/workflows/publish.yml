name: Publish to PyPI

# Fires when a GitHub Release is published (tag the release vX.Y.Z to match
# the version in pyproject.toml). Uses PyPI's trusted-publisher (OIDC) flow —
# no API token stored as a repo secret; PyPI trusts this exact workflow +
# environment combination directly.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Build
        run: uv build
      - name: Publish to PyPI
        run: uv publish
