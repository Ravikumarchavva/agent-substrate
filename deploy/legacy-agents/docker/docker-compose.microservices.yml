## Docker Compose — Microservice Deployment
##
## Usage:
##   docker compose -f deployment/docker/docker-compose.microservices.yml up -d
##
## Infrastructure services (postgres, redis) are shared.
## Each microservice gets its own container.
##
## Port allocation:
##   Gateway BFF        : 8001 (public — only service exposed to frontend)
##   Identity Auth      : 8010 (internal)
##   Policy Auth        : 8011 (internal)
##   Conversation       : 8012 (internal)
##   Job Controller     : 8013 (internal)
##   Agent Runtime      : 8014 (internal)
##   Tool Executor      : 8015 (internal)
##   Human Gate         : 8016 (internal)
##   Live Stream        : 8017 (internal)
##   File Store         : 8018 (internal)
##   Admin Control Plane: 8019 (internal)

x-common-env: &common-env
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/agentdb
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION_USE_A_STRONG_RANDOM_SECRET}
  OPENAI_API_KEY: ${OPENAI_API_KEY}

x-service-base: &service-base
  build:
    context: ..
    dockerfile: deployment/docker/backend.Dockerfile
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped
  networks:
    - agent-net

services:
  # ══════════════════════════════════════════════════════════════════════════
  # Infrastructure
  # ══════════════════════════════════════════════════════════════════════════

  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentdb
    volumes:
      - pgdata18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - agent-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    networks:
      - agent-net
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════
  # Wave 1: Identity / Policy / Gateway
  # ══════════════════════════════════════════════════════════════════════════

  identity:
    <<: *service-base
    command: ["uv", "run", "uvicorn", "agent_substrateservices.identity.app:app", "--host", "0.0.0.0", "--port", "8010"]
    ports:
      - "8010:8010"
    environment:
      <<: *common-env
      SERVICE_NAME: identity

  policy:
    <<: *service-base
    command: ["uv", "run", "uvicorn", "agent_substrateservices.policy.app:app", "--host", "0.0.0.0", "--port", "8011"]
    ports:
      - "8011:8011"
    environment:
      <<: *common-env
      SERVICE_NAME: policy

  gateway:
    <<: *service-base
    command: ["uv", "run", "uvicorn", "agent_substrateservices.gateway.app:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      SERVICE_NAME: gateway
      IDENTITY_SERVICE_URL: http://identity:8010
      POLICY_SERVICE_URL: http://policy:8011
      CONVERSATION_SERVICE_URL: http://conversation:8012
      JOB_CONTROLLER_SERVICE_URL: http://job-controller:8013
      HUMAN_GATE_SERVICE_URL: http://human-gate:8016
      LIVE_STREAM_SERVICE_URL: http://live-stream:8017
      FILE_STORE_SERVICE_URL: http://file-store:8018
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity:
        condition: service_started
      policy:
        condition: service_started

  # ══════════════════════════════════════════════════════════════════════════
  # Wave 2: Conversation / Job Controller
  # ══════════════════════════════════════════════════════════════════════════

  conversation:
    <<: *service-base
    command: ["uv", "run", "uvicorn", "agent_substrateservices.conversation.app:app", "--host", "0.0.0.0", "--port", "8012"]
    ports:
      - "8012:8012"
    environment:
      <<: *common-env
      SERVICE_NAME: conversation

  job-controller:
    <<: *service-base
    command: ["uv", "run", "uvicorn", "agent_substrateservices.job_controller.app:app", "--host", "0.0.0.0", "--port", "8013"]
    ports:
      - "8013:8013"
    environment:
      <<: *common-env
      SERVICE_NAME: job-controller

  # ══════════════════════════════════════════════════════════════════════════
  # Wave 3: Agent Runtime / Tool Executor
  # ══════════════════════════════════════════════════════════════════════════

  agent-runtime:
    <<: *service-base
    command: ["uv", "run", "uvicorn", "agent_substrateservices.agent_runtime.app:app", "--host", "0.0.0.0", "--port", "8014"]
    ports:
      - "8014:8014"
    environment:
      <<: *common-env
      SERVICE_NAME: agent-runtime
      CONVERSATION_SERVICE_URL: http://conversation:8012
      MODEL_NAME: ${MODEL_NAME:-gpt-4o}

  tool-executor:
    <<: *service-base
    command: ["uv", "run", "uvicorn", "agent_substrateservices.tool_executor.app:app", "--host", "0.0.0.0", "--port", "8015"]
    ports:
      - "8015:8015"
    environment:
      <<: *common-env
      SERVICE_NAME: tool-executor
      FILE_STORE_SERVICE_URL: http://file-store:8018
      # This service defaults to SANDBOX_RUNTIME=k8s (see tool_executor/app.py)
      # and talks to a real cluster via the kubernetes-sigs/agent-sandbox
      # controller — not to the code-interpreter-sandbox container below,
      # which is separate opt-in tooling for manually testing that image.
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-k8s}
      CI_WORKSPACE_PVC_CLAIM: ${CI_WORKSPACE_PVC_CLAIM:-}
      SANDBOX_RUNTIME_CLASS: ${SANDBOX_RUNTIME_CLASS:-}

  # ══════════════════════════════════════════════════════════════════════════════
  # Code Interpreter Sandbox — same container image the K8s agent-sandbox
  # path uses (code_interpreter/agent-sandbox/Dockerfile), run directly here
  # as a plain container. No privileged mode, no /dev/kvm — this is opt-in
  # (profile-gated) local-dev tooling, not the production K8s path (see
  # deployment/k8s/base/runtime/ for the agent-sandbox CRD-based deployment).
  # ══════════════════════════════════════════════════════════════════════════════

  code-interpreter-sandbox:
    profiles:
      - sandbox
    build:
      context: ../..
      dockerfile: src/substrate/capabilities/tools/code_interpreter/code_interpreter/agent-sandbox/Dockerfile
    environment:
      CODE_INTERPRETER_WORKSPACE: /app/workspace
    volumes:
      - ../../data/workspaces:/app/workspace
    ports:
      - "8020:8888"
    restart: unless-stopped
    networks:
      - agent-net

  # ══════════════════════════════════════════════════════════════════════════════
  # Docling document-extraction service — optional, opt-in (profile-gated).
  # Heavy image (torch/CUDA runtime) built from its own Dockerfile, not the
  # shared backend.Dockerfile x-service-base build — it needs the `docling`
  # extra that the base image deliberately excludes.
  # ══════════════════════════════════════════════════════════════════════════════

  docling:
    profiles:
      - docling
    build:
      context: ../..
      dockerfile: deployment/docker/docling.Dockerfile
    command: ["uvicorn", "substrate.serving.services.docling.app:app", "--host", "0.0.0.0", "--port", "8080"]
    ports:
      - "8022:8080"
    restart: unless-stopped
    networks:
      - agent-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 90s

  # ══════════════════════════════════════════════════════════════════════════════  # Wave 4: Human Gate / Live Stream / File Store
  # ══════════════════════════════════════════════════════════════════════════

  human-gate:
    <<: *service-base
    command: ["uv", "run", "uvicorn", "agent_substrateservices.human_gate.app:app", "--host", "0.0.0.0", "--port", "8016"]
    ports:
      - "8016:8016"
    environment:
      <<: *common-env
      SERVICE_NAME: human-gate

  live-stream:
    <<: *service-base
    command: ["uv", "run", "uvicorn", "agent_substrateservices.live_stream.app:app", "--host", "0.0.0.0", "--port", "8017"]
    ports:
      - "8017:8017"
    environment:
      <<: *common-env
      SERVICE_NAME: live-stream

  file-store:
    <<: *service-base
    command: ["uv", "run", "uvicorn", "agent_substrateservices.file_store.app:app", "--host", "0.0.0.0", "--port", "8018"]
    ports:
      - "8018:8018"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      <<: *common-env
      SERVICE_NAME: file-store
      FILE_STORE_BACKEND: s3
      FILE_STORE_BUCKET: agent-files
      FILE_STORE_ENDPOINT: http://minio:9000
      FILE_STORE_REGION: us-east-1
      FILE_STORE_ACCESS_KEY: minioadmin
      FILE_STORE_SECRET_KEY: minioadmin

  # ══════════════════════════════════════════════════════════════════════════
  # Wave 5: Admin
  # ══════════════════════════════════════════════════════════════════════════

  admin:
    <<: *service-base
    command: ["uv", "run", "uvicorn", "agent_substrateservices.admin.app:app", "--host", "0.0.0.0", "--port", "8019"]
    ports:
      - "8019:8019"
    environment:
      <<: *common-env
      SERVICE_NAME: admin

  # ══════════════════════════════════════════════════════════════════════════
  # Observability (optional)
  # ══════════════════════════════════════════════════════════════════════════

  tempo:
    image: grafana/tempo:2.10.0
    user: root
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml
      - ./tempo/data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4317:4317"
      - "4318:4318"
    networks:
      - agent-net
    profiles:
      - observability
    restart: unless-stopped

  loki:
    image: grafana/loki:2.9.4
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki/local-config.yaml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agent-net
    restart: unless-stopped

  promtail:
    image: grafana/promtail:2.9.4
    command: ["-config.file=/etc/promtail/promtail.yaml"]
    volumes:
      - ./promtail/promtail.yaml:/etc/promtail/promtail.yaml:ro
      - promtaildata:/tmp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - agent-net
    profiles:
      - observability
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - tempo
      - loki
    networks:
      - agent-net
    profiles:
      - observability
    restart: unless-stopped

  # ══════════════════════════════════════════════════════════════════════════
  # MCP Server (optional)
  # ══════════════════════════════════════════════════════════════════════════

  mcp-server:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9000
    networks:
      - agent-net
    profiles:
      - mcp
    restart: unless-stopped

volumes:
  pgdata18:
  redisdata:
  lokidata:
  promtaildata:
  file-store-data:
  miniodata:

networks:
  agent-net:
    driver: bridge
