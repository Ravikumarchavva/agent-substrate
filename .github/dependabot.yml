version: 2

# One grouped PR per ecosystem, monthly, minor/patch only. Major versions are upgraded by hand, deliberately.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # reader is outside the uv workspace (Python 3.13, own project).
  - package-ecosystem: uv
    directory: /data/reader
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  # pnpm workspace at the root (covers agents/console, data/workspace and identity/oidc-bff).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # Dockerfiles in deploy/docker.
  - package-ecosystem: docker
    directory: /deploy/docker
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
