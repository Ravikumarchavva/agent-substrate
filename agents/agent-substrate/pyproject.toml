[project]
name = "agent-substrate"
version = "0.3.0"
description = "Durable Agents for Agent Swarms, LLMs, and Autonomous Systems"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ravikumar Chavva", email = "chavvaravikumarreddy2004@gmail.com" },
]
keywords = ["ai", "agents", "llm", "multi-agent", "autonomous", "fastapi", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "httpx2>=2.7.0",
    "mcp>=1.0.0",
    "openai>=2.15.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-json-logger>=2.0.7",
    "tiktoken>=0.12.0",
    "pyyaml>=6.0",
    "rich>=14.3.2",
    "msgspec>=0.21.1",
    # image/audio/video content blocks
    "pillow>=10.4.0",
    # Postgres-backed durable runtime + memory/vector stores
    "sqlalchemy>=2.0.46",
    "greenlet>=3.0.0",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    # Redis-backed session store / event bus / semantic cache
    "redis[hiredis]>=5.0.0",
    # scheduled/cron triggers — the monolith registers this router unconditionally
    "apscheduler>=4.0.0a5",
    # the FastAPI monolith/microservices themselves, plus their JWT auth
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.34.0",
    "python-multipart>=0.0.9",
    "pyjwt>=2.12.0",
    "cryptography>=46.0.6",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi<0.60b1",
]

# Full rationale for every extra below — size costs, version-pin reasoning,
# mutual-exclusivity rules — lives in
# docs/claude_docs/architecture/optional-dependencies.md, not here.
[project.optional-dependencies]
# web search/browsing tools
web = [
    "ddgs>=9.14.4",
    "crawl4ai>=0.8.7",
    "playwright>=1.60.0",
    "exa-py>=2.14.0",
    "tavily-python>=0.7.26",
]
# K8s code-interpreter sandbox (SANDBOX_RUNTIME=k8s)
code = ["k8s-agent-sandbox>=0.4.6"]
# code_interpreter's data-science packages
sandbox = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "reportlab>=4.2.0",
    "polars>=1.0.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "scikit-learn>=1.5.0",
    "pdfplumber>=0.11.0",
]
# local PDF loading + embedded vector store
rag = ["pypdf>=6.13.0", "lancedb>=0.37.1", "networkx>=3.6.1"]
# model-based sentence segmentation (SaTSegmenter)
chunking = ["wtpsplit[onnx-cpu]>=2.1.0"]
# managed RAG via Pinecone Assistant
rag-pinecone = ["pinecone>=9.0.0"]
# non-OpenAI LLM providers — LLMFactory lazy-imports each client, so only
# the provider(s) you actually select need to be installed
anthropic = ["anthropic>=0.95.0"]
gemini = ["google-genai>=1.73.0"]
# S3-compatible object storage backend (alternative to the default local-disk store)
s3 = ["aiobotocore>=3.7.0", "botocore>=1.43.0"]
# input-safety guardrail: jailbreak + NSFW classifiers (ONNX models via HF Hub) —
# degrades gracefully if missing (MultimodalSafetyMiddleware fails open), so not core
safety = [
    "onnxruntime>=1.20.0",
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.25.0",
    "confusable-homoglyphs>=3.3.1",
]
# everything the reference monolith server needs beyond the base install
server = ["agent-substrate[web,code,rag,s3,safety,sandbox,anthropic,gemini]"]
# PaddleOCR layout/chart/table extraction, CPU wheel
document-intelligence = [
    "doc-firewall>=0.5.1",
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle==3.3.0",
    # Mode raw_text's Tier 1 DOCX/PPTX conversion — pure Python (mammoth/
    # python-pptx under the hood), no rendering engine, no LibreOffice
    # needed for the common (born-digital) case. Scoped extras only, not
    # [all] — this service has no use for markitdown's audio/HTML/zip/
    # hosted-Azure-OCR support.
    "markitdown[docx,pptx]>=0.1.0",
    # Model provisioning (models.py) — HF Hub lookups/downloads for the
    # PaddleOCR-VL GGUF files.
    "huggingface-hub>=0.24.0",
]
# same, CUDA wheel — pick one, not both
document-intelligence-gpu = [
    "doc-firewall>=0.5.1",
    "paddleocr[doc-parser]>=3.7.0",
    "paddlepaddle-gpu==3.3.0",
    "markitdown[docx,pptx]>=0.1.0",
    "huggingface-hub>=0.24.0",
    # hardware.py's GPU-detection chain — thin ctypes wrapper over
    # libnvidia-ml.so.1, which the NVIDIA Container Toolkit mounts from
    # the host driver; no CUDA dev toolkit needed at build or run time.
    "nvidia-ml-py>=12.0",
]
# local embedding provider (brings torch back)
sentence-transformers = ["sentence-transformers>=3.0.0"]

[project.urls]
Homepage = "https://agent-substrate.com"
Documentation = "https://agent-substrate.com/docs"
Repository = "https://github.com/Ravikumarchavva/agent-substrate"
Issues = "https://github.com/Ravikumarchavva/agent-substrate/issues"

[project.scripts]
substrate = "substrate.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "substrate"

# Verified/pinned wheel indexes for the document-intelligence and
# sentence-transformers extras — see
# docs/claude_docs/architecture/optional-dependencies.md for why each one
# is routed off plain PyPI (only applies when THIS repo is the active uv
# project; a downstream consumer must replicate the entry it needs).
[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu130"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }
paddlepaddle-gpu = { index = "paddle-cu130" }
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
exclude = ["notebooks/", "examples/", ".venv"]

[tool.ruff.lint]

# ---------------------------------------------------------------------------
# import-linter — enforce the layered architecture so the kernel stays frozen.
# Layers (strictly downward dependencies only):
#   fabric (L3)  ←  capabilities (L2)  ←  agents (L1)  ←  kernel (L0)
# Run with: uv run lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["substrate"]

[[tool.importlinter.contracts]]
name = "four stack layers"
type = "layers"
layers = [
    "substrate.fabric",        # L3 — orchestration programs (flows, evals, durable)
    "substrate.capabilities",  # L2 — tools, skills, knowledge, connectors
    "substrate.agents",        # L1 — core intelligence, LLM, guardrails, middleware
    "substrate.kernel",        # L0 — pure contracts: Protocols, dataclasses, enums
]

[[tool.importlinter.contracts]]
name = "agents cannot import capabilities or fabric"
type = "forbidden"
source_modules = ["substrate.agents"]
forbidden_modules = ["substrate.capabilities", "substrate.fabric"]

[[tool.importlinter.contracts]]
name = "capabilities cannot import fabric"
type = "forbidden"
source_modules = ["substrate.capabilities"]
forbidden_modules = ["substrate.fabric"]

[[tool.importlinter.contracts]]
name = "kernel is independent"
type = "forbidden"
source_modules = ["substrate.kernel"]
forbidden_modules = [
    "substrate.agents",
    "substrate.capabilities",
    "substrate.fabric",
    "substrate.integrations",
    "substrate.serving",
    "substrate.config",
    "substrate.logger",
]

[[tool.importlinter.contracts]]
name = "serving cannot import agents or capabilities"
type = "forbidden"
source_modules = ["substrate.serving"]
forbidden_modules = ["substrate.agents", "substrate.capabilities", "substrate.fabric"]
# infrastructure/ is orthogonal — it may cross-cut to agents/capabilities by design.
# We only want to catch DIRECT imports from serving/ to agents/capabilities.
allow_indirect_imports = "true"
ignore_imports = [
    # current_thread_id ContextVar spans both chat.py and capabilities/task_manager
    "substrate.serving.monolith.routes.chat -> substrate.capabilities.tools.task_manager.tool",
    # WebHITLBridge delivers human-input events; must know the capability type
    "substrate.serving.monolith.sse.bridge -> substrate.capabilities.tools.human_input",
    # pipelines/triggers routes need DTOs defined in capabilities (PipelineDef, TriggerDef, ConditionDef)
    "substrate.serving.monolith.routes.pipelines -> substrate.capabilities.pipeline.engine",
    "substrate.serving.monolith.routes.triggers -> substrate.capabilities.triggers.conditions",
    "substrate.serving.monolith.routes.triggers -> substrate.capabilities.triggers.scheduler",
    # agent_runtime: in-memory fallback Runtime (for RUNTIME_BACKEND=memory env)
    "substrate.serving.services.agent_runtime.app -> substrate.agents.runtime",
    # tool_executor IS a capability executor by design
    "substrate.serving.services.tool_executor.app -> substrate.agents.storage.tasks",
    "substrate.serving.services.tool_executor.app -> substrate.capabilities.tools.code_interpreter",
    "substrate.serving.services.tool_executor.app -> substrate.capabilities.tools.code_interpreter.code_interpreter.runtimes.factory",
    "substrate.serving.services.tool_executor.app -> substrate.capabilities.tools.task_manager.tool",
    "substrate.serving.services.tool_executor.app -> substrate.capabilities.tools.web.surfer",
    # files/workspace routes need WorkspaceFileStore/WorkspaceQuotaExceededError
    "substrate.serving.monolith.routes.files -> substrate.capabilities.storage.workspace",
    "substrate.serving.monolith.routes.workspace -> substrate.capabilities.storage.workspace",
    "substrate.serving.monolith.routes.admin -> substrate.capabilities.storage.workspace",
    "substrate.serving.monolith.routes.workspace -> substrate.capabilities.storage.layout",
    "substrate.serving.monolith.routes.files -> substrate.capabilities.storage.layout",
    "substrate.serving.monolith.routes.knowledge -> substrate.capabilities.storage.layout",
    # file_versioning builds version-snapshot keys with the same canonical
    # layout helper routes/workspace.py uses for the working file's key —
    # otherwise it has to hand-roll (and keep in sync) the same key shape.
    "substrate.serving.monolith.file_versioning -> substrate.capabilities.storage.layout",
    # gdpr route needs the erasure orchestrator itself, the same way
    # files/workspace routes need WorkspaceFileStore above
    "substrate.serving.monolith.routes.gdpr -> substrate.capabilities.gdpr.eraser",
    # chat_context inlines PDF attachment text using the existing PDFLoader
    # (pypdf/pdfplumber) rather than duplicating extraction logic
    "substrate.serving.monolith.routes.chat_context -> substrate.capabilities.knowledge.loaders.pdf_loader",
    # files/chat_context routes call the per-user session-document ingestion
    # orchestrator directly (upload-time eager staging / send-time fallback
    # ingest) — same shape as the PDFLoader exception directly above
    "substrate.serving.monolith.routes.files -> substrate.capabilities.knowledge.session_ingest",
    "substrate.serving.monolith.routes.chat_context -> substrate.capabilities.knowledge.session_ingest",
    # Note: chat_context.py/files.py's ExtractionClient import, and
    # runtimes/document_intelligence/service/{schemas,routes}.py's import of
    # client.py/security_scan.py, no longer need an exception here —
    # runtimes/ is a new orthogonal top-level package (like serving/
    # integrations/infrastructure), not under capabilities, so this
    # "serving cannot import agents or capabilities" contract doesn't apply
    # to those edges.
]

# Orthogonal peers (not part of the layer stack):
# integrations/ — concrete I/O ports (LLM clients, memory backends, vector stores)
# serving/      — FastAPI monolith + microservices + shared infra
# runtimes/     — independently-deployable, heavy-dependency, HTTP-only
#                 services (document_intelligence, embedding_reranker)
# These carry cross-layer edges by design (e.g. an integration implements a kernel
# Protocol; serving wires all layers together in lifespan).
