apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cell.fullname" . }}
  labels: {{- include "cell.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- if and (eq .Values.agent.sandbox.runtime "k8s") .Values.agent.sandbox.rbac }}
---
# The k8s code-interpreter runtime creates sandbox pods in the release namespace and talks to them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cell.fullname" . }}-sandbox
  labels: {{- include "cell.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/exec, pods/log, persistentvolumeclaims]
    verbs: [get, list, watch, create, delete, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cell.fullname" . }}-sandbox
  labels: {{- include "cell.labels" . | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "cell.fullname" . }}-sandbox }
subjects:
  - { kind: ServiceAccount, name: {{ include "cell.fullname" . }}, namespace: {{ .Release.Namespace }} }
{{- end }}
