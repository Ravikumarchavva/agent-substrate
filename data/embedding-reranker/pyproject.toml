[project]
name = "embedding-reranker"
version = "0.1.0"
description = "Multimodal embedding and reranking over HTTP: a thin service in front of llama-server (Qwen3-VL-Embedding / -Reranker)."
requires-python = ">=3.11"
# No model library in here: the models run in llama-server processes this service talks to (or spawns, in local mode).
dependencies = [
    "agent-substrate[services,logging]",
    "inference-pool",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.12.0",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
test = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0", "httpx>=0.27.0"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "embedding_reranker"

[tool.uv.sources]
agent-substrate = { path = "../..", editable = true }
inference-pool = { path = "../../packages/inference-pool", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
