[project]
name = "agent-substrate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ravikumar Chavva", email = "chavvaravikumarreddy2004@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
    "openai>=2.15.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "python-json-logger>=2.0.7",
    "tiktoken>=0.12.0",
    "fastapi>=0.128.0",
    "redis[hiredis]>=5.0.0",
    "sqlalchemy>=2.0.46",
    "asyncpg>=0.30.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    "rich>=14.3.2",
    "pyjwt>=2.12.0",
    "cryptography>=46.0.6",
    "apscheduler>=4.0.0a5",
    "anthropic>=0.95.0",
    "google-genai>=1.73.0",
    "k8s-agent-sandbox>=0.4.6",
    "msgspec>=0.21.1",
    "pillow>=10.4.0",
    "markitdown-ocr>=0.1.0",
    "ipywidgets>=8.1.8",
    "opentelemetry-exporter-otlp<1.20",
    "opentelemetry-instrumentation-fastapi<0.60b1",
    "paddleocr[all]",
    "ipykernel>=7.2.0",
    "playwright>=1.60.0",
    "psycopg[binary]>=3.3.4",
    "pgvector>=0.4.2",
    "ddgs>=9.14.4",
    "crawl4ai>=0.8.7",
    "pypdf>=6.13.0",
    "docling>=2.0.0",
    "aiobotocore>=3.7.0",
    "botocore>=1.43.0",
    "exa-py>=2.14.0",
    "tavily-python>=0.7.26",
]

[project.scripts]
agent-substrate = "agent_substrate.cli:main"
start = "agent_substrate.cli:start_main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.11",
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]


[tool.ruff]
exclude = ["notebooks/", "examples/", ".venv"]

[tool.ruff.lint]
# E701/E702: single-line if/semicolons are intentional in dispatch tables
# E402: mid-file imports are intentional in some route files
[tool.ruff.lint.per-file-ignores]
"src/agent_substrate/tools/code_interpreter/guest_agent/agent.py" = ["E701", "E702"]
"src/agent_substrate/services/conversation/routes.py" = ["E402"]
# plugin/registry.py deliberately imports base classes at the bottom of the
# module to avoid circular imports with kernel.{agents,guardrails,...}.
"src/agent_substrate/kernel/plugin/registry.py" = ["E402"]

# ---------------------------------------------------------------------------
# import-linter — enforce the layered architecture so the kernel stays frozen.
# Layers (strictly downward dependencies only):
#   server | services  ← catalog  ← integrations  ← extensions  ← kernel
# Run with: uv run lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["agent_substrate"]

[[tool.importlinter.contracts]]
name = "four stack layers"
type = "layers"
layers = [
    "agent_substrate.fabric",        # L3 — orchestration programs (flows, evals, durable)
    "agent_substrate.capabilities",  # L2 — tools, skills, knowledge, connectors
    "agent_substrate.agents",        # L1 — core intelligence, LLM, guardrails, middleware
    "agent_substrate.kernel",        # L0 — pure contracts: Protocols, dataclasses, enums
]

[[tool.importlinter.contracts]]
name = "agents cannot import capabilities or fabric"
type = "forbidden"
source_modules = ["agent_substrate.agents"]
forbidden_modules = ["agent_substrate.capabilities", "agent_substrate.fabric"]

[[tool.importlinter.contracts]]
name = "capabilities cannot import fabric"
type = "forbidden"
source_modules = ["agent_substrate.capabilities"]
forbidden_modules = ["agent_substrate.fabric"]

[[tool.importlinter.contracts]]
name = "kernel is independent"
type = "forbidden"
source_modules = ["agent_substrate.kernel"]
forbidden_modules = [
    "agent_substrate.agents",
    "agent_substrate.capabilities",
    "agent_substrate.fabric",
    "agent_substrate.integrations",
    "agent_substrate.serving",
    "agent_substrate.config",
    "agent_substrate.logger",
]

[[tool.importlinter.contracts]]
name = "serving cannot import agents or capabilities"
type = "forbidden"
source_modules = ["agent_substrate.serving"]
forbidden_modules = ["agent_substrate.agents", "agent_substrate.capabilities", "agent_substrate.fabric"]
# infrastructure/ is orthogonal — it may cross-cut to agents/capabilities by design.
# We only want to catch DIRECT imports from serving/ to agents/capabilities.
allow_indirect_imports = "true"
ignore_imports = [
    # current_thread_id ContextVar spans both chat.py and capabilities/task_manager
    "agent_substrate.serving.monolith.routes.chat -> agent_substrate.capabilities.tools.task_manager.tool",
    # WebHITLBridge delivers human-input events; must know the capability type
    "agent_substrate.serving.monolith.sse.bridge -> agent_substrate.capabilities.tools.human_input",
    # pipelines/triggers routes need DTOs defined in capabilities (PipelineDef, TriggerDef, ConditionDef)
    "agent_substrate.serving.monolith.routes.pipelines -> agent_substrate.capabilities.pipeline.engine",
    "agent_substrate.serving.monolith.routes.triggers -> agent_substrate.capabilities.triggers.conditions",
    "agent_substrate.serving.monolith.routes.triggers -> agent_substrate.capabilities.triggers.scheduler",
    # agent_runtime: in-memory fallback Runtime (for RUNTIME_BACKEND=memory env)
    "agent_substrate.serving.services.agent_runtime.app -> agent_substrate.agents.runtime",
    # agent_runtime service: load_session_memory is an L1 concern with no kernel protocol yet
    "agent_substrate.serving.services.agent_runtime.service -> agent_substrate.agents.factory",
    # tool_executor and code_interpreter ARE capability executors by design
    "agent_substrate.serving.services.tool_executor.app -> agent_substrate.agents.storage.tasks",
    "agent_substrate.serving.services.tool_executor.app -> agent_substrate.capabilities.tools.code_interpreter.http_client",
    "agent_substrate.serving.services.tool_executor.app -> agent_substrate.capabilities.tools.code_interpreter.tool",
    "agent_substrate.serving.services.tool_executor.app -> agent_substrate.capabilities.tools.task_manager.tool",
    "agent_substrate.serving.services.tool_executor.app -> agent_substrate.capabilities.tools.web.surfer",
    "agent_substrate.serving.services.code_interpreter.app -> agent_substrate.capabilities.tools.code_interpreter.config",
    "agent_substrate.serving.services.code_interpreter.app -> agent_substrate.capabilities.tools.code_interpreter.session_manager",
    "agent_substrate.serving.services.code_interpreter.schemas -> agent_substrate.capabilities.tools.code_interpreter.schemas",
]

[tool.uv.sources]
paddleocr = { git = "https://github.com/PaddlePaddle/PaddleOCR.git" }

# Orthogonal peers (not part of the layer stack):
# integrations/ — concrete I/O ports (LLM clients, memory backends, vector stores)
# serving/      — FastAPI monolith + microservices + shared infra
# These carry cross-layer edges by design (e.g. an integration implements a kernel
# Protocol; serving wires all layers together in lifespan).
