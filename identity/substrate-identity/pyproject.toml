[project]
name = "substrate-identity"
version = "0.1.0"
description = "Verify Keycloak (OIDC) access tokens and trusted-issuer tokens; one library for every Substrate service"
readme = "README.md"
requires-python = ">=3.13"
# Deliberately small: every service imports this.
dependencies = ["pyjwt[crypto]>=2.10", "httpx>=0.28,<1"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.115,<1", "ruff>=0.11"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "substrate_identity"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["substrate_identity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
