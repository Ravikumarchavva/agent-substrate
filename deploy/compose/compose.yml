# Substrate cell: the self-host bundle (ADR 0006). One identical stack for every hosting model's smallest form.
#
#   ./gen-env.sh                                   # secrets
#   docker compose --profile monolith up -d --build        # agent server as one process (default choice)
#   docker compose --profile microservices up -d --build   # agent server as ten services behind a gateway
#   add --profile ml for embedding-reranker and its llama.cpp sidecars (large model downloads)
#
# Exactly one of the monolith / microservices profiles. Ports are in ../PORTS.md; nothing but the UIs, the agent
# API, Keycloak and the S3 endpoint is published, and only on BIND_ADDR.
name: ${COMPOSE_PROJECT_NAME:-loamz-cell}

x-data-env: &data-env
  # The services are on one private Docker network behind (optionally) a TLS-terminating proxy; plain HTTP to these
  # named hosts is an explicit opt-in in loamz-data, and the proxy flag lets it listen beyond loopback.
  LOAMZ_DATA_INSECURE_HTTP_HOSTS: '["seaweedfs","keycloak","keycloak.localhost","s3.localhost","agent-server"]'
  # Controller and workers serve HTTPS with the cell's private CA (cell-init); the API trusts it.
  LOAMZ_DATA_INTERNAL_CA_FILE: /tls/ca.crt
  LOAMZ_DATA_BEHIND_TLS_PROXY: "true"
  LOAMZ_DATA_OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://keycloak.localhost:8080}/realms/loamz
  LOAMZ_DATA_OIDC_AUDIENCE: loamz-data
  LOAMZ_DATA_S3_ENDPOINT_URL: http://seaweedfs:8333
  LOAMZ_DATA_ICEBERG_CATALOG_URL: http://seaweedfs:8181
  LOAMZ_DATA_WAREHOUSE: ${WAREHOUSE_BUCKET:-warehouse}
  LOAMZ_DATA_STAGING_BUCKET: ${STAGING_BUCKET:-substrate-staging}
  LOAMZ_DATA_VOLUMES_BUCKET: ${VOLUMES_BUCKET:-substrate-volumes}
  LOAMZ_DATA_STORAGE_ID: cell-warehouse
  LOAMZ_DATA_CONTROLLER_URL: https://data-controller:8040

x-data-image: &data-image
  image: ${IMAGE_REGISTRY:-ghcr.io/ravikumarchavva}/loamz-data:${IMAGE_TAG:-local}
  build: { context: ../.., dockerfile: deploy/docker/loamz-data.Dockerfile }

x-data-tls: &data-tls
  LOAMZ_DATA_TLS_CERT_FILE: /tls/server.crt
  LOAMZ_DATA_TLS_KEY_FILE: /tls/server.key

# The controller and workers speak HTTPS, so the image's plain-HTTP probe does not apply.
x-https-health: &https-health
  test: ["CMD", "python", "-c", "import os, ssl, urllib.request as u; c = ssl.create_default_context(cafile='/tls/ca.crt'); u.urlopen('https://localhost:%s/readyz' % os.environ['PORT'], timeout=4, context=c)"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

x-worker-env: &worker-env
  <<: [*data-env, *data-tls]
  LOAMZ_DATA_WORKER_BIND_HOST: 0.0.0.0
  LOAMZ_DATA_WORKER_TOKEN: ${WORKER_TOKEN:?run ./gen-env.sh}
  LOAMZ_DATA_S3_ACCESS_KEY_ID: ${WORKER_S3_ACCESS_KEY_ID:?}
  LOAMZ_DATA_S3_SECRET_ACCESS_KEY: ${WORKER_S3_SECRET_ACCESS_KEY:?}
  LOAMZ_DATA_TICKET_PUBLIC_KEY_FILE: /keys/ticket.pub.pem
  LOAMZ_DATA_WORKER_MEMORY_LIMIT: ${LOAMZ_DATA_WORKER_MEMORY_LIMIT:-${SUBSTRATE_DATA_WORKER_MEMORY_LIMIT:-2GB}}

x-agent-image: &agent-image
  image: ${IMAGE_REGISTRY:-ghcr.io/ravikumarchavva}/loamz-agents:${IMAGE_TAG:-local}
  build: { context: ../.., dockerfile: deploy/docker/loamz-agents.Dockerfile }

x-agent-env: &agent-env
  # Loamz Agents native settings tree (LOAMZ_AGENTS_<SECTION>__<NAME>)
  LOAMZ_AGENTS_DATABASE__URL: postgresql://${POSTGRES_USER:-substrate}:${POSTGRES_PASSWORD:?run ./gen-env.sh}@postgres:5432/agentdb?sslmode=require
  LOAMZ_AGENTS_REDIS__URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  LOAMZ_AGENTS_OIDC__ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://keycloak.localhost:8080}/realms/loamz
  LOAMZ_AGENTS_OIDC__AUDIENCE: loamz-agents
  LOAMZ_AGENTS_OIDC__INSECURE_HTTP: "true"
  LOAMZ_AGENTS_HTTP__FRONTEND_URL: ${AGENTS_CONSOLE_URL:-${SUBSTRATE_UI_URL:-http://localhost:3000}}
  LOAMZ_AGENTS_SANDBOX__RUNTIME: ${SANDBOX_RUNTIME:-nsjail}
  LOAMZ_AGENTS_LLM__MODEL: ${CHAT_MODEL:-google/gemini-3.1-flash-lite}
  LOAMZ_AGENTS_LLM__OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  LOAMZ_AGENTS_LLM__ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  LOAMZ_AGENTS_LLM__GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LOAMZ_AGENTS_LLM__OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  # Legacy env var compatibility
  DATABASE_URL: postgresql://${POSTGRES_USER:-substrate}:${POSTGRES_PASSWORD}@postgres:5432/agentdb?sslmode=require
  ASYNC_DATABASE_URL: postgresql://${POSTGRES_USER:-substrate}:${POSTGRES_PASSWORD}@postgres:5432/agentdb?sslmode=require
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  STORE_BACKEND: postgres
  # Files, documents and memory live in loamz-data; the agent server holds no object-store credentials.
  DATA_SERVICE_URL: http://data-api:8020
  DATA_SERVICE_INSECURE_HOSTS: '["data-api"]'
  # Who may ask for a data token for a user: the agent server confirms organization membership in Keycloak first.
  OIDC_ADMIN_CLIENT_ID: agent-membership
  OIDC_ADMIN_CLIENT_SECRET: ${AGENT_MEMBERSHIP_CLIENT_SECRET:?run ./gen-env.sh}
  # Keycloak resource-server settings (the verifier in the agent server reads these).
  OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://keycloak.localhost:8080}/realms/loamz
  OIDC_AUDIENCE: loamz-agents
  # Keycloak is on the cell's private network over plain http (TLS terminates at the proxy in front, if any).
  OIDC_INSECURE_HTTP: "true"
  # No collector in the self-host bundle; point OTEL_EXPORTER_OTLP_ENDPOINT at one and unset this to export traces.
  OTEL_SDK_DISABLED: "true"
  FRONTEND_URL: ${AGENTS_CONSOLE_URL:-${SUBSTRATE_UI_URL:-http://localhost:3000}}
  SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-nsjail}
  CHAT_MODEL: ${CHAT_MODEL:-google/gemini-3.1-flash-lite}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

# Capabilities the nsjail code-interpreter runtime needs. Remove them (and set SANDBOX_RUNTIME) if you provide
# sandboxing another way; without them the server refuses to start with nsjail selected.
x-nsjail: &nsjail
  user: "0:0"
  cgroup: host
  cap_add: [SYS_ADMIN]
  security_opt: ["seccomp=unconfined"]

x-microservice: &microservice
  <<: *agent-image
  profiles: [microservices]
  environment: &microservice-env
    <<: *agent-env
    SUBSTRATE_MODE: microservices
    # How the services find each other: {name} is the service in dashes, {port} its port (deploy/PORTS.md).
    SERVICE_URL_TEMPLATE: http://agent-{name}:{port}
    AGENT_RUNTIME_SERVICE_URL: http://agent-runtime:8014
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    seaweed-init: { condition: service_completed_successfully }
  restart: unless-stopped

services:
  # ── State ───────────────────────────────────────────────────────────────────
  cell-init:
    <<: *data-image
    user: "0:0"
    entrypoint: ["python", "/init/cell-init.py"]
    healthcheck: { disable: true }
    command: []
    environment:
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:-warehouse}
      STAGING_BUCKET: ${STAGING_BUCKET:-substrate-staging}
      VOLUMES_BUCKET: ${VOLUMES_BUCKET:-substrate-volumes}
      AGENTS_BUCKET: ${AGENTS_BUCKET:-agent-files}
      CONTROL_S3_ACCESS_KEY_ID: ${CONTROL_S3_ACCESS_KEY_ID:?run ./gen-env.sh}
      CONTROL_S3_SECRET_ACCESS_KEY: ${CONTROL_S3_SECRET_ACCESS_KEY:?}
      WORKER_S3_ACCESS_KEY_ID: ${WORKER_S3_ACCESS_KEY_ID:?}
      WORKER_S3_SECRET_ACCESS_KEY: ${WORKER_S3_SECRET_ACCESS_KEY:?}
      AGENTS_S3_ACCESS_KEY_ID: ${AGENTS_S3_ACCESS_KEY_ID:?}
      AGENTS_S3_SECRET_ACCESS_KEY: ${AGENTS_S3_SECRET_ACCESS_KEY:?}
    volumes:
      - ./init:/init:ro
      - seaweed-config:/out/seaweed
      - ticket-private:/out/ticket-private
      - ticket-public:/out/ticket-public
      - postgres-tls:/out/postgres-tls
      - internal-tls:/out/internal-tls
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg16
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/tls/server.crt
      - -c
      - ssl_key_file=/tls/server.key
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-substrate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./gen-env.sh}
      POSTGRES_DB: agentdb
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-tls:/tls:ro
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d agentdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      cell-init: { condition: service_completed_successfully }
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?run ./gen-env.sh}", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  seaweedfs:
    # The public name (s3.localhost) reaches this container from inside the cell too: one address for browsers and services.
    networks: { default: { aliases: ['s3.localhost'] } }
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - server
      - -dir=/data
      - -ip=seaweedfs
      - -ip.bind=0.0.0.0
      - -filer
      - -s3
      - -s3.config=/config/s3.json
      - -s3.port.iceberg=8181
      - -s3.allowDeleteBucketNotEmpty=false
      # Browsers upload straight to presigned URLs; only the workspace UI origin may.
      - -s3.allowedOrigins=${SUBSTRATE_DATA_WEB_URL:-http://localhost:3011}
      - -master.volumeSizeLimitMB=1024
      - -volume.max=0
      - -master.telemetry=false
    volumes:
      - seaweed-data:/data
      - seaweed-config:/config:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT_S3:-8333}:8333"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/status || wget -q -O /dev/null --server-response http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      cell-init: { condition: service_completed_successfully }
    restart: unless-stopped

  seaweed-init:
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for i in $$(seq 1 60); do
          out=$$(printf 's3.bucket.create -name %s\ns3.bucket.create -name %s\ns3.bucket.create -name %s\ns3tables.bucket -create -name %s -account 000000000000\nexit\n' "$$STAGING_BUCKET" "$$VOLUMES_BUCKET" "$$AGENTS_BUCKET" "$$WAREHOUSE_BUCKET" | weed shell -master=seaweedfs:9333 2>&1) && break
          sleep 2
        done
        echo "$$out" | tail -5
        if echo "$$out" | grep -qi error && ! echo "$$out" | grep -qi exist; then exit 1; fi
    environment:
      STAGING_BUCKET: ${STAGING_BUCKET:-substrate-staging}
      VOLUMES_BUCKET: ${VOLUMES_BUCKET:-substrate-volumes}
      AGENTS_BUCKET: ${AGENTS_BUCKET:-agent-files}
      WAREHOUSE_BUCKET: ${WAREHOUSE_BUCKET:-warehouse}
    depends_on:
      seaweedfs: { condition: service_healthy }
    restart: "no"

  # ── Identity ────────────────────────────────────────────────────────────────
  keycloak:
    # The public name (keycloak.localhost) reaches this container from inside the cell too: one address for browsers and services.
    networks: { default: { aliases: ['keycloak.localhost'] } }
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm", "--http-enabled=true", "--hostname=${KEYCLOAK_PUBLIC_URL:-http://keycloak.localhost:8080}", "--hostname-strict=true", "--health-enabled=true", "--proxy-headers=xforwarded"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run ./gen-env.sh}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak?sslmode=require
      KC_DB_USERNAME: ${POSTGRES_USER:-substrate}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Substituted into the realm file at import. All three are required: an unset one becomes the literal text.
      AGENTS_CONSOLE_CLIENT_SECRET: ${AGENTS_CONSOLE_CLIENT_SECRET:-${SUBSTRATE_UI_CLIENT_SECRET:?run ./gen-env.sh}}
      DATA_WORKSPACE_CLIENT_SECRET: ${DATA_WORKSPACE_CLIENT_SECRET:-${SUBSTRATE_DATA_WEB_CLIENT_SECRET:?}}
      SUBSTRATE_UI_CLIENT_SECRET: ${SUBSTRATE_UI_CLIENT_SECRET:?run ./gen-env.sh}
      SUBSTRATE_DATA_WEB_CLIENT_SECRET: ${SUBSTRATE_DATA_WEB_CLIENT_SECRET:?}
      CELL_ADMIN_CLIENT_SECRET: ${CELL_ADMIN_CLIENT_SECRET:?}
      AGENT_MEMBERSHIP_CLIENT_SECRET: ${AGENT_MEMBERSHIP_CLIENT_SECRET:?}
      AGENTS_CONSOLE_URL: ${AGENTS_CONSOLE_URL:-${SUBSTRATE_UI_URL:-http://localhost:3000}}
      DATA_WORKSPACE_URL: ${DATA_WORKSPACE_URL:-${SUBSTRATE_DATA_WEB_URL:-http://localhost:3011}}
      SUBSTRATE_UI_URL: ${SUBSTRATE_UI_URL:-http://localhost:3000}
      SUBSTRATE_DATA_WEB_URL: ${SUBSTRATE_DATA_WEB_URL:-http://localhost:3011}
    volumes:
      - ../keycloak/realm-loamz.json:/opt/keycloak/data/import/realm-loamz.json:ro
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT_KEYCLOAK:-8080}:8080"
    healthcheck:
      # The image has no curl; the management port (9000) answers /health/ready.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  # ── loamz-data ──────────────────────────────────────────────────────────────
  data-api:
    <<: *data-image
    command: ["serve", "--host", "0.0.0.0", "--port", "8020"]
    environment:
      <<: *data-env
      PORT: "8020"
      LOAMZ_DATA_METADATA_URL: postgresql://${POSTGRES_USER:-substrate}:${POSTGRES_PASSWORD}@postgres:5432/substrate_data?sslmode=require
      LOAMZ_DATA_CONTROLLER_TOKEN: ${CONTROLLER_TOKEN:?run ./gen-env.sh}
      LOAMZ_DATA_S3_ACCESS_KEY_ID: ${CONTROL_S3_ACCESS_KEY_ID}
      LOAMZ_DATA_S3_SECRET_ACCESS_KEY: ${CONTROL_S3_SECRET_ACCESS_KEY}
      LOAMZ_DATA_TICKET_PRIVATE_KEY_FILE: /keys/ticket.pem
      LOAMZ_DATA_VOLUMES_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_URL:-http://s3.localhost:8333}
      LOAMZ_DATA_MASK_SALT: ${MASK_SALT:-}
      # The documents and memory index (ADR 0008): its own database, with pgvector. The folder holds only scratch (no bundles).
      LOAMZ_DATA_RETRIEVAL_URL: postgresql://${POSTGRES_USER:-substrate}:${POSTGRES_PASSWORD}@postgres:5432/data_retrieval?sslmode=require
      LOAMZ_DATA_RETRIEVAL_DIR: /var/lib/loamz-data/retrieval
      LOAMZ_DATA_DOCUMENT_READER_URL: ${DOCUMENT_READER_URL:-}
      LOAMZ_DATA_DOCUMENT_EMBEDDING_URL: ${DOCUMENT_EMBEDDING_URL:-}
      # The agent server signs per-run tokens for its users; the data service fetches its public keys. One name may only
      # read; the other (`-files`) may also change files, documents and memory (scopes still bound every token).
      LOAMZ_DATA_TRUSTED_ISSUERS: '[{"issuer":"loamz-agents","audience":"loamz-data","jwks_uri":"http://agent-server:8000/.well-known/data-token-jwks.json","read_only":true},{"issuer":"loamz-agents-files","audience":"loamz-data","jwks_uri":"http://agent-server:8000/.well-known/data-token-jwks.json","read_only":false}]'
    volumes:
      - ticket-private:/keys:ro
      - internal-tls:/tls:ro
      - data-api-state:/var/lib/loamz-data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT_DATA_API:-8020}:8020"
    depends_on:
      postgres: { condition: service_healthy }
      seaweed-init: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    restart: unless-stopped

  data-controller:
    <<: *data-image
    command: ["controller", "--host", "0.0.0.0", "--port", "8040"]
    environment:
      <<: [*data-env, *data-tls]
      PORT: "8040"
      LOAMZ_DATA_CONTROLLER_TOKEN: ${CONTROLLER_TOKEN:?}
    healthcheck: *https-health
    volumes:
      - controller-state:/var/lib/loamz-data
      - internal-tls:/tls:ro
    restart: unless-stopped

  data-worker-sql:
    <<: *data-image
    command: ["worker", "--role", "sql", "--port", "8041"]
    environment: { <<: *worker-env, PORT: "8041" }
    healthcheck: *https-health
    volumes: [ "ticket-public:/keys:ro", "internal-tls:/tls:ro" ]
    depends_on:
      seaweed-init: { condition: service_completed_successfully }
    restart: unless-stopped

  data-worker-jobs:
    <<: *data-image
    command: ["worker", "--role", "jobs", "--port", "8042"]
    environment: { <<: *worker-env, PORT: "8042" }
    healthcheck: *https-health
    volumes: [ "ticket-public:/keys:ro", "internal-tls:/tls:ro" ]
    depends_on:
      seaweed-init: { condition: service_completed_successfully }
    restart: unless-stopped

  data-worker-documents:
    <<: *data-image
    command: ["worker", "--role", "documents", "--port", "8043"]
    environment: { <<: *worker-env, PORT: "8043" }
    healthcheck: *https-health
    volumes: [ "ticket-public:/keys:ro", "internal-tls:/tls:ro" ]
    restart: unless-stopped

  # Registers the workers with the controller (idempotent by name), then exits.
  data-attach:
    <<: *data-image
    entrypoint: ["/bin/sh", "-ec"]
    healthcheck: { disable: true }
    command:
      - |
        for spec in sql:8041 jobs:8042 documents:8043; do
          role=$${spec%%:*}; port=$${spec##*:}
          for i in $$(seq 1 30); do
            loamz-data attach --name "$$role" --role "$$role" --url "https://data-worker-$$role:$$port" --token-env LOAMZ_DATA_WORKER_TOKEN && break
            sleep 2
          done
        done
    environment:
      <<: *data-env
      LOAMZ_DATA_CONTROLLER_TOKEN: ${CONTROLLER_TOKEN:?}
      LOAMZ_DATA_WORKER_TOKEN: ${WORKER_TOKEN:?}
    volumes:
      - internal-tls:/tls:ro
    depends_on: [data-controller, data-worker-sql, data-worker-jobs, data-worker-documents]
    restart: "no"

  # ── Agent server: monolith ──────────────────────────────────────────────────
  agent-server:
    <<: [*agent-image, *nsjail]
    profiles: [agents, monolith]
    environment:
      <<: *agent-env
      SUBSTRATE_MODE: monolith
    volumes:
      - agent-data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT_AGENT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      seaweed-init: { condition: service_completed_successfully }
    restart: unless-stopped

  # ── Agent server: microservices (the gateway is the only published one) ─────
  agent-gateway:
    <<: *microservice
    environment:
      <<: *microservice-env
      SUBSTRATE_SERVICE: gateway
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT_AGENT:-8000}:8001"
  agent-policy:
    <<: *microservice
    environment: { <<: *microservice-env, SUBSTRATE_SERVICE: policy }
  agent-conversation:
    <<: *microservice
    environment: { <<: *microservice-env, SUBSTRATE_SERVICE: conversation }
  agent-job-controller:
    <<: *microservice
    environment: { <<: *microservice-env, SUBSTRATE_SERVICE: job_controller }
  agent-runtime:
    <<: *microservice
    environment: { <<: *microservice-env, SUBSTRATE_SERVICE: agent_runtime }
  agent-tool-executor:
    <<: *microservice
    environment: { <<: *microservice-env, SUBSTRATE_SERVICE: tool_executor }
  agent-human-gate:
    <<: *microservice
    environment: { <<: *microservice-env, SUBSTRATE_SERVICE: human_gate }
  agent-live-stream:
    <<: *microservice
    environment: { <<: *microservice-env, SUBSTRATE_SERVICE: live_stream }
  agent-admin:
    <<: *microservice
    environment: { <<: *microservice-env, SUBSTRATE_SERVICE: admin }

  # ── Web ─────────────────────────────────────────────────────────────────────
  agents-console:
    image: ${IMAGE_REGISTRY:-ghcr.io/ravikumarchavva}/loamz-agents-console:${IMAGE_TAG:-local}
    build: { context: ../.., dockerfile: deploy/docker/loamz-agents-console.Dockerfile }
    environment:
      BACKEND_API_URL: http://${AGENT_UPSTREAM:-agent-server:8000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-substrate}:${POSTGRES_PASSWORD}@postgres:5432/substrate_ui?sslmode=require
      OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://keycloak.localhost:8080}/realms/loamz
      OIDC_CLIENT_ID: agents-console
      OIDC_CLIENT_SECRET: ${AGENTS_CONSOLE_CLIENT_SECRET:-${SUBSTRATE_UI_CLIENT_SECRET:?}}
      SESSION_SECRET: ${UI_SESSION_SECRET:?}
      PUBLIC_URL: ${SUBSTRATE_UI_URL:-http://localhost:3000}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT_UI:-3000}:3000"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  data-workspace:
    image: ${IMAGE_REGISTRY:-ghcr.io/ravikumarchavva}/loamz-data-workspace:${IMAGE_TAG:-local}
    build: { context: ../.., dockerfile: deploy/docker/loamz-data-workspace.Dockerfile }
    environment:
      DATA_API_URL: http://data-api:8020
      LOAMZ_DATA_OIDC_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://keycloak.localhost:8080}/realms/loamz
      WEB_CLIENT_ID: data-workspace
      WEB_CLIENT_SECRET: ${DATA_WORKSPACE_CLIENT_SECRET:-${SUBSTRATE_DATA_WEB_CLIENT_SECRET:?}}
      WEB_SESSION_SECRET: ${WEB_SESSION_SECRET:?}
      WEB_PUBLIC_URL: ${SUBSTRATE_DATA_WEB_URL:-http://localhost:3011}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PORT_DATA_WEB:-3011}:3011"
    depends_on: [data-api]
    restart: unless-stopped

  # ── Retrieval models (profile "ml"): large downloads, CPU by default ────────
  llama-embed:
    image: ${IMAGE_REGISTRY:-ghcr.io/ravikumarchavva}/llama-server:${IMAGE_TAG:-local}
    build: { context: ../docker, dockerfile: llama-server.Dockerfile }
    profiles: [ml]
    command: ["--host", "0.0.0.0", "--port", "8031", "-hf", "Rizwan313/Qwen3-VL-Embedding-2B-GGUF:Q4_K_M", "--embedding", "--pooling", "last"]
    environment: { LLAMA_CACHE: /cache, PORT: "8031" }
    volumes: [ "llama-cache:/cache" ]
    restart: unless-stopped
  llama-rerank:
    image: ${IMAGE_REGISTRY:-ghcr.io/ravikumarchavva}/llama-server:${IMAGE_TAG:-local}
    build: { context: ../docker, dockerfile: llama-server.Dockerfile }
    profiles: [ml]
    command: ["--host", "0.0.0.0", "--port", "8032", "-hf", "staralt/Qwen3-VL-Reranker-2B-Q4_K_M-GGUF", "--reranking"]
    environment: { LLAMA_CACHE: /cache, PORT: "8032" }
    volumes: [ "llama-cache:/cache" ]
    restart: unless-stopped
  embedding-reranker:
    image: ${IMAGE_REGISTRY:-ghcr.io/ravikumarchavva}/loamz-data:${IMAGE_TAG:-local}
    build: { context: ../.., dockerfile: deploy/docker/loamz-data.Dockerfile }
    profiles: [ml]
    command: ["worker", "--role", "inference", "--host", "0.0.0.0", "--port", "8050"]
    environment:
      LOAMZ_DATA_BEHIND_TLS_PROXY: "true"
      LOAMZ_DATA_INFERENCE_PORT: "8050"
      LOAMZ_DATA_EMBEDDING_SERVER_URL: http://llama-embed:8031
      LOAMZ_DATA_RERANK_SERVER_URL: http://llama-rerank:8032
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8050/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on: [llama-embed, llama-rerank]
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-tls:
  internal-tls:
  redis-data:
  seaweed-data:
  seaweed-config:
  ticket-private:
  ticket-public:
  controller-state:
  data-api-state:
  agent-data:
  llama-cache:
