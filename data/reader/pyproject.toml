[project]
name = "loamz-data-reader"
version = "0.1.0"
description = "Loamz Data's document reader: layout-aware OCR, charts and tables as images, Office conversion and a pre-parse security scan, over HTTP."
readme = "README.md"
license = "MIT"
# PaddlePaddle publishes no Python 3.14 wheel yet, so this service runs on 3.13, outside the uv workspace, with its
# own lock. When a 3.14 wheel appears, raise requires-python and move it into the workspace.
requires-python = ">=3.13,<3.14"
# What every mode needs. The OCR engines are in the extras below, because they are gigabytes and platform-specific.
dependencies = [
    # the ExtractionResult wire format, the built-in reader (native mode) and the llama-server pool
    "loamz-data-storage[pdf]",
    "httpx>=0.28,<1",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.12.0",
    "pillow>=12.0.0",
    "numpy>=1.26.0",
    # the structural/security scan of an upload, before any parser touches it
    "doc-firewall>=0.5.1",
    # model provisioning: HF Hub lookups/downloads for the PaddleOCR-VL GGUF files
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
# PaddleOCR layout/chart/table extraction, CPU wheel: pick this or `paddle-gpu`, not both.
paddle = ["paddleocr[doc-parser]>=3.7.0", "paddlepaddle==3.3.0"]
# same, CUDA wheel, and NVML for the GPU detection chain
paddle-gpu = ["paddleocr[doc-parser]>=3.7.0", "paddlepaddle-gpu==3.3.0", "nvidia-ml-py>=12.0"]
test = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0", "pytest-xdist>=3.6", "httpx>=0.28", "pypdf>=6.13.0"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loamz.data.reader"

# Verified wheel indexes for PaddlePaddle: they are not on PyPI for these versions, and only apply when THIS project is
# the active uv project.
[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu130"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }
paddlepaddle-gpu = { index = "paddle-cu130" }
loamz-data-storage = { path = "../storage", editable = true }

[tool.ruff]
extend = "../../pyproject.toml"
target-version = "py313"

[tool.ruff.lint.isort]
known-first-party = ["loamz"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "heavy: runs a real document engine over real files (here it is fast: the raw-text engine and the scan, no PaddleOCR)",
    "slow: loads a real model",
]
