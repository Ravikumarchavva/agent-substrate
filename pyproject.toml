[project]
name = "agent-substrate"
version = "0.3.0"
description = "Durable Agents for Agent Swarms, LLMs, and Autonomous Systems"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ravikumar Chavva", email = "chavvaravikumarreddy2004@gmail.com" },
]
keywords = ["ai", "agents", "llm", "multi-agent", "autonomous", "fastapi", "async"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
requires-python = ">=3.11"
# The engine and nothing else: types, stores, runtime, agents, middleware. Everything that talks to a vendor,
# a database server, or a network — and everything the reference server needs — is an extra named for what it
# enables (docs/claude_docs/architecture/optional-dependencies.md). Rows I26/I31: importing `substrate` loads no driver, SDK or parser.
dependencies = [
    "pydantic>=2.12.5",
    "opentelemetry-api>=1.20.0",
    # the PDF text layer and page rendering (Apache-2.0/BSD-3, ~4 MB, no system libraries): a plain install reads documents
    "pypdfium2>=5.0.0",
]

# Full rationale for every extra below — size costs, version-pin reasoning,
# mutual-exclusivity rules — lives in
# docs/claude_docs/architecture/optional-dependencies.md, not here.
[project.optional-dependencies]
# OpenAI and OpenAI-compatible chat/embedding clients (also vLLM, llama.cpp, Ollama, LM Studio)
openai = ["openai>=2.15.0", "tiktoken>=0.12.0", "httpx>=0.27.0", "pillow>=10.4.0"]
# clients for the heavy services you run yourself (document extraction, embedding/reranking) — by URL
services = ["httpx2>=2.7.0"]
# the JSON log formatter for `substrate.logger.setup_logging` — what an application (a service) uses to configure logging
logging = ["python-json-logger>=2.0.7", "msgspec>=0.21.1"]
# PostgreSQL as the store (integrations.database.postgres_store); vectors also need the pgvector extension
postgres = ["asyncpg>=0.30.0"]
# Redis: session cache, event bus
redis = ["redis[hiredis]>=5.0.0"]
# scheduled/cron triggers
scheduler = ["apscheduler>=4.0.0a5"]
# MCP tools
mcp = ["mcp>=1.0.0"]
# text-to-speech
tts = ["kokoro>=0.9.4", "soundfile>=0.12.1"]
# skills and curated artifacts (YAML front matter)
tools = ["pyyaml>=6.0"]
# the interactive console and CLI chat
console = ["rich>=14.3.2", "prompt-toolkit>=3.0.0", "pydantic-settings>=2.12.0"]
# substrate.serve.add_routes: hand an agent object to a FastAPI app
serve = ["fastapi>=0.128.0"]
# the conformance suites and test helpers in substrate.testing (what an integration author runs)
testing = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0", "httpx>=0.27.0"]
# web search/browsing tools
web = [
    "httpx2>=2.7.0",
    "ddgs>=9.14.4",
    "crawl4ai>=0.8.7",
    "playwright>=1.60.0",
    "exa-py>=2.14.0",
    "tavily-python>=0.7.26",
]
# K8s code-interpreter sandbox (SANDBOX_RUNTIME=k8s)
code = ["k8s-agent-sandbox>=0.4.6"]
# code_interpreter's data-science packages
sandbox = [
    "pandas>=2.2.0",
    "matplotlib>=3.9.0",
    "openpyxl>=3.1.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "reportlab>=4.2.0",
    "polars>=1.0.0",
    "seaborn>=0.13.0",
    "plotly>=5.24.0",
    "scikit-learn>=1.5.0",
    "pdfplumber>=0.11.0",
]
# local PDF loading + embedded vector store
rag = ["pypdf>=6.13.0", "pytesseract>=0.3.10"]  # both go with the old extractors, removed with them
# model-based sentence segmentation (SaTSegmenter)
chunking = ["wtpsplit[onnx-cpu]>=2.1.0"]
# OCR without a system program: RapidOCR (PaddleOCR's own small models on ONNX Runtime, models inside the wheel). Preferred over the
# `tesseract` program automatically when installed. Pulls opencv-python; on a headless server install opencv-python-headless first.
ocr = ["rapidocr>=3.0.0", "onnxruntime>=1.20.0"]
# non-OpenAI LLM providers — LLMFactory lazy-imports each client, so only
# the provider(s) you actually select need to be installed
anthropic = ["anthropic>=0.95.0", "pillow>=10.4.0"]
gemini = ["google-genai>=1.73.0", "pillow>=10.4.0"]
# S3-compatible object storage backend (alternative to the default local-disk store)
s3 = ["aiobotocore>=3.7.0", "botocore>=1.43.0"]
# input-safety guardrail: jailbreak + NSFW classifiers (ONNX models via HF Hub) —
# degrades gracefully if missing (MultimodalSafetyMiddleware fails open), so not core
safety = [
    "pillow>=10.4.0",
    "onnxruntime>=1.20.0",
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.25.0",
    "confusable-homoglyphs>=3.3.1",
]
# local embedding provider (brings torch back)
sentence-transformers = ["sentence-transformers>=3.0.0"]

[project.urls]
Homepage = "https://agent-substrate.com"
Documentation = "https://agent-substrate.com/docs"
Repository = "https://github.com/Ravikumarchavva/agent-substrate"
Issues = "https://github.com/Ravikumarchavva/agent-substrate/issues"

[project.scripts]
substrate = "substrate.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "substrate"

# The PyTorch CPU wheel index for the sentence-transformers extra (local embeddings). The PaddleOCR indexes moved with
# the service that needs them: apps/document-intelligence/pyproject.toml.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "opentelemetry-sdk>=1.20.0",
    "import-linter>=2.11",
    "ipykernel>=7.2.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.15",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "mkdocstrings[python]>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# Tests marked ``heavy`` load real models (several GB, tens of seconds) and are left out of a plain run;
# CI and ``pytest -m ""`` run everything.
addopts = ["-m", "not heavy"]


[tool.ruff]
exclude = ["notebooks/", "examples/", ".venv"]

[tool.ruff.lint]

# ---------------------------------------------------------------------------
# import-linter — the boundaries of the engine, enforced rather than described.
#
#   substrate                 the engine: everything needed to run an agent
#   substrate.types    what the engine needs from outside (pure)
#   substrate.integrations             adapters over the abstractions (heavy services are reached by URL: integrations/services)
#   substrate.server / console / cli   the HTTP server and the terminal
#
# Run with: uv run lint-imports
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["substrate"]
# An import made only for type checking never runs, so it cannot make a layer drag another along.
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "the core imports nothing outside it"
type = "forbidden"
source_modules = [
    "substrate.types",
    "substrate.telemetry",
    "substrate.tools",
    "substrate.models",
    "substrate.stores",
    "substrate.documents",
    "substrate.workspace",
    "substrate.safety",
    "substrate.context",
    "substrate.middleware",
    "substrate.runtime",
    "substrate.agents",
    "substrate.testing",
    "substrate.version",
]
forbidden_modules = [
    "substrate.evals",
    "substrate.integrations",
    "substrate.server",
    "substrate.console",
    "substrate.cli",
    "substrate.logger",
]

[[tool.importlinter.contracts]]
name = "the server is the engine over HTTP, and imports only the engine"
type = "forbidden"
# substrate.server is what `create_app(agent)` gives a downstream project: it sits on Runtime and the contracts, with
# FastAPI as its one framework. It must not reach an adapter, the reference deployment, or how an agent is built.
source_modules = ["substrate.server"]
forbidden_modules = [
    "substrate.agents",
    "substrate.integrations",
    "substrate.console",
    "substrate.cli",
    "substrate.evals",
]

[[tool.importlinter.contracts]]
name = "the core's concepts only import downward"
type = "layers"
# Top first. tests/_layout.py holds the same order for the register row.
layers = [
    "substrate.testing",
    "substrate.agents",
    "substrate.runtime",
    "substrate.middleware",
    "substrate.context",
    "substrate.safety",
    "substrate.workspace",
    "substrate.documents",
    "substrate.stores",
    "substrate.models",
    "substrate.tools",
    "substrate.telemetry",
    "substrate.types",
]

[[tool.importlinter.contracts]]
name = "adapters depend on the contracts and the engine's support libraries, not how it runs an agent"
type = "forbidden"
# What an adapter (integrations/) may use from the core: the contracts it implements, and
#   models            capability registry, modality fitting, tool-argument parsing, error classification
#   workspace         object-key layout, content-addressed store, scope
#   stores            the folder stores that the cloud stores wrap or reuse, tenant binding
#   safety            text normalisation shared by the guardrail and the classifiers
#   tools, runtime    Toolbox / ToolInvoker (the chain and pipeline tools) and Runtime / RunContext / the
#                     SQL runtime store (triggers, human input, the Postgres store)
#   telemetry         spans and metrics
# These are pure or reusable by design. What it may not reach is how the engine runs an agent — the
# agents, the context window, middleware — because depending on those is how an adapter ends up coupled
# to behaviour that is free to change.
source_modules = ["substrate.integrations"]
forbidden_modules = [
    "substrate.agents",
    "substrate.context.builder",
    "substrate.context.compaction",
    "substrate.context.context",
    "substrate.context.history",
    "substrate.context.tokens",
    "substrate.middleware._contracts",
    "substrate.middleware.audit_logger",
    "substrate.middleware.cache",
    "substrate.middleware.content_truncator",
    "substrate.middleware.file_validator",
    "substrate.middleware.guardrails",
    "substrate.middleware.history_truncator",
    "substrate.middleware.pipeline",
    "substrate.middleware.rate_limiter",
    "substrate.middleware.retry",
    "substrate.middleware.schema_validator",
]
allow_indirect_imports = "true"

# Not part of this package at all: the multi-tenant platform (apps/substrate-cloud — it carries its own import contract) and
# the heavy services (apps/, packages/ — reached by URL through integrations/services).
