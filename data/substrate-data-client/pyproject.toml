[project]
name = "substrate-data-client"
version = "0.2.0"
description = "Python client for Substrate Data: governed SQL, catalog and files (sync and asyncio)"
readme = "README.md"
requires-python = ">=3.13"
# The core is deliberately tiny: this is what a code-interpreter sandbox or a service installs.
dependencies = ["httpx>=0.28,<1"]

[project.optional-dependencies]
# Arrow/Polars results (`sd.sql`, `sd.arrow`, `sd.stream`). The sandbox image installs this extra.
arrow = ["polars>=1.44.2,<2", "pyarrow>=22,<27"]
# HTTP/2 multiplexing for the async client; used automatically when installed.
http2 = ["httpx[http2]>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "polars>=1.44.2,<2", "pyarrow>=22,<27"]

[build-system]
requires = ["uv_build>=0.10.11,<0.11.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "substrate_data_client"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
