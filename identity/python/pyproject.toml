[project]
name = "loamz-identity"
version = "0.1.0"
description = "Token verification and tenancy rules shared by every Loamz service."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["pyjwt[crypto]>=2.10", "httpx>=0.28,<1"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115,<1"]

[dependency-groups]
dev = ["pytest>=9", "pytest-asyncio>=1.4", "pytest-xdist>=3.6", "pytest-timeout>=2.3"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "loamz.identity"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-m", "not slow and not integration"]
markers = ["slow: needs Docker or minutes of runtime", "integration: needs Docker services"]
