    - 2 · The In-Process Runtime: agents/02-runtime.md
    - 3 · Context, Compaction & Memory: agents/03-context-and-memory.md
    - Advanced Memory:
      - Overview: concepts/advanced-memory.md
      - Vector Memory: concepts/vector-memory.md
      - Graph Memory: concepts/graph-memory.md
      - Paged Memory: concepts/paged-memory.md
    - 4 · The LLM Stack: agents/04-llm-stack.md
    - 5 · Middleware & Guardrails: agents/05-middleware-and-guardrails.md
    - 6 · Tools — Toolbox & Invoker: agents/06-tools.md
    - 7 · Supervision, Budgets & Hooks: agents/07-supervision-and-hooks.md

  - Capabilities Layer (L2):
    - Overview: capabilities/index.md
    - 1 · Tools: capabilities/01-tools.md
    - 2 · Skills: capabilities/02-skills.md
    - 3 · Tool Chain: capabilities/03-tool-chain.md
    - 4 · Knowledge & RAG: capabilities/04-knowledge-rag.md
    - 5 · Memory & History: capabilities/05-memory-and-history.md
    - 6 · Storage & Pipeline: capabilities/06-storage-and-pipeline.md
    - 7 · Triggers: capabilities/07-triggers.md

  - GitHub: https://github.com/Ravikumarchavva/agent-substrate
