# Docling Extraction Service — Kubernetes Deployment
#
# Structure-aware document parsing (PDF/DOCX/PPTX layout, tables, OCR) for
# chat attachments, isolated from the main API process — it pulls torch +
# transformers + the full CUDA/cuDNN/NCCL runtime (~4GB) even for CPU-only
# use, and model inference is slow enough that running it inline would
# block chat responses (see pyproject.toml's `docling` extra comment).
#
# Unlike code-interpreter, this is a plain Deployment, not a StatefulSet:
# extraction is stateless request/response with no session affinity, so
# there's no need for consistent-hash routing or per-pod identity. No HPA
# either — model-loaded pods are expensive to spin up, so CPU-based
# autoscaling churn costs more than it saves at this scale; scale by
# editing `replicas` directly if throughput becomes a bottleneck.
#
# Optional: the monolith/services only call this when DOCLING_SERVICE_URL
# is set (see config.py). Not setting it (or this Deployment not existing)
# just means chat attachments fall back to the lightweight pypdf path for
# PDFs — no hard dependency.

apiVersion: v1
kind: Service
metadata:
  name: docling
  namespace: af-runtime
  labels:
    app: docling
spec:
  selector:
    app: docling
  ports:
    - port: 8080
      targetPort: http
      name: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: docling
  namespace: af-runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: docling
  namespace: af-runtime
  labels:
    app: docling
    af.service-role: docling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: docling
  template:
    metadata:
      labels:
        app: docling
        af.service-role: docling
    spec:
      serviceAccountName: docling
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: docling
          image: ghcr.io/example/agent-framework/docling:0.1.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # docling caches model weights under $HOME
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: runtime-secrets
          env:
            - name: SERVICE_NAME
              value: docling
          resources:
            requests:
              cpu: 1000m
              memory: 2Gi
            limits:
              cpu: 4000m
              memory: 6Gi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /v1/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 3
