[project]
name = "document-intelligence"
version = "0.1.0"
description = "Document extraction over HTTP: layout-aware OCR, charts and tables as images, Office conversion, and a pre-parse security scan."
requires-python = ">=3.11"
# What every mode needs. The OCR engines are in the extras below, because they are gigabytes and platform-specific.
dependencies = [
    "agent-substrate[services,logging]",
    "inference-pool",
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.12.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    # the structural/security scan of an upload, before any parser touches it
    "doc-firewall>=0.5.1",
    # model provisioning: HF Hub lookups/downloads for the PaddleOCR-VL GGUF files
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
# PaddleOCR layout/chart/table extraction, CPU wheel — pick this or `paddle-gpu`, not both
paddle = ["paddleocr[doc-parser]>=3.7.0", "paddlepaddle==3.3.0"]
# same, CUDA wheel, and NVML for the GPU detection chain
paddle-gpu = ["paddleocr[doc-parser]>=3.7.0", "paddlepaddle-gpu==3.3.0", "nvidia-ml-py>=12.0"]
test = ["pytest>=9.0.3", "pytest-asyncio>=1.4.0", "httpx>=0.27.0", "pypdf>=6.13.0"]

[build-system]
requires = ["uv_build>=0.11.16,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "document_intelligence"

# Verified wheel indexes for PaddlePaddle: they are not on PyPI for these versions, and only apply when THIS project is
# the active uv project (a consumer of the extras must replicate the entry it needs).
[[tool.uv.index]]
name = "paddle-cpu"
url = "https://www.paddlepaddle.org.cn/packages/stable/cpu/"
explicit = true

[[tool.uv.index]]
name = "paddle-cu130"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu130/"
explicit = true

[tool.uv.sources]
paddlepaddle = { index = "paddle-cpu" }
paddlepaddle-gpu = { index = "paddle-cu130" }
agent-substrate = { path = "../..", editable = true }
inference-pool = { path = "../../packages/inference-pool", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["heavy: runs a real document engine over real files (here it is fast: the raw-text engine and the scan, no PaddleOCR)"]
