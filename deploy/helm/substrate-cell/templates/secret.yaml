{{- if and (not .Values.secrets.existingSecret) .Values.secrets.generate }}
{{- $name := include "cell.secretName" . }}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- /* Keep what is already there (so upgrades never rotate); invent only what is missing. */ -}}
{{- $v := dict }}
{{- $_ := set $v "postgres-password" (include "cell.pick" (dict "old" $old "key" "postgres-password" "fresh" (randAlphaNum 32))) }}
{{- $_ := set $v "redis-password" (include "cell.pick" (dict "old" $old "key" "redis-password" "fresh" (randAlphaNum 32))) }}
{{- $_ := set $v "keycloak-admin-password" (include "cell.pick" (dict "old" $old "key" "keycloak-admin-password" "fresh" (randAlphaNum 32))) }}
{{- $_ := set $v "ui-client-secret" (include "cell.pick" (dict "old" $old "key" "ui-client-secret" "fresh" (randAlphaNum 40))) }}
{{- $_ := set $v "data-web-client-secret" (include "cell.pick" (dict "old" $old "key" "data-web-client-secret" "fresh" (randAlphaNum 40))) }}
{{- $_ := set $v "cell-admin-client-secret" (include "cell.pick" (dict "old" $old "key" "cell-admin-client-secret" "fresh" (randAlphaNum 40))) }}
{{- $_ := set $v "control-s3-access-key-id" (include "cell.pick" (dict "old" $old "key" "control-s3-access-key-id" "fresh" (printf "SDC%s" (randNumeric 12)))) }}
{{- $_ := set $v "control-s3-secret-access-key" (include "cell.pick" (dict "old" $old "key" "control-s3-secret-access-key" "fresh" (randAlphaNum 40))) }}
{{- $_ := set $v "worker-s3-access-key-id" (include "cell.pick" (dict "old" $old "key" "worker-s3-access-key-id" "fresh" (printf "SDW%s" (randNumeric 12)))) }}
{{- $_ := set $v "worker-s3-secret-access-key" (include "cell.pick" (dict "old" $old "key" "worker-s3-secret-access-key" "fresh" (randAlphaNum 40))) }}
{{- $_ := set $v "agents-s3-access-key-id" (include "cell.pick" (dict "old" $old "key" "agents-s3-access-key-id" "fresh" (printf "SDA%s" (randNumeric 12)))) }}
{{- $_ := set $v "agents-s3-secret-access-key" (include "cell.pick" (dict "old" $old "key" "agents-s3-secret-access-key" "fresh" (randAlphaNum 40))) }}
{{- $_ := set $v "controller-token" (include "cell.pick" (dict "old" $old "key" "controller-token" "fresh" (randAlphaNum 48))) }}
{{- $_ := set $v "worker-token" (include "cell.pick" (dict "old" $old "key" "worker-token" "fresh" (randAlphaNum 48))) }}
{{- $_ := set $v "web-session-secret" (include "cell.pick" (dict "old" $old "key" "web-session-secret" "fresh" (randAlphaNum 48))) }}
{{- $_ := set $v "ui-session-secret" (include "cell.pick" (dict "old" $old "key" "ui-session-secret" "fresh" (randAlphaNum 48))) }}
{{- $_ := set $v "mask-salt" (include "cell.pick" (dict "old" $old "key" "mask-salt" "fresh" (randAlphaNum 24))) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cell.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- range $k, $val := $v }}
  {{ $k }}: {{ $val | quote }}
  {{- end }}
{{- if .Values.s3.bundled.enabled }}
{{- /* SeaweedFS reads its identities from a file, so it is rendered here from the very same values. */ -}}
{{- $b := .Values.s3.buckets }}
{{- $rwl := list "Read" "Write" "List" }}
{{- $ids := list
  (dict "name" "substrate-control" "credentials" (list (dict "accessKey" (index $v "control-s3-access-key-id") "secretKey" (index $v "control-s3-secret-access-key")))
    "actions" (concat (list (printf "s3tables:*:%s" $b.warehouse)) (include "cell.actions" (dict "b" $b.warehouse "l" $rwl) | fromJsonArray) (include "cell.actions" (dict "b" $b.staging "l" $rwl) | fromJsonArray) (include "cell.actions" (dict "b" $b.volumes "l" $rwl) | fromJsonArray)))
  (dict "name" "substrate-worker" "credentials" (list (dict "accessKey" (index $v "worker-s3-access-key-id") "secretKey" (index $v "worker-s3-secret-access-key")))
    "actions" (concat (include "cell.actions" (dict "b" $b.warehouse "l" $rwl) | fromJsonArray) (include "cell.actions" (dict "b" $b.staging "l" (list "Read" "List")) | fromJsonArray)))
  (dict "name" "substrate-agents" "credentials" (list (dict "accessKey" (index $v "agents-s3-access-key-id") "secretKey" (index $v "agents-s3-secret-access-key")))
    "actions" (include "cell.actions" (dict "b" $b.agents "l" $rwl) | fromJsonArray)) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cell.fullname" . }}-seaweedfs-s3
  labels:
    {{- include "cell.labels" . | nindent 4 }}
type: Opaque
stringData:
  s3.json: |
    {{- dict "identities" $ids | toPrettyJson | nindent 4 }}
{{- end }}
{{- end }}
